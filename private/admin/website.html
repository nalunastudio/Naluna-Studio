<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website — Admin NALUNA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/shared.css">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-sidebar">
    <div class="admin-logo-row"><img src="/logo.svg" alt="NALUNA"><span>Admin</span></div>
    <div class="admin-nav">
      <a href="/admin">Dashboard</a>
      <a href="/admin/orders">Comenzi</a>
      <a href="/admin/social">Social Media</a>
      <a href="/admin/website" class="active">Website</a>
      <a href="/admin/system">Sistem</a>
    </div>
  </nav>
  <main class="admin-main">
    <div class="admin-header-row">
      <div>
        <h1>Website — Reacții clienți</h1>
        <div class="admin-header-sub">Adaugi și gestionezi manual reacțiile afișate pe homepage. Clienții nu pot trimite singuri conținut.</div>
      </div>
    </div>

    <div class="t-form">
      <form id="t-form">
        <input type="hidden" id="t-edit-id" value="">
        <div class="t-form-row">
          <div class="t-field">
            <label for="t-name">Prenume client</label>
            <input type="text" id="t-name" maxlength="80" required>
          </div>
          <div class="t-field">
            <label for="t-location">Oraș / țară</label>
            <input type="text" id="t-location" maxlength="100" placeholder="ex: Londra, UK">
          </div>
        </div>
        <div class="t-field">
          <label for="t-quote">Citat scurt</label>
          <textarea id="t-quote" maxlength="500" required></textarea>
        </div>
        <div class="t-form-row">
          <div class="t-field">
            <label for="t-type">Tip reacție</label>
            <select id="t-type">
              <option value="text">Doar text</option>
              <option value="image">Imagine</option>
              <option value="video">Video</option>
              <option value="audio">Audio</option>
            </select>
          </div>
          <div class="t-field" id="t-file-field">
            <label for="t-file">Fișier (imagine / video / audio)</label>
            <input type="file" id="t-file" accept="image/*,video/*,audio/*">
          </div>
        </div>
        <div class="t-check">
          <input type="checkbox" id="t-published">
          <label for="t-published">Publicată — vizibilă pe homepage. Dacă e debifat, reacția se salvează dar rămâne ascunsă</label>
        </div>
        <div class="t-check consent">
          <input type="checkbox" id="t-consent" required>
          <label for="t-consent"><strong>Confirm</strong> că am acordul explicit al clientului pentru a publica acest nume, oraș și conținut pe site</label>
        </div>
        <div class="t-form-actions">
          <button type="submit" class="btn-primary" id="t-submit-btn">Salvează reacția</button>
          <button type="button" class="btn-secondary" id="t-cancel-btn" style="display:none;">Anulează editarea</button>
        </div>
        <div class="t-form-msg" id="t-form-msg"></div>
      </form>
    </div>

    <div class="t-list" id="t-list"></div>
  </main>
</div>
<script src="/admin/website.js"></script>
</body>
</html>
