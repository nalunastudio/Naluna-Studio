# nixpacks.toml — PASTRAT DOAR PENTRU REFERINTA ISTORICA.
#
# HOTFIX 2026-08-07: confirmat direct in build logs Railway ("using build driver
# railpack-v0.35.0") ca proiectul a migrat de la builder-ul Nixpacks la **Railpack** — acest
# fisier NU mai e citit de build-ul curent. Pachetele de sistem reale (ffmpeg, exiftool) sunt
# instalate prin variabila de mediu `RAILPACK_DEPLOY_APT_PACKAGES`, setata direct pe fiecare
# serviciu Railway (staging + productie), NU printr-un fisier din git. Vezi README.md.
#
# Descoperit cand testul real cu un fisier DNG a esuat pe staging desi codul functiona local:
# adaugarea lui "exiftool" AICI nu avea niciun efect (build-ul nu citea deloc fisierul), fara
# nicio eroare vizibila — repara reala a fost `railway variables --set
# "RAILPACK_DEPLOY_APT_PACKAGES=... ffmpeg exiftool"` pe fiecare serviciu.
[phases.setup]
nixPkgs = ["...", "ffmpeg", "exiftool"]
