<html lang="ro">

<style>
  :root{
    --bg:#FAF8F5; --bg-secondary:#F8F6F2; --surface:#FDFCFA;
    --text:#2B2B2B; --text-secondary:#6B6B6B;
    --gold:#A8834B; --gold-deep:#8B6D3F; --line:#E8E2D6;
    --success:#5F8F6E; --error:#B3574A;
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:'Sora', sans-serif; min-height:100vh; margin:0; }
  .wrap{ max-width:560px; margin:0 auto; padding:48px 20px 64px; }
  .logo-mark{ width:44px; margin-bottom:28px; display:block; }
  h1{ font-family:'Fraunces', serif; font-weight:400; font-size:26px; margin-bottom:8px; }
  h2{ font-family:'Fraunces', serif; font-weight:400; font-size:17px; margin:0 0 6px; }
  p.sub{ color:var(--text-secondary); font-size:14px; margin-bottom:22px; }
  .blocked-banner{
    background:var(--bg-secondary); border:1px solid var(--gold); border-radius:14px;
    padding:16px 18px; margin-bottom:24px; font-size:15px; line-height:1.5;
  }
  .order{
    display:block; background:var(--bg-secondary); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:16px; text-decoration:none; color:inherit;
    transition:border-color .2s ease, transform .15s ease;
  }
  .order:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .order .title{ font-weight:600; font-family:'Fraunces', serif; font-size:17px; }
  .order .song-title{ font-style:italic; color:#4a4a4a; margin-top:2px; font-size:14px; }
  .order .for-line{ color:var(--text-secondary); font-size:14px; margin-top:4px; }
  .order .count-line{ color:var(--text-secondary); font-size:14px; margin-top:2px; }
  /* VIEW/LISTEN MODE (2026-09-30, decizie explicita de produs, "email -> lista -> Play") — cardul
     unei comenzi gasite STRICT prin email (fara token local) NU e clicabil (nu ofera acces
     complet) — STRICT informativ + player(e) audio pentru preview-urile deja publice. */
  .order-readonly{ cursor:default; }
  .order-readonly:hover{ border-color:var(--line); transform:none; }
  .order-readonly audio{ width:100%; margin-top:10px; display:block; }
  .order-readonly .view-only-note{ color:var(--text-secondary); font-size:12px; margin-top:10px; margin-bottom:0; }
  .status{
    font-size:11px; padding:4px 10px; border-radius:999px; text-transform:uppercase;
    letter-spacing:.06em; font-family:'Sora',sans-serif; display:inline-block; margin-top:8px;
  }
  .status-ready{ background:rgba(95,143,110,.14); color:var(--success); }
  .status-progress{ background:rgba(168,131,75,.14); color:var(--gold-deep); }
  .empty{ color:var(--text-secondary); font-size:14px; }
  button{
    background:var(--text); color:var(--bg); border:none; border-radius:10px;
    padding:12px 20px; font-weight:500; font-size:14px; cursor:pointer;
    transition:background-color .25s ease; font-family:'Sora',sans-serif;
    display:inline-block;
  }
  button:hover{ background:var(--gold-deep); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  /* IESIRE CLARA (2026-09-28, cerinta explicita, "BACK / NAVIGATION") — "Foloseste alt email":
     link discret (nu CTA-ul dominant al comenzilor), dar clar si accesibil — revine la email
     gate pe comanda.html, fara sa stearga naluna_my_order_keys/comenzile deja autorizate. */
  .link-btn{
    background:none; border:none; color:var(--text-secondary); font-size:13px;
    text-decoration:underline; text-underline-offset:2px; padding:0; cursor:pointer;
    font-family:'Sora',sans-serif; display:inline-block; margin-bottom:20px;
  }
  .link-btn:hover{ color:var(--gold-deep); }
  /* IERARHIE VIZUALA (2026-09-28, cerinta explicita) — recovery-ul prin email ramane DOAR
     mecanism secundar (alt browser/dispozitiv, sau tokenuri locale pierdute): titlu mai mic,
     font sans-serif obisnuit (nu Fraunces ca titlurile principale), contrast secundar, buton
     discret tip "ghost" (nu CTA-ul solid, dominant, folosit pentru comenzi) — DOAR stil, NU
     functionalitate: ramane complet vizibil/accesibil, niciodata ascuns. */
  .recovery-box{
    margin-top:32px; padding-top:20px; border-top:1px solid var(--line);
  }
  .recovery-box h2{
    font-family:'Sora', sans-serif; font-weight:600; font-size:14px;
    color:var(--text-secondary); margin:0 0 4px;
  }
  .recovery-box p.sub{ font-size:12px; margin-bottom:12px; }
  .recovery-box input[type="email"]{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:'Sora', sans-serif; font-size:13px;
    margin-bottom:10px;
  }
  .recovery-box button{
    background:transparent; color:var(--text-secondary); border:1px solid var(--line);
    font-size:13px; padding:10px 16px;
  }
  .recovery-box button:hover{ background:var(--bg-secondary); color:var(--gold-deep); border-color:var(--gold); }
  .recovery-result{ font-size:12px; color:var(--text-secondary); margin-top:10px; }
</style>
</head>

    <button type="button" id="recovery-btn">Vezi comenzile mele</button>

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;

  // CORECTIE (2026-09-27, "Pentru Pentru sotia mea" — bug REAL raportat): campul liber
  // "recipient" poate contine deja, scris de client, un prefix natural echivalent cu eticheta
  // afisata aici ("Pentru"/"For"/etc.) — cand eticheta e adaugata DIN NOU, rezultatul devine
  // vizibil dublat. NU modifica valoarea din DB — STRICT normalizare de prezentare, identica cu
  // cea din server.js (stripRedundantForPrefix) si din comanda-mea.html/melodia-mea.html.
  const FOR_WORD_BY_LANG = { ro: 'pentru', en: 'for', de: 'für', es: 'para', it: 'per', fr: 'pour', bg: 'за', tr: 'için' };
  function stripRedundantForPrefix(value, activeLang) {
    const v = String(value || '').trim();
    if (!v) return v;
    const word = (FOR_WORD_BY_LANG[activeLang] || FOR_WORD_BY_LANG.ro).toLowerCase();
    const lower = v.toLowerCase();
    if (lower === word) return '';
    if (lower.startsWith(word + ' ')) return v.slice(word.length).trim();
    return v;
  }

  // fiecare accessToken ramane exact acelasi mecanism per-comanda deja auditat (48 caractere
  // hex, verificat timing-safe server-side); lista e STRICT o comoditate client-side, niciodata
  // trimisa nicaieri altundeva decat catre GET /api/orders/:id?token=... (acelasi endpoint deja
  // folosit de melodia-mea.html).
  const STORAGE_KEY = 'naluna_my_order_keys';
  function loadKnownOrders() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter((o) => o && o.id && o.token) : [];
    } catch (e) { return []; }
  }
  function saveKnownOrders(list) {
    try {
      // plafon defensiv — evita cresterea nemarginita a localStorage pentru un browser folosit
      // foarte mult timp; cele mai VECHI intrari sunt eliminate primele.
      const capped = list.slice(-50);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(capped));
    } catch (e) { /* localStorage indisponibil (mod privat strict etc.) — pagina tot functioneaza, doar nu retine local */ }
  }
  function mergeOrder(list, id, token) {
    const idx = list.findIndex((o) => o.id === id);
    if (idx !== -1) { list[idx].token = token; return list; }
    list.push({ id, token });
    return list;
  }

  let known = loadKnownOrders();
  const params = new URLSearchParams(window.location.search);
  const singleToken = params.get('token');
  const multiTokens = params.get('tokens');
  // id-ul nu vine niciodata din URL pentru aceste linkuri (STRICT tokenul) — GET
  // /api/orders/access/:token intoarce id-ul comenzii asociate, verificat server-side.
  const incomingTokens = [];
  if (singleToken) incomingTokens.push(singleToken);
  if (multiTokens) incomingTokens.push(...multiTokens.split(',').map((s) => s.trim()).filter(Boolean));

  // SECURITATE (2026-09-27, audit token-uri in URL): token-urile sunt STRICT credentiale de acces
  // (accessToken, 48 hex, acelasi mecanism auditat ca peste tot in site) — o data capturate mai
  // sus, in memorie (incomingTokens), NU mai au niciun motiv sa ramana vizibile in bara de adrese.
  // CRITIC: curatarea se face AICI, SINCRON, imediat — NU dupa validarea server-side (fetch) de
  // mai jos, care e asincrona. Motiv: analytics.js incarca GA4/Meta Pixel STRICT la
  // DOMContentLoaded (vezi initConsentUi), eveniment care se declanseaza dupa ce parserul termina
  // TOT documentul, inclusiv acest <script> — dar NU asteapta rezultatul niciunui fetch al nostru.
  // Daca am fi curatat URL-ul abia dupa ce se termina fetch-ul (asincron) catre
  // /api/orders/access/:token, ar fi existat o cursa reala: pentru un vizitator care are deja
  // consimtamant Analytics/Marketing acordat dintr-o vizita anterioara, gtag.js/fbevents.js s-ar
  // putea incarca si trimite automat un page_view/PageView cu window.location.href INAINTE ca
  // fetch-ul nostru sa se termine — expunand token-urile catre Google/Meta. Curatand SINCRON,
  // aici, URL-ul nu mai contine niciodata token-uri incepand din acest moment al parsarii, cu mult
  // inainte de DOMContentLoaded — indiferent de viteza retelei pentru fetch-ul de validare.
  if (incomingTokens.length > 0) {
    const clean = new URL(window.location.href);
    clean.searchParams.delete('token');
    clean.searchParams.delete('tokens');
    window.history.replaceState(null, '', clean.toString());
  }

  // AUDIT (2026-09-28, "mesajele trebuie sa reflecte starea reala"): mai inainte, acest banner
  // era afisat AICI, sincron, STRICT pe baza parametrului din URL — inainte sa se stie daca
  // lista reala de comenzi (mai jos, asincron) contine ceva. Rezultat REAL posibil: quota (403,
  // vezi comanda.html) e verificata server-side dupa EMAIL, nu dupa acest browser — un client
  // care a mai comandat de pe alt dispozitiv/browser cu acelasi email poate ajunge aici
  // (?blocked=1) chiar daca ACEST browser nu are niciun token local — banner-ul ar fi afirmat
  // fals "ai deja melodii create" langa o lista goala. Decizia se ia acum STRICT in
  // loadAndRenderOrders(), dupa ce se stie numarul real de comenzi eligibile.
  const wasBlocked = params.get('blocked') === '1';

  // RECOVERY AUTOMAT SECURIZAT (2026-09-28, cerinta explicita, "BLOCKER URGENT") — emailul e
  // transmis STRICT prin sessionStorage (niciodata URL/query), de la comanda.html, DOAR pe
  // traseul de blocare quota (vezi acel fisier) — citit O SINGURA DATA aici si sters imediat, ca
  // sa nu ramana disponibil pentru o vizita ulterioara neinrudita a acestei pagini. Absenta lui
  // (sessionStorage indisponibil, sau clientul a ajuns aici altfel decat prin redirectul de
  // blocare) e un caz normal, tratat identic cu inainte — recovery manual, neschimbat.
  let pendingRecoveryEmail = '';
  try {
    pendingRecoveryEmail = sessionStorage.getItem('naluna_pending_recovery_email') || '';
    sessionStorage.removeItem('naluna_pending_recovery_email');
  } catch (e) { /* sessionStorage indisponibil — recovery ramane STRICT manual */ }

  async function resolveIncomingTokens() {
    for (const token of incomingTokens) {
      if (!/^[0-9a-f]{48}$/i.test(token)) continue;
      try {
        const res = await fetch('/api/orders/access/' + encodeURIComponent(token));
        if (!res.ok) continue;
        const o = await res.json();
        known = mergeOrder(known, o.id, token);
      } catch (e) { /* ignoram — restul comenzilor cunoscute local tot se incarca */ }
    }
    if (incomingTokens.length > 0) saveKnownOrders(known);
  }

  function planName(plan) {
    return (t.plan && t.plan[plan]) || plan;
  }

  // NUMARUL REAL de melodii disponibile/autorizate pentru aceasta comanda (2026-09-28, cerinta
  // explicita) — STRICT din datele reale primite de la server, nicio presupunere:
  //  - dupa plata (status='ready'): melodia principala (mereu 1) + melodia cadou (hasGiftAudio)
  //    + bonusul surpriza Premium (hasPremiumBonusAudio) — EXACT aceeasi regula (lib/entitlements.js)
  //    ca pagina de ascultare (comanda-mea.html), acum expusa si de GET /api/orders/:id.
  //  - inainte de plata (status!=='ready'): numarul de variante cu previzualizare reala disponibila
  //    (order.variants[].previewUrl) — poate fi 0 daca melodia se compune inca.
  // EMAIL (2026-09-30) — POST /api/orders/by-email intoarce deja songCount CALCULAT server-side
  // (DTO minimal, fara variants/previewUrl expuse) — folosit direct daca prezent, aceeasi regula,
  // acelasi rezultat, nicio dubla logica de intretinut.
  function realSongCount(order) {
    if (typeof order.songCount === 'number') return order.songCount;
    if (order.status === 'ready') {
      return 1 + (order.hasGiftAudio ? 1 : 0) + (order.hasPremiumBonusAudio ? 1 : 0);
    }
    if (Array.isArray(order.variants)) {
      return order.variants.filter((v) => v.previewUrl).length;
    }
    return 0;
  }

  // DESTINATIE (2026-09-28, audit "reutilizeaza pagina corecta, nu crea un al doilea sistem"):
  // melodia-mea.html arata STRICT starea de "melodia ta a fost livrata deja pe email" pentru
  // comenzi 'ready' — NU redă niciun player pentru comenzi platite (verificat direct in cod,
  // showState('paid-state'), fara niciun <audio>). Pagina care CHIAR reda/descarca melodiile
  // platite (principala + cadou + bonus), folosind ACELASI accessToken, e comanda-mea.html
  // (?token=, acelasi GET /api/orders/access/:token) — construita STRICT pentru asta. Pentru
  // orice alta stare (inca in compunere/preview/editare), melodia-mea.html ramane pagina corecta
  // (gestioneaza deja toate gate-urile Standard/Premium/Video, inclusiv redirectul propriu catre
  // se-compune.html cand generarea e inca in curs).
  function continueUrlFor(order, token) {
    if (order.status === 'ready') {
      return `/comanda-mea.html?token=${encodeURIComponent(token)}`;
    }
    return `/melodia-mea.html?id=${encodeURIComponent(order.id)}&token=${encodeURIComponent(token)}`;
  }

  // EMAIL SUFICIENT (2026-09-30, decizie explicita de produs) — cauta comenzile eligibile ale
  // unui email DIRECT pe server, fara sa astepte niciun link din email. STRICT citire (server.js,
  // POST /api/orders/by-email: db.getEligibleOrdersForAccessRecovery, acelasi criteriu ca la
  // recuperare/quota) — nu creeaza nicio comanda, nu atinge quota, nu apeleaza Suno/Stripe, nu
  // trimite niciun email. Raspunsul NU contine niciodata accessToken/email/date administrative —
  // STRICT campurile necesare UI-ului, plus un continueUrl deja construit server-side. `ok:false`
  // (eroare de retea/server) e distinct explicit de "email confirmat cu 0 comenzi" — acelasi tipar
  // deja folosit pentru tokenurile locale (confirmed/gone/unknown) — o eroare temporara NU trebuie
  // sa afirme fals "nicio comanda".
  async function lookupOrdersByEmail(email) {
    try {
      const res = await fetch('/api/orders/by-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (!res.ok) return { ok: false, orders: [] };
      const data = await res.json();
      return { ok: true, orders: Array.isArray(data.orders) ? data.orders : [] };
    } catch (e) { return { ok: false, orders: [] }; }
  }

  // Cardul intreg e un link (<a>) catre propria comanda — clientul apasa oriunde pe card ca sa
  // intre si sa asculte variantele deja disponibile/autorizate (pe pagina corecta, de mai sus).
  // NU mai redam playere audio AICI (ar fi un al doilea sistem de redare, duplicat) — STRICT un
  // sumar clar: "Comanda N — Pachet" / titlul melodiei (daca exista) / "Pentru destinatar" /
  // "N melodii" (date reale, niciodata inventate), plus statusul (Gata/Se compune).
  function orderCardBodyHtml(order, index) {
    const isReady = order.status === 'ready';
    const accessExpired = isReady && !!order.hostedAccessExpired;
    const statusLabel = isReady ? t.status_ready : t.status_progress;
    const statusClass = isReady ? 'status-ready' : 'status-progress';
    const count = realSongCount(order);
    const titleHtml = order.songTitle ? `<div class="song-title">${escapeHtml(order.songTitle)}</div>` : '';
    return `
      <div class="title">${escapeHtml(t.order_label)} ${escapeHtml(String(index))} — ${escapeHtml(planName(order.plan))}</div>
      ${titleHtml}
      <div class="for-line">${escapeHtml(t.for_label)} ${escapeHtml(stripRedundantForPrefix(order.recipient, lang))}</div>
      ${count > 0 ? `<div class="count-line">${escapeHtml(t.song_count(count))}</div>` : ''}
      ${accessExpired ? '' : `<span class="status ${statusClass}">${escapeHtml(statusLabel)}</span>`}
    `;
  }

  // Card CLICKABIL — STRICT pentru comenzi autorizate prin accessToken (tokenuri locale, deja
  // detinute de acest browser) — continueUrl duce catre pagina corecta (comanda-mea.html/
  // melodia-mea.html), unde actiunile complete (ascultare completa, plata, editare) raman
  // protejate EXACT ca inainte.
  function renderOrderCard(order, index, continueUrl) {
    const card = document.createElement('a');
    card.className = 'order';
    card.href = continueUrl;
    card.innerHTML = orderCardBodyHtml(order, index);
    return card;
  }

  // CORECTIE CRITICA DE SECURITATE (2026-09-30, runda 2 — decizie explicita, dupa audit): cardul
  // pentru o comanda gasita STRICT prin email (fara token local) NU mai e un link catre o pagina
  // cu autoritate completa (accessToken) — simpla cunoastere a emailului cuiva NU trebuie sa ofere
  // plata/editare/regenerare asupra comenzilor lui. E un <div> necliclabil, STRICT view/listen:
  // sumarul comenzii + un player <audio> pentru fiecare varianta cu preview real disponibil,
  // redat prin GET /media/preview/:orderId/:variantId — ruta deja PUBLICA/neautentificata,
  // acelasi preview pe care clientul il putea asculta oricum inainte de plata. Fara previewuri
  // disponibile (comanda inca in compunere), cardul ramane STRICT informativ.
  function renderReadOnlyOrderCard(order, index, previewVariantIds) {
    const card = document.createElement('div');
    card.className = 'order order-readonly';
    const players = (previewVariantIds || [])
      .map((variantId) => `<audio controls src="/media/preview/${encodeURIComponent(order.id)}/${encodeURIComponent(variantId)}"></audio>`)
      .join('');
    card.innerHTML = orderCardBodyHtml(order, index) + players + `<p class="view-only-note">${escapeHtml(t.view_only_note)}</p>`;
    return card;
  }

  // SUPRIMAREA MESAJULUI REDUNDANT (2026-09-28, cerinta explicita, "Nu vreau mesaje
  // contradictorii") — cand quota tocmai a blocat clientul (wasBlocked), banner-ul de sus
  // (t.blocked_empty) explica DEJA situatia reala ("nu vezi comenzi") — a mai afisa si "Nu am
  // gasit nicio comanda" DEDESUBT era redundant/confuz. Mesajul empty_no_orders ramane STRICT
  // pentru cazul FARA niciun context de blocare.
  function handleNoVisibleOrders() {
    const recoveryBox = document.getElementById('recovery-box');
    if (wasBlocked) {
      const banner = document.getElementById('blocked-banner');
      banner.textContent = t.blocked_empty;
      banner.style.display = '';
    } else {
      const listEl = document.getElementById('orders-list');
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = t.empty_no_orders;
      listEl.appendChild(p);
    }
    recoveryBox.style.display = '';
  }

  // SURSA DE ADEVAR (2026-09-30, PROBLEMA 1 — "Comenzile mele goala desi quota stie ca exista
  // melodii", decizie explicita de produs, "emailul introdus de client e suficient"): pana acum,
  // singura sursa era naluna_my_order_keys (tokenuri locale) — un client care revenea pe alt
  // dispozitiv/browser, sau al carui browser pierduse tokenurile, vedea "nicio comanda" desi
  // quota (verificata server-side, dupa EMAIL) stia clar ca exista generari eligibile. Contradictia
  // nu era mascata cu un text — era arhitecturala: doua surse de adevar diferite pentru ACEEASI
  // intrebare. Rezolvata la radacina: daca avem un email (din gate-ul comanda.html sau din
  // traseul de blocare quota — pendingRecoveryEmail, transmis STRICT prin sessionStorage, citit
  // O SINGURA DATA mai sus), il folosim ACUM ca sa intrebam serverul DIRECT (POST
  // /api/orders/by-email — acelasi criteriu de eligibilitate deja folosit de quota si de
  // recuperarea prin email, db.getEligibleOrdersForAccessRecovery). Tokenurile locale raman un
  // FAST-PATH de optimizare/compatibilitate (verificate in continuare, neschimbat), NICIODATA
  // autoritatea exclusiva — cele doua surse sunt combinate, deduplicate dupa id.
  async function loadAndRenderOrders() {
    await resolveIncomingTokens();

    const listEl = document.getElementById('orders-list');
    const loadingEl = document.getElementById('loading-msg');
    const recoveryBox = document.getElementById('recovery-box');

    // BUG REAL (2026-09-28, "Ai 4 comenzi salvate" vs "Nu am gasit nicio comanda" — audit +
    // reproducere directa): versiunea anterioara trata IDENTIC doua situatii complet diferite —
    // (a) serverul CONFIRMA explicit ca id/token nu mai sunt valide (404/400) si (b) fetch-ul
    // ESUEAZA prin exceptie de retea/eroare temporara (5xx) — in (b) NU exista nicio dovada ca
    // acea comanda nu mai e valida. Distingem explicit 'confirmed'/'gone'/'unknown', neschimbat.
    const results = known.length === 0 ? [] : await Promise.all(known.map(async (entry) => {
      try {
        const res = await fetch(`/api/orders/${encodeURIComponent(entry.id)}?token=${encodeURIComponent(entry.token)}`);
        if (res.status === 404 || res.status === 400) return { entry, state: 'gone' };
        if (!res.ok) return { entry, state: 'unknown' };
        const order = await res.json();
        return { entry, state: 'confirmed', order, token: entry.token };
      } catch (e) {
        return { entry, state: 'unknown' };
      }
    }));

    // Auto-curatare — STRICT comenzile CONFIRMATE server-side ca nu mai exista (404/400) sunt
    // scoase din lista locala. O eroare de retea/temporara ('unknown') NU sterge nimic.
    const goneIds = new Set(results.filter((r) => r.state === 'gone').map((r) => r.entry.id));
    known = known.filter((entry) => !goneIds.has(entry.id));
    saveKnownOrders(known);

    // Tokenurile locale confirmate ofera acces COMPLET (link catre pagina cu accessToken) —
    // neschimbat.
    const tokenEligible = results
      .filter((r) => r.state === 'confirmed')
      .filter((r) => r.order.status !== 'draft' && r.order.status !== 'generation_failed')
      .map((r) => ({ order: r.order, continueUrl: continueUrlFor(r.order, r.token), previewVariantIds: null }));
    let hasUnverified = results.some((r) => r.state === 'unknown');

    // EMAIL — a doua sursa, combinata (nu inlocuieste tokenurile locale, le completeaza). STRICT
    // view/listen (vezi buildOrderSummaryDto, server.js) — NICIODATA continueUrl/accessToken.
    let emailEligible = [];
    if (pendingRecoveryEmail) {
      const emailLookup = await lookupOrdersByEmail(pendingRecoveryEmail);
      if (!emailLookup.ok) {
        hasUnverified = true; // eroare de retea/server la interogarea prin email — NU "0 comenzi"
      } else {
        emailEligible = emailLookup.orders.map((o) => ({ order: o, continueUrl: null, previewVariantIds: o.previewVariantIds || [] }));
      }
    }

    // Aceeasi comanda gasita si prin token local SI prin email -> versiunea cu token (acces
    // complet, deja detinut legitim de acest browser) are prioritate, niciodata suprascrisa de
    // versiunea STRICT view/listen a email-ului.
    const byId = new Map();
    tokenEligible.forEach((e) => byId.set(e.order.id, e));
    emailEligible.forEach((e) => { if (!byId.has(e.order.id)) byId.set(e.order.id, e); });
    const eligible = [...byId.values()].sort((a, b) => new Date(a.order.createdAt) - new Date(b.order.createdAt));

    loadingEl.style.display = 'none';

    if (eligible.length === 0) {
      if (hasUnverified) {
        // NU "nu am gasit nicio comanda" (afirmatie falsa de certitudine) — STRICT un mesaj
        // onest: nu am putut verifica ACUM (retea/server), nu ca nu exista.
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = t.verify_error;
        listEl.appendChild(p);
        recoveryBox.style.display = '';
        return;
      }
      handleNoVisibleOrders();
      return;
    }

    // Mesajul de sus reflecta STRICT starea reala — aici stim ca exista comenzi vizibile reale.
    if (wasBlocked) {
      const banner = document.getElementById('blocked-banner');
      banner.textContent = t.blocked;
      banner.style.display = '';
    }

    eligible.forEach((r, i) => {
      const card = r.continueUrl
        ? renderOrderCard(r.order, i + 1, r.continueUrl)
        : renderReadOnlyOrderCard(r.order, i + 1, r.previewVariantIds);
      listEl.appendChild(card);
    });
    recoveryBox.style.display = '';
  }

  loadAndRenderOrders().catch(() => {
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('recovery-box').style.display = '';
  });

  // IESIRE CLARA (2026-09-28, cerinta explicita, "BACK / NAVIGATION") — revine la email gate pe
  // comanda.html: sterge STRICT STEP_KEY (aceeasi cheie 'currentStep' folosita acolo) — asta face
  // gate-ul sa apara din nou la incarcare — NICIODATA naluna_my_order_keys (comenzile deja
  // autorizate ale acestui browser raman intacte, vizibile aici oricand) si NICIODATA draftul de
  // formular (nds_form_draft — clientul nu trebuie sa retasteze povestea/destinatarul daca alege
  // sa continue cu alt email).
  document.getElementById('use-other-email-btn').addEventListener('click', () => {
    try { localStorage.removeItem('currentStep'); } catch (e) { /* ignoram */ }
    window.location.href = '/comanda.html';
  });

  // PRIMAR (2026-09-30, decizie explicita de produs) — introducerea manuala a unui email pe
  // aceasta pagina cere ACUM direct serverul (acelasi POST /api/orders/by-email) si afiseaza
  // comenzile IMEDIAT, fara sa mai treaca prin email — inlocuieste vechiul "trimite-mi acces pe
  // email" ca actiune IMPLICITA. Mecanismul de trimitere pe email ramane disponibil STRICT ca
  // fallback secundar explicit, prin butonul separat de mai jos.
  document.getElementById('recovery-btn').addEventListener('click', async () => {
    const btn = document.getElementById('recovery-btn');
    const resultEl = document.getElementById('recovery-result');
    const email = document.getElementById('recovery-email').value.trim();
    if (!email) return;
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = t.recovery_searching;
    resultEl.style.display = 'none';
    const lookup = await lookupOrdersByEmail(email);
    btn.textContent = originalLabel;
    btn.disabled = false;
    if (!lookup.ok) {
      resultEl.textContent = t.verify_error;
      resultEl.style.display = '';
      return;
    }
    const eligible = lookup.orders.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    if (eligible.length === 0) {
      resultEl.textContent = t.recovery_no_orders_for_email;
      resultEl.style.display = '';
      return;
    }
    const listEl = document.getElementById('orders-list');
    listEl.innerHTML = '';
    eligible.forEach((o, i) => listEl.appendChild(renderReadOnlyOrderCard(o, i + 1, o.previewVariantIds)));
    resultEl.style.display = 'none';
  });

  // FALLBACK SECUNDAR (cerinta explicita, "recovery prin email poate ramane ca fallback secundar
  // pentru situatii speciale") — mecanismul VECHI, neschimbat: trimite un link pe email. Ramane
  // disponibil STRICT ca actiune separata, explicita — niciodata implicita/automata.
  document.getElementById('recovery-email-fallback-btn').addEventListener('click', async () => {
    const btn = document.getElementById('recovery-email-fallback-btn');
    const resultEl = document.getElementById('recovery-result');
    const email = document.getElementById('recovery-email').value.trim();
    if (!email) return;
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = t.recovery_sending;
    try {
      await fetch('/api/orders/recover-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, lang })
      });
    } catch (e) { /* raspunsul generic ramane acelasi indiferent de reteaua clientului */ }
    resultEl.textContent = t.recovery_sent;
    resultEl.style.display = '';
    btn.textContent = originalLabel;
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
