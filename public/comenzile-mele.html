<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comenzile mele — NALUNA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/js/config.js"></script>
<script src="/js/attribution.js"></script>
<script src="/js/analytics.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F5; --bg-secondary:#F8F6F2; --surface:#FDFCFA;
    --text:#2B2B2B; --text-secondary:#6B6B6B;
    --gold:#A8834B; --gold-deep:#8B6D3F; --line:#E8E2D6;
    --success:#5F8F6E; --error:#B3574A;
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:'Sora', sans-serif; min-height:100vh; margin:0; }
  .wrap{ max-width:560px; margin:0 auto; padding:48px 20px 64px; }
  .logo-mark{ width:44px; margin-bottom:28px; display:block; }
  h1{ font-family:'Fraunces', serif; font-weight:400; font-size:26px; margin-bottom:8px; }
  h2{ font-family:'Fraunces', serif; font-weight:400; font-size:17px; margin:0 0 6px; }
  p.sub{ color:var(--text-secondary); font-size:14px; margin-bottom:22px; }
  .blocked-banner{
    background:var(--bg-secondary); border:1px solid var(--gold); border-radius:14px;
    padding:16px 18px; margin-bottom:24px; font-size:15px; line-height:1.5;
  }
  .order{
    background:var(--bg-secondary); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:16px;
  }
  .order .top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .order .title{ font-weight:600; font-family:'Fraunces', serif; font-size:17px; }
  .order .price{ color:var(--gold-deep); font-weight:600; font-size:14px; }
  .order .for-line{ color:var(--text-secondary); font-size:14px; margin-top:4px; }
  .status{
    font-size:11px; padding:4px 10px; border-radius:999px; text-transform:uppercase;
    letter-spacing:.06em; font-family:'Sora',sans-serif; display:inline-block; margin-top:8px;
  }
  .status-ready{ background:rgba(95,143,110,.14); color:var(--success); }
  .status-progress{ background:rgba(168,131,75,.14); color:var(--gold-deep); }
  audio{ width:100%; margin-top:10px; display:block; }
  .variant-label{ font-size:12px; color:var(--text-secondary); margin-top:12px; margin-bottom:2px; }
  .variant-title{ font-family:'Fraunces', serif; font-style:italic; font-size:14px; color:var(--text); margin-bottom:4px; }
  .empty{ color:var(--text-secondary); font-size:14px; }
  .cta-row{ margin-top:16px; }
  button, a.btn{
    background:var(--text); color:var(--bg); border:none; border-radius:10px;
    padding:12px 20px; font-weight:500; font-size:14px; cursor:pointer;
    transition:background-color .25s ease; font-family:'Sora',sans-serif;
    display:inline-block; text-decoration:none;
  }
  button:hover, a.btn:hover{ background:var(--gold-deep); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .recovery-box{
    margin-top:32px; padding-top:24px; border-top:1px solid var(--line);
  }
  .recovery-box input[type="email"]{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:'Sora', sans-serif; font-size:14px;
    margin-bottom:10px;
  }
  .recovery-result{ font-size:13px; color:var(--text-secondary); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo-mark" src="/logo.svg" alt="NALUNA">
  <h1 id="h1-title">Comenzile mele</h1>
  <div id="blocked-banner" class="blocked-banner" style="display:none;"></div>
  <p class="sub" id="p-sub">Comenzile la care ai acces din acest browser.</p>

  <div id="orders-list"></div>
  <p class="empty" id="loading-msg">Se încarcă...</p>

  <div class="recovery-box" id="recovery-box" style="display:none;">
    <h2 id="recovery-title">Nu găsești o comandă?</h2>
    <p class="sub" id="recovery-sub" style="margin-bottom:14px;">Primești pe email linkurile către comenzile tale.</p>
    <input type="email" id="recovery-email" placeholder="email@exemplu.com" autocomplete="email">
    <button type="button" id="recovery-btn">Trimite-mi acces pe email</button>
    <p class="recovery-result" id="recovery-result" style="display:none;"></p>
  </div>
</div>

    },
    de: {
      title: 'Meine Bestellungen', sub: 'Die Bestellungen, auf die du von diesem Browser aus zugreifen kannst.',
      blocked: 'Für dich wurden bereits Lieder erstellt. Wähle eine deiner bestehenden Bestellungen, um fortzufahren.',
      loading: 'Wird geladen...', for_label: 'Für', continue_btn: 'Mit dieser Bestellung fortfahren',
      status_progress: 'Wird komponiert', status_ready: 'Fertig',
      no_player_yet: 'Dein Lied wird noch komponiert — schau in ein paar Minuten wieder vorbei.', song_label: 'Lied',
      recovery_title: 'Findest du eine Bestellung nicht?', recovery_sub: 'Wir senden dir die Links zu deinen Bestellungen per E-Mail.',
      recovery_placeholder: 'email@beispiel.com', recovery_btn: 'Zugang per E-Mail zusenden', recovery_sending: 'Wird gesendet...',

    es: {

      status_progress: 'En composición', status_ready: 'Listo',
      no_player_yet: 'Tu canción todavía se está componiendo — vuelve en unos minutos.', song_label: 'Canción',
      recovery_title: '¿No encuentras un pedido?', recovery_sub: 'Te enviaremos por email los enlaces a tus pedidos.',
      recovery_placeholder: 'email@ejemplo.com', recovery_btn: 'Enviarme el acceso por email', recovery_sending: 'Enviando...',
      recovery_sent: 'Si esa dirección tiene pedidos elegibles, recibirás en breve un email con los enlaces de acceso.',
      empty_no_orders: 'No encontramos ningún pedido en este navegador.',

      loading: 'Caricamento...', for_label: 'Per', continue_btn: 'Continua con questo ordine',
      status_progress: 'In composizione', status_ready: 'Pronto',
      no_player_yet: 'La tua canzone è ancora in composizione — torna tra qualche minuto.', song_label: 'Canzone',
      recovery_title: 'Non trovi un ordine?', recovery_sub: 'Ti invieremo via email i link ai tuoi ordini.',
      recovery_placeholder: 'email@esempio.com', recovery_btn: 'Inviami accesso via email', recovery_sending: 'Invio in corso...',
      recovery_sent: 'Se quell\'indirizzo ha ordini idonei, riceverai a breve un\'email con i link di accesso.',
      empty_no_orders: 'Non abbiamo trovato nessun ordine in questo browser.',
      plan: { standard: 'Standard', premium: 'Premium', video: 'Regalo video' }
    },
    fr: {
      title: 'Mes commandes', sub: 'Les commandes auxquelles vous pouvez accéder depuis ce navigateur.',
      blocked: 'Des chansons ont déjà été créées pour toi. Choisis l’une de tes commandes existantes pour continuer.',
      loading: 'Chargement...', for_label: 'Pour', continue_btn: 'Continuer avec cette commande',
      status_progress: 'En composition', status_ready: 'Prête',
      no_player_yet: 'Votre chanson est encore en composition — revenez dans quelques minutes.', song_label: 'Chanson',
      recovery_title: 'Vous ne trouvez pas une commande ?', recovery_sub: 'Nous vous enverrons par email les liens vers vos commandes.',
      recovery_placeholder: 'email@exemple.com', recovery_btn: 'M\'envoyer l\'accès par email', recovery_sending: 'Envoi en cours...',
      recovery_sent: 'Si cette adresse a des commandes éligibles, vous recevrez bientôt un email avec les liens d\'accès.',
      empty_no_orders: 'Nous n\'avons trouvé aucune commande dans ce navigateur.',
      plan: { standard: 'Standard', premium: 'Premium', video: 'Cadeau vidéo' }
    },
    bg: {
      title: 'Моите поръчки', sub: 'Поръчките, до които имаш достъп от този браузър.',
      blocked: 'Вече имаш създадени песни за теб. Избери една от съществуващите си поръчки, за да продължиш.',
      loading: 'Зареждане...', for_label: 'За', continue_btn: 'Продължи с тази поръчка',
      status_progress: 'Композира се', status_ready: 'Готова',
      no_player_yet: 'Песента ти все още се композира — провери отново след няколко минути.', song_label: 'Песен',
      recovery_title: 'Не намираш поръчка?', recovery_sub: 'Ще ти изпратим по имейл линковете към поръчките ти.',
      recovery_placeholder: 'email@primer.com', recovery_btn: 'Изпрати ми достъп по имейл', recovery_sending: 'Изпраща се...',
      recovery_sent: 'Ако този имейл има допустими поръчки, ще получиш скоро писмо с линкове за достъп.',
      empty_no_orders: 'Не намерихме нито една поръчка в този браузър.',
      plan: { standard: 'Стандартен', premium: 'Премиум', video: 'Видео подарък' }
    },
    tr: {
      title: 'Siparişlerim', sub: 'Bu tarayıcıdan erişebildiğiniz siparişler.',
      blocked: 'Senin için zaten şarkılar oluşturuldu. Devam etmek için mevcut siparişlerinden birini seç.',
      loading: 'Yükleniyor...', for_label: 'Kime', continue_btn: 'Bu siparişe devam et',
      status_progress: 'Besteleniyor', status_ready: 'Hazır',
      no_player_yet: 'Şarkınız hâlâ besteleniyor — birkaç dakika sonra tekrar kontrol edin.', song_label: 'Şarkı',
      recovery_title: 'Bir sipariş bulamıyor musunuz?', recovery_sub: 'Siparişlerinizin bağlantılarını e-posta ile göndereceğiz.',
      recovery_placeholder: 'email@ornek.com', recovery_btn: 'Erişimi e-postama gönder', recovery_sending: 'Gönderiliyor...',
      recovery_sent: 'Bu adresin uygun siparişleri varsa, kısa süre içinde erişim bağlantılarını içeren bir e-posta alacaksınız.',
      empty_no_orders: 'Bu tarayıcıda hiçbir sipariş bulamadık.',
      plan: { standard: 'Standart', premium: 'Premium', video: 'Video hediye' }
    }
  };
  const ALLOWED_LANGS = ['ro', 'en', 'de', 'es', 'it', 'fr', 'bg', 'tr'];
  let lang = localStorage.getItem('nds_lang');
  if (!lang) {
    const browserLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    lang = ALLOWED_LANGS.includes(browserLang) ? browserLang : 'en';
  }
  const t = T[lang] || T.ro;
  document.documentElement.lang = lang;
  document.getElementById('h1-title').textContent = t.title;
  document.getElementById('p-sub').textContent = t.sub;
  document.getElementById('loading-msg').textContent = t.loading;
  document.getElementById('recovery-title').textContent = t.recovery_title;
  document.getElementById('recovery-sub').textContent = t.recovery_sub;
  document.getElementById('recovery-email').placeholder = t.recovery_placeholder;
  document.getElementById('recovery-btn').textContent = t.recovery_btn;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // CORECTIE (2026-09-27, "Pentru Pentru sotia mea" — bug REAL raportat): campul liber
  // "recipient" poate contine deja, scris de client, un prefix natural echivalent cu eticheta
  // afisata aici ("Pentru"/"For"/etc.) — cand eticheta e adaugata DIN NOU, rezultatul devine
  // vizibil dublat. NU modifica valoarea din DB — STRICT normalizare de prezentare, identica cu
  // cea din server.js (stripRedundantForPrefix) si din comanda-mea.html/melodia-mea.html.
  const FOR_WORD_BY_LANG = { ro: 'pentru', en: 'for', de: 'für', es: 'para', it: 'per', fr: 'pour', bg: 'за', tr: 'için' };
  function stripRedundantForPrefix(value, activeLang) {
    const v = String(value || '').trim();
    if (!v) return v;
    const word = (FOR_WORD_BY_LANG[activeLang] || FOR_WORD_BY_LANG.ro).toLowerCase();
    const lower = v.toLowerCase();
    if (lower === word) return '';
    if (lower.startsWith(word + ' ')) return v.slice(word.length).trim();
    return v;
  }

  // ORDINEA MELE (localStorage) — lista de comenzi {id, token} create de ACEST browser, sau
  // adaugate printr-un link de recuperare (?token=/?tokens=). NU e un credential agregat nou —
  // fiecare accessToken ramane exact acelasi mecanism per-comanda deja auditat (48 caractere
  // hex, verificat timing-safe server-side); lista e STRICT o comoditate client-side, niciodata
  // trimisa nicaieri altundeva decat catre GET /api/orders/:id?token=... (acelasi endpoint deja
  // folosit de melodia-mea.html).
  const STORAGE_KEY = 'naluna_my_order_keys';
  function loadKnownOrders() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter((o) => o && o.id && o.token) : [];
    } catch (e) { return []; }
  }
  function saveKnownOrders(list) {
    try {
      // plafon defensiv — evita cresterea nemarginita a localStorage pentru un browser folosit
      // foarte mult timp; cele mai VECHI intrari sunt eliminate primele.
      const capped = list.slice(-50);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(capped));
    } catch (e) { /* localStorage indisponibil (mod privat strict etc.) — pagina tot functioneaza, doar nu retine local */ }
  }
  function mergeOrder(list, id, token) {
    const idx = list.findIndex((o) => o.id === id);
    if (idx !== -1) { list[idx].token = token; return list; }
    list.push({ id, token });
    return list;
  }

  let known = loadKnownOrders();
  const params = new URLSearchParams(window.location.search);
  const singleToken = params.get('token');
  const multiTokens = params.get('tokens');
  // id-ul nu vine niciodata din URL pentru aceste linkuri (STRICT tokenul) — GET
  // /api/orders/access/:token intoarce id-ul comenzii asociate, verificat server-side.
  const incomingTokens = [];
  if (singleToken) incomingTokens.push(singleToken);
  if (multiTokens) incomingTokens.push(...multiTokens.split(',').map((s) => s.trim()).filter(Boolean));

  // SECURITATE (2026-09-27, audit token-uri in URL): token-urile sunt STRICT credentiale de acces
  // (accessToken, 48 hex, acelasi mecanism auditat ca peste tot in site) — o data capturate mai
  // sus, in memorie (incomingTokens), NU mai au niciun motiv sa ramana vizibile in bara de adrese.
  // CRITIC: curatarea se face AICI, SINCRON, imediat — NU dupa validarea server-side (fetch) de
  // mai jos, care e asincrona. Motiv: analytics.js incarca GA4/Meta Pixel STRICT la
  // DOMContentLoaded (vezi initConsentUi), eveniment care se declanseaza dupa ce parserul termina
  // TOT documentul, inclusiv acest <script> — dar NU asteapta rezultatul niciunui fetch al nostru.
  // Daca am fi curatat URL-ul abia dupa ce se termina fetch-ul (asincron) catre
  // /api/orders/access/:token, ar fi existat o cursa reala: pentru un vizitator care are deja
  // consimtamant Analytics/Marketing acordat dintr-o vizita anterioara, gtag.js/fbevents.js s-ar
  // putea incarca si trimite automat un page_view/PageView cu window.location.href INAINTE ca
  // fetch-ul nostru sa se termine — expunand token-urile catre Google/Meta. Curatand SINCRON,
  // aici, URL-ul nu mai contine niciodata token-uri incepand din acest moment al parsarii, cu mult
  // inainte de DOMContentLoaded — indiferent de viteza retelei pentru fetch-ul de validare.
  if (incomingTokens.length > 0) {
    const clean = new URL(window.location.href);
    clean.searchParams.delete('token');
    clean.searchParams.delete('tokens');
    window.history.replaceState(null, '', clean.toString());
  }

  if (params.get('blocked') === '1') {
    const banner = document.getElementById('blocked-banner');
    banner.textContent = t.blocked;
    banner.style.display = '';
  }

  async function resolveIncomingTokens() {
    for (const token of incomingTokens) {
      if (!/^[0-9a-f]{48}$/i.test(token)) continue;
      try {
        const res = await fetch('/api/orders/access/' + encodeURIComponent(token));
        if (!res.ok) continue;
        const o = await res.json();
        known = mergeOrder(known, o.id, token);
      } catch (e) { /* ignoram — restul comenzilor cunoscute local tot se incarca */ }
    }
    if (incomingTokens.length > 0) saveKnownOrders(known);
  }

  function planName(plan) {
    return (t.plan && t.plan[plan]) || plan;
  }

  function renderOrderCard(order, index, token) {
    const card = document.createElement('div');
    card.className = 'order';
    const isReady = order.status === 'ready';
    const accessExpired = isReady && !!order.hostedAccessExpired;
    const statusLabel = isReady ? t.status_ready : t.status_progress;
    const statusClass = isReady ? 'status-ready' : 'status-progress';

    let playersHtml = '';
    if (accessExpired) {
      // Acelasi tratament ca la comanda-mea.html — nu incercam sa aratam un player/link stricat.
      playersHtml = '';
    } else if (isReady) {
      // Dupa plata: melodia principala, plus a doua melodie/bonus surpriza acolo unde exista
      // (Premium/Video) — acelasi tipar de URL-uri deja folosit de comanda-mea.html.
      let n = 1;
      const fullUrl = `/media/full/${order.id}?token=${encodeURIComponent(token)}`;
      playersHtml = `<div class="variant-label">${escapeHtml(t.song_label)} ${n++}</div><audio controls src="${fullUrl}"></audio>`;
      if (order.hasGiftAudio) {
        const giftUrl = `/media/full/${order.id}/gift?token=${encodeURIComponent(token)}`;
        playersHtml += `<div class="variant-label">${escapeHtml(t.song_label)} ${n++}</div><audio controls src="${giftUrl}"></audio>`;
      }
      if (order.hasPremiumBonusAudio) {
        const bonusUrl = `/media/full/${order.id}/bonus?token=${encodeURIComponent(token)}`;
        playersHtml += `<div class="variant-label">${escapeHtml(t.song_label)} ${n++}</div><audio controls src="${bonusUrl}"></audio>`;
      }
    } else if (Array.isArray(order.variants) && order.variants.length > 0) {
      const withPreview = order.variants.filter((v) => v.previewUrl);
      // TITLU (2026-09-28, sistem emotional story-aware) — STRICT daca serverul l-a calculat
      // (v.title, JSONB additiv) — comenzile istorice fara titlu nu primesc niciun rand nou aici.
      playersHtml = withPreview
        .map((v, i) => `<div class="variant-label">${escapeHtml(t.song_label)} ${i + 1}</div>${(v.title && String(v.title).trim()) ? `<div class="variant-title">${escapeHtml(String(v.title).trim())}</div>` : ''}<audio controls src="${escapeHtml(v.previewUrl)}"></audio>`)
        .join('');
      if (!playersHtml) playersHtml = `<p class="empty" style="margin-top:10px;">${t.no_player_yet}</p>`;
    } else {
      playersHtml = `<p class="empty" style="margin-top:10px;">${t.no_player_yet}</p>`;
    }

    const continueUrl = `/melodia-mea.html?id=${encodeURIComponent(order.id)}&token=${encodeURIComponent(token)}`;

    card.innerHTML = `
      <div class="top">
        <div class="title">${escapeHtml(String(index))}. ${escapeHtml(planName(order.plan))} — £${escapeHtml(String(order.price))}</div>
      </div>
      <div class="for-line">${escapeHtml(t.for_label)}: ${escapeHtml(stripRedundantForPrefix(order.recipient, lang))}</div>
      ${accessExpired ? '' : `<span class="status ${statusClass}">${escapeHtml(statusLabel)}</span>`}
      ${playersHtml}
      <div class="cta-row">
        <a class="btn" href="${continueUrl}">${escapeHtml(t.continue_btn)}</a>
      </div>
    `;
    return card;
  }

  async function loadAndRenderOrders() {
    await resolveIncomingTokens();

    const listEl = document.getElementById('orders-list');
    const loadingEl = document.getElementById('loading-msg');
    const recoveryBox = document.getElementById('recovery-box');

    if (known.length === 0) {
      loadingEl.style.display = 'none';
      recoveryBox.style.display = '';
      return;
    }

    const results = await Promise.all(known.map(async (entry) => {
      try {
        const res = await fetch(`/api/orders/${encodeURIComponent(entry.id)}?token=${encodeURIComponent(entry.token)}`);
        if (!res.ok) return null;
        const order = await res.json();
        return { order, token: entry.token };
      } catch (e) {
        return null;
      }
    }));

    // Auto-curatare — orice comanda care nu mai raspunde (expirata dupa 7 zile neplatita,
    // token gresit etc.) e scoasa din lista locala, niciodata pastrata "moarta".
    const stillValidIds = new Set(results.filter(Boolean).map((r) => r.order.id));
    known = known.filter((entry) => stillValidIds.has(entry.id));
    saveKnownOrders(known);

    const eligible = results
      .filter(Boolean)
      .filter((r) => r.order.status !== 'draft' && r.order.status !== 'generation_failed')
      .sort((a, b) => new Date(a.order.createdAt) - new Date(b.order.createdAt));

    loadingEl.style.display = 'none';

    if (eligible.length === 0) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = t.empty_no_orders;
      listEl.appendChild(p);
      recoveryBox.style.display = '';
      return;
    }

    eligible.forEach((r, i) => {
      listEl.appendChild(renderOrderCard(r.order, i + 1, r.token));
    });
    recoveryBox.style.display = '';
  }

  loadAndRenderOrders().catch(() => {
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('recovery-box').style.display = '';
  });

  // RECUPERARE PRIN EMAIL (mecanism SECUNDAR — pentru alt browser/dispozitiv, sau cand lista
  // locala e goala) — acelasi endpoint public, generic/indistinct, deja auditat.
  document.getElementById('recovery-btn').addEventListener('click', async () => {
    const btn = document.getElementById('recovery-btn');
    const resultEl = document.getElementById('recovery-result');
    const email = document.getElementById('recovery-email').value.trim();
    if (!email) return;
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = t.recovery_sending;
    try {
      await fetch('/api/orders/recover-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, lang })
      });
    } catch (e) { /* raspunsul generic ramane acelasi indiferent de reteaua clientului */ }
    resultEl.textContent = t.recovery_sent;
    resultEl.style.display = '';
    btn.textContent = originalLabel;
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
