<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Se compune melodia ta — NALUNA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F5; --bg-secondary:#F8F6F2; --surface:#FDFCFA;
    --text:#2B2B2B; --text-secondary:#6B6B6B;
    --gold:#A8834B; --gold-soft:#C9A876; --gold-deep:#8B6D3F; --line:#E8E2D6;
    --success:#5F8F6E; --error:#B3574A;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:'Sora', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0;
    padding:24px; position:relative; overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  .ambient-wash{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 18% 20%, rgba(168,131,75,.08), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(168,131,75,.07), transparent 50%);
  }
  .ambient-blob{
    position:fixed; border-radius:50%; filter:blur(60px); pointer-events:none; z-index:0;
    background:radial-gradient(circle, rgba(201,168,118,.16), transparent 70%);
  }
  .blob-1{ width:340px; height:340px; top:-80px; left:-100px; animation:driftA 22s ease-in-out infinite; }
  .blob-2{ width:280px; height:280px; bottom:-100px; right:-80px; animation:driftB 26s ease-in-out infinite; }
  @keyframes driftA{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(40px,30px); } }
  @keyframes driftB{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-30px,-40px); } }

  .soundwave{
    position:absolute; left:50%; bottom:8%; transform:translateX(-50%);
    display:flex; align-items:flex-end; gap:5px; height:44px; z-index:0; opacity:.35;
  }
  .soundwave span{
    width:3px; border-radius:2px; background:var(--gold-soft);
    animation:wavebar 1.8s ease-in-out infinite;
  }
  @keyframes wavebar{ 0%,100%{ height:6px; } 50%{ height:36px; } }

  .card{
    position:relative; z-index:1;
    background:rgba(253,252,250,.68);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:26px;
    padding:52px 42px;
    max-width:520px; width:100%; text-align:center;
    box-shadow:0 24px 60px -20px rgba(139,109,63,.18), 0 2px 8px rgba(43,43,43,.05);
    transition:box-shadow .6s ease;
  }
  .logo-mark{ width:48px; margin:0 auto 26px; display:block; opacity:.92; }

  .spinner-wrap{ position:relative; width:80px; height:80px; margin:0 auto 26px; }
  .spinner-glow{
    position:absolute; inset:-16px; border-radius:50%;
    background:radial-gradient(circle, rgba(168,131,75,.2), rgba(168,131,75,0) 70%);
    animation:glow 3.4s ease-in-out infinite;
  }
  @keyframes glow{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:1; transform:scale(1.1); } }
  .spinner{
    position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--gold); border-right-color:var(--gold-soft);
    animation:spin 2.6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinner-check{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:28px; color:var(--success); opacity:0; transform:scale(.6);
    transition:opacity .5s ease, transform .5s ease;
  }
  .spinner-check.show{ opacity:1; transform:scale(1); }

  h1{ font-family:'Fraunces', serif; font-weight:400; font-size:23px; margin-bottom:8px; letter-spacing:-.01em; }
  p.sub{ color:var(--text-secondary); font-size:14px; margin-bottom:22px; }

  .status-msg{
    font-family:'Fraunces', serif; font-style:italic; color:var(--gold-deep);
    font-size:16px; min-height:24px; margin-bottom:18px;
    opacity:1; transition:opacity .5s ease;
  }
  .status-msg.fading{ opacity:0; }

  .progress-track{
    height:7px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
    overflow:hidden; margin-bottom:12px; position:relative;
  }
  /* Bara ramane nedeterminata (animatie) DOAR pana la primul raspuns real al serverului —
     hotfix 2026-08-07: server.js expune acum un procent REAL, bazat pe milestone-uri concrete
     (submitted/processing/first_stream/finalizing/ready — vezi recordGenerationProgress),
     niciodata dintr-un timp scurs estimat. De indata ce sosesc date reale, bara trece pe
     .real si latimea e controlata explicit din JS (updateRealProgress), cu tranzitie lina. */
  .progress-fill{
    height:100%; border-radius:999px; position:absolute; top:0; left:-40%; width:40%;
    background:linear-gradient(90deg, var(--gold-deep), var(--gold-soft));
    animation:indeterminate 1.6s ease-in-out infinite;
  }
  .progress-fill.real{ animation:none; left:0; transition:width .6s ease; }
  .progress-fill.done{ animation:none; left:0; width:100%; }
  @keyframes indeterminate{ 0%{ left:-40%; } 100%{ left:100%; } }
  @media (prefers-reduced-motion: reduce){ .progress-fill{ animation-duration:.001ms; } }

  .estimate-pill{
    display:inline-block; padding:6px 16px; border-radius:999px;
    background:rgba(168,131,75,.1); color:var(--gold-deep); font-size:13px; font-weight:500;
    margin-bottom:20px; transition:opacity .5s ease;
  }
  .estimate-pill.hidden{ opacity:0; height:0; padding:0; margin:0; overflow:hidden; }

  .keep-open{ color:var(--text-secondary); font-size:13px; line-height:1.5; }

  .soft-notice{
    display:none; margin-top:18px; padding:12px 16px; border-radius:14px;
    background:rgba(168,131,75,.08); color:var(--gold-deep); font-size:13px; line-height:1.5;
  }

  .error-state{ display:none; }
  .error-state h1{ color:var(--error); }
  .btn{
    display:inline-block; margin-top:16px; padding:13px 28px; border-radius:999px;
    background:var(--text); color:var(--bg); border:none; font-weight:500; font-size:14px;
    cursor:pointer; transition:background-color .25s ease;
  }
  .btn:hover{ background:var(--gold-deep); }
  .btn:disabled{ opacity:.6; cursor:default; }

  @media (max-width: 480px){
    .card{ padding:38px 26px; }
    .blob-1, .blob-2{ display:none; }
  }
</style>
</head>
<body>
  <div class="ambient-wash"></div>
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>
  <div class="soundwave" id="soundwave"></div>

  <div class="card">
    <img class="logo-mark" src="/logo.svg" alt="NALUNA">

    <div id="progress-state">
      <div class="spinner-wrap">
        <div class="spinner-glow"></div>
        <div class="spinner" id="spinner"></div>
        <div class="spinner-check" id="spinner-check">✓</div>
      </div>

      <h1 id="p-title">Melodia ta se compune acum</h1>
      <p class="sub" id="p-subtitle">Pregătim 2 variante personalizate pentru tine</p>

      <div class="status-msg" id="status-msg"></div>

      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      <div class="estimate-pill" id="estimate-pill"></div>
      <p class="keep-open" id="p-keepopen">Nu închide această pagină. Rezultatul va apărea automat când este gata.</p>

      <div class="soft-notice" id="soft-notice"></div>
      <div class="soft-notice" id="long-notice" style="text-align:center;">
        <strong id="long-notice-title"></strong><br>
        <span id="long-notice-sub"></span><br>
        <span id="long-notice-line3"></span>
      </div>
    </div>

    <div class="error-state" id="error-state">
      <h1 id="err-title">Nu am putut finaliza melodia de această dată</h1>
      <p class="sub" id="err-sub">Nu ai fost taxat. Poți încerca din nou</p>
      <button class="btn" id="retry-btn">Încearcă din nou</button>
    </div>
  </div>

  const T = {

        'Scopriamo le emozioni al suo interno...',

      title: 'Votre chanson est en cours de composition',
      subtitle: 'Votre chanson est en cours de création. Elle est généralement prête en environ 3 minutes.',

      regenSubtitle: 'Nous appliquons tes modifications. Une fois prête, tu pourras comparer les deux versions.',

      estimate: (m) => m <= 0 ? 'Presque prêt' : `Temps restant estimé : environ ${m} ${m === 1 ? 'minute' : 'minutes'}`,

      longTitle: 'Naluna Studio est très sollicité en ce moment ✨', longSub: 'Votre chanson peut nécessiter un peu plus de temps de traitement.', longLine3: 'Restez sur cette page — elle est presque prête.',

      errSub: 'Vous n\'avez pas été débité. Vous pouvez réessayer.',

  const supportedLangs = ['ro', 'en', 'de', 'es', 'it', 'fr', 'bg', 'tr'];
  const savedLang = localStorage.getItem('nds_lang');
  const lang = supportedLangs.includes(savedLang) ? savedLang : 'ro';
  const t = T[lang];
  document.documentElement.lang = lang;

  // FINISAJ FINAL PACHET STANDARD (hotfix 2026-08-08): mode=regenerate distinge o REGENERARE
  // (editare Standard, progres separat — vezi regenerationStatus/regenerationProgress in
  // server.js) de generarea initiala. Titlul/descrierea difera explicit; pagina de generare
  // initiala ramane complet neschimbata pentru orice alta comanda.
  const params = new URLSearchParams(window.location.search);
  const isRegenMode = params.get('mode') === 'regenerate';

  document.getElementById('p-title').textContent = isRegenMode ? t.regenTitle : t.title;
  document.getElementById('p-subtitle').textContent = isRegenMode ? t.regenSubtitle : t.subtitle;
  document.getElementById('p-keepopen').textContent = t.keepOpen;
  document.getElementById('err-title').textContent = t.errTitle;
  document.getElementById('err-sub').textContent = t.errSub;
  document.getElementById('retry-btn').textContent = t.retryBtn;
  document.getElementById('soft-notice').textContent = t.softNotice;
  document.getElementById('long-notice-title').textContent = t.longTitle;
  document.getElementById('long-notice-sub').textContent = t.longSub;
  document.getElementById('long-notice-line3').textContent = t.longLine3;

  const soundwaveEl = document.getElementById('soundwave');
  for (let i = 0; i < 18; i++) {
    const bar = document.createElement('span');
    bar.style.animationDelay = (Math.random() * 1.8).toFixed(2) + 's';
    bar.style.height = (8 + Math.random() * 14) + 'px';
    soundwaveEl.appendChild(bar);
  }

  const orderId = params.get('id');
  const accessToken = params.get('token') || localStorage.getItem('nds_access_token') || '';

  if (!orderId) {
    window.location.href = '/index.html';
    // opreste executia scriptului aici — fara acest return, restul codului (setup polling,
    // un fetch inutil catre /api/orders/null) tot rula o data inainte ca navigarea sa se
    // finalizeze efectiv.
    throw new Error('orderId lipsa din URL — redirectionare catre /index.html');
  }

  const progressState = document.getElementById('progress-state');
  const errorState = document.getElementById('error-state');
  const progressFill = document.getElementById('progress-fill');
  const statusMsgEl = document.getElementById('status-msg');
  const estimatePillEl = document.getElementById('estimate-pill');
  const softNoticeEl = document.getElementById('soft-notice');
  const spinnerEl = document.getElementById('spinner');
  const spinnerCheckEl = document.getElementById('spinner-check');
  const retryBtn = document.getElementById('retry-btn');

  const startKey = `nds_gen_start_${orderId}`;
  let startTime = Number(localStorage.getItem(startKey));
  if (!startTime) {
    startTime = Date.now();
    localStorage.setItem(startKey, String(startTime));
  }

  const ESTIMATE_MS = 165000;
  let currentStageIndex = -1;
  let finished = false;

  function setStatusMessage(msg) {
    statusMsgEl.classList.add('fading');
    setTimeout(() => {
      statusMsgEl.textContent = msg;
      statusMsgEl.classList.remove('fading');
    }, 220);
  }

  // Acest timer controleaza STRICT textul calitativ rotativ (t.stages) afisat langa bara —
  // reasigurare emotionala pe baza de timp scurs, nu o masuratoare reala. Procentul NUMERIC
  // real (order.generationPhasePercent) e gestionat EXCLUSIV de updateRealProgress() mai jos,
  // populat din milestone-uri server-side reale — acest timer NU trebuie sa atinga niciodata
  // vizibilitatea lui #estimate-pill.
  //
  // HOTFIX (procentul aparea si disparea, pagina parea blocata): acest timer rula la fiecare
  // 1s si ascundea necondiționat #estimate-pill la fiecare tick, in timp ce updateRealProgress
  // il reafisa doar cand sosea un raspuns nou de la server (la ~4s) — rezultatul vizibil era
  // un procent care disparea de 3-4 ori mai des decat aparea. Bara/procentul raman acum
  // permanent vizibile de indata ce exista o valoare reala, pana la finishSuccess().
  const STAGE_INTERVAL_MS = ESTIMATE_MS / t.stages.length;
  function updateProgress() {
    if (finished) return;
    const elapsed = Date.now() - startTime;
    const stageIndex = Math.min(Math.floor(elapsed / STAGE_INTERVAL_MS), t.stages.length - 1);
    if (stageIndex !== currentStageIndex) {
      currentStageIndex = stageIndex;
      setStatusMessage(t.stages[stageIndex]);
    }
  }
  updateProgress();
  const progressTimer = setInterval(updateProgress, 1000);

  // Procentul REAL, pe baza de milestone-uri (order.generationPhasePercent, populat de
  // recordGenerationProgress in server.js) — inlocuieste bara nedeterminata de indata ce
  // avem primul raspuns real de la server (nu la incarcarea paginii, cand nu avem inca
  // nimic). Textul calitativ rotativ (t.stages, de mai sus) ramane neschimbat ca reasigurare
  // emotionala; procentul e strict aditional, niciodata contradictoriu (ambele vin acum din
  // surse reale — unul din timp scurs pentru variatia textului, altul din milestone-uri
  // pentru numarul afisat).
  let highestShownPercent = 0;
  function updateRealProgress(order) {
    // FINISAJ FINAL PACHET STANDARD: in modul de regenerare, procentul vine STRICT din
    // regenerationProgress (separat complet de generationPhasePercent) — altfel un job de
    // regenerare pornit dupa ce generarea initiala ajunsese deja 100% ar ramane vizual
    // "inghetat" la 100% (bug real, gasit prin verificare directa a codului).
    const percent = isRegenMode ? order.regenerationProgress : order.generationPhasePercent;
    if (percent == null || typeof percent !== 'number') return;
    // Niciodata regresiv vizual, chiar daca un raspuns intarziat ar aduce o valoare mai veche
    // (polling-ul si callback-ul scriu progresul independent — vezi updateGenerationPhaseIfLater).
    if (percent < highestShownPercent) return;
    highestShownPercent = percent;

    progressFill.classList.add('real');
    progressFill.style.width = Math.max(0, Math.min(100, percent)) + '%';
    estimatePillEl.classList.remove('hidden');
    estimatePillEl.textContent = percent + '%';
  }

  function finishSuccess() {
    finished = true;
    clearInterval(progressTimer);
    localStorage.removeItem(startKey);

    progressFill.classList.remove('real');
    progressFill.classList.add('done');
    estimatePillEl.classList.add('hidden');
    hideLongNotice();
    setStatusMessage(t.readyMsg);
    spinnerEl.style.opacity = '0';
    spinnerCheckEl.classList.add('show');
    document.getElementById('p-subtitle').textContent = t.readySub;

    setTimeout(() => {
      window.location.href = `/melodia-mea.html?id=${encodeURIComponent(orderId)}&token=${encodeURIComponent(accessToken)}`;
    }, 1400);
  }

  let consecutivePollFailures = 0;

  function showSoftNotice() {
    softNoticeEl.style.display = 'block';
  }
  function hideSoftNotice() {
    softNoticeEl.style.display = 'none';
  }

  // Notificare SEPARATA de softNotice (care e strict despre probleme de retea/conexiune) —
  // aceasta apare cand SERVERUL confirma ca statusul e inca 'generating' dupa ce a trecut
  // timpul estimat normal, nu din cauza unei erori de conexiune. Nu inlocuieste starea de
  // eroare — apare DOAR cat timp comanda e confirmat inca in lucru.
  const longNoticeEl = document.getElementById('long-notice');
  let longNoticeShown = false;
  function showLongNotice() {
    if (longNoticeShown) return;
    longNoticeShown = true;
    longNoticeEl.style.display = 'block';
  }
  function hideLongNotice() {
    longNoticeShown = false;
    longNoticeEl.style.display = 'none';
  }

  // Statusul "generation_failed" e final — NU pornim automat o noua generare.
  // Un task Suno esuat nu se repara singur reincercand orbeste (si ar consuma credite
  // pentru fiecare incercare automata); clientul decide explicit daca vrea sa reincerce.
  function handleGenerationFailed() {
    finished = true;
    if (pollTimer) clearTimeout(pollTimer);
    clearInterval(progressTimer);
    hideSoftNotice();
    hideLongNotice();
    progressState.style.display = 'none';
    errorState.style.display = 'block';
  }

  let pollTimer = null;
  async function pollStatus() {
    try {
      const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}?token=${encodeURIComponent(accessToken)}`);
      if (!res.ok) {
        consecutivePollFailures++;
        if (consecutivePollFailures >= 2) showSoftNotice();
        pollTimer = setTimeout(pollStatus, 4000);
        return;
      }
      consecutivePollFailures = 0;
      hideSoftNotice();
      const order = await res.json();
      updateRealProgress(order);

      // FINISAJ FINAL PACHET STANDARD: in modul de regenerare, order.status revine la
      // 'preview_ready' in AMBELE cazuri (succes SAU esec — vezi markGenerationFailed in
      // server.js, care pastreaza varianta initiala vandabila chiar si dupa un esec) — deci
      // status-ul singur NU poate distinge cele doua. regenerationStatus (separat, legat de
      // jobId) e singurul semnal fiabil aici.
      const regenSucceeded = isRegenMode && order.regenerationStatus === 'ready';
      const regenFailed = isRegenMode && order.regenerationStatus === 'failed';
      const initialSucceeded = !isRegenMode && (order.status === 'preview_ready' || order.status === 'ready');
      const initialFailed = !isRegenMode && order.status === 'generation_failed';

      if (regenSucceeded || initialSucceeded) {
        finishSuccess();
      } else if (regenFailed || initialFailed) {
        handleGenerationFailed();
      } else {
        // Comanda e confirmata inca 'generating' de catre server (nu o eroare de retea) —
        // daca a trecut deja timpul estimat normal, aratam mesajul linistitor specific,
        // NU mesajul de esec (care apare doar la generation_failed confirmat de server).
        if (Date.now() - startTime > ESTIMATE_MS) {
          showLongNotice();
        }
        pollTimer = setTimeout(pollStatus, 4000);
      }
    } catch (err) {
      // Eroare de retea/conexiune la polling — NU inseamna ca generarea a esuat, doar ca
      // nu am putut verifica statusul chiar acum. Aratam mesajul linistitor si continuam
      // sa verificam — nu pornim nicio generare noua din acest motiv.
      consecutivePollFailures++;
      if (consecutivePollFailures >= 2) showSoftNotice();
      pollTimer = setTimeout(pollStatus, 4000);
    }
  }
  pollStatus();

  // ==========================================================================================
  // HOTFIX 2026-08-07: pe iPhone, pagina putea parea "blocata" la "Melodia ta se compune acum"
  // desi generarea se terminase deja cu succes in fundal — confirmat direct intr-un incident
  // live (comanda Premium reala, verificata in baza de date de productie: statusul ajunsese
  // 'preview_ready' cu ambele variante gata, dar interfata ramasese pe ecranul de asteptare).
  // Cauza cea mai probabila: Safari iOS poate suspenda setTimeout-urile unei pagini cat timp
  // tab-ul nu e vizibil (ecran blocat, schimbare de aplicatie) — lantul de polling la 4s isi
  // revine la loc cand tab-ul redevine vizibil, dar poate intarzia perceptibil, si utilizatorul
  // vede in continuare ecranul vechi pana atunci. Fortam aici o verificare IMEDIATA a starii
  // reale de fiecare data cand tab-ul redevine vizibil (sau pagina e restaurata din bfcache),
  // fara sa mai asteptam ca timer-ul intrerupt sa se reactiveze singur.
  // ==========================================================================================
  function forceImmediatePoll() {
    if (finished) return;
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    pollStatus();
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) forceImmediatePoll();
  });
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) forceImmediatePoll();
  });

  // -------- Reincercare STRICT manuala — singurul loc din pagina care apeleaza /generate.
  // Trimite o singura cerere, dezactiveaza butonul imediat (previne dublu-click), verifica
  // raspunsul HTTP explicit (inclusiv 409 — generare deja in curs, gestionat ca succes,
  // pentru ca inseamna ca exista deja un task activ pe server). --------
  retryBtn.addEventListener('click', async () => {
    // FINISAJ FINAL PACHET STANDARD: un job de REGENERARE esuat NU se reincearca apeland
    // /generate (ar porni gresit o generare INITIALA, semantic incorect si oricum respins de
    // server). editsUsed a fost deja restituit la esec (vezi refundEditIfReserved in server.js),
    // deci clientul poate porni pur si simplu o noua incercare din formularul de editare —
    // navigam idempotent inapoi acolo, fara nicio cerere de retea suplimentara.
    if (isRegenMode) {
      window.location.href = `/melodia-mea.html?id=${encodeURIComponent(orderId)}&token=${encodeURIComponent(accessToken)}`;
      return;
    }

    retryBtn.disabled = true;
    retryBtn.textContent = t.retrying;

    try {
      const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken },
        body: JSON.stringify({ feedback: null })
      });

      if (!res.ok && res.status !== 409) {
        // cererea a esuat cu adevarat (nu doar "deja in curs") — aratam eroare clara,
        // reactivam butonul, NU pornim polling-ul din nou
        let serverMsg = '';
        try { const data = await res.json(); serverMsg = data && data.error; } catch (e) {}
        retryBtn.disabled = false;
        retryBtn.textContent = t.retryBtn;
        document.getElementById('err-sub').textContent = serverMsg || t.errSub;
        return;
      }

      // acceptat (200) sau deja in desfasurare (409, ex. pornit din alta fila) —
      // in ambele cazuri exista acum un task activ, reluam polling-ul normal
      consecutivePollFailures = 0;
      startTime = Date.now();
      localStorage.setItem(startKey, String(startTime));

      finished = false;
      errorState.style.display = 'none';
      progressState.style.display = 'block';
      retryBtn.disabled = false;
      retryBtn.textContent = t.retryBtn;
      spinnerEl.style.opacity = '1';
      spinnerCheckEl.classList.remove('show');
      currentStageIndex = -1;

      // O reincercare porneste o generare NOUA (de la 0) — fara acest reset, procentul ramas
      // de la incercarea esuata anterior (ex. 55%) ar ramane afisat, inghetat, pana cand noua
      // generare il depaseste real (updateRealProgress nu regreseaza niciodata vizual) — un
      // procent "vechi", nu fals, dar inducand in eroare pentru incercarea curenta.
      highestShownPercent = 0;
      progressFill.classList.remove('real', 'done');
      progressFill.style.width = '';
      estimatePillEl.classList.add('hidden');

      updateProgress();
      pollStatus();
    } catch (err) {
      // eroare de retea la trimiterea cererii de retry - reactivam butonul, ramanem
      // in starea de eroare, clientul poate incerca din nou cand vrea
      retryBtn.disabled = false;
      retryBtn.textContent = t.retryBtn;
      document.getElementById('err-sub').textContent = t.errSub;
    }
  });
</script>
</body>
</html>
