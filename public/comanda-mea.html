<title>Comanda mea — NALUNA</title>

<style>
  :root{
    --bg:#FAF8F5; --bg-secondary:#F8F6F2; --surface:#FDFCFA;
    --text:#2B2B2B; --text-secondary:#6B6B6B;
    --gold:#A8834B; --gold-deep:#8B6D3F; --line:#E8E2D6;
    --success:#5F8F6E; --error:#B3574A;
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:'Sora', sans-serif; min-height:100vh; margin:0; }
  .wrap{ max-width:520px; margin:0 auto; padding:64px 24px; }
  .logo-mark{ width:44px; margin-bottom:32px; display:block; }
  h1{ font-family:'Fraunces', serif; font-weight:400; font-size:26px; margin-bottom:8px; }
  h2{ font-family:'Fraunces', serif; font-weight:400; font-size:17px; margin:0 0 6px; }
  p.sub{ color:var(--text-secondary); font-size:14px; margin-bottom:28px; }
  .field{ display:flex; gap:10px; margin-bottom:32px; }
  input[type="text"]{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:'Sora', sans-serif; font-size:14px;
  }
  input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  button{
    background:var(--text); color:var(--bg); border:none; border-radius:10px;
    padding:12px 22px; font-weight:500; font-size:14px; cursor:pointer;
    transition:background-color .25s ease; font-family:'Sora',sans-serif;
  }
  button:hover{ background:var(--gold-deep); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--text-secondary); border:1px solid var(--line); }
  .btn-secondary:hover{ background:var(--surface); color:var(--text); }
  .order{
    background:var(--bg-secondary); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:14px;
  }
  .order .top{ display:flex; justify-content:space-between; align-items:center; }
  .order .name{ font-weight:600; }
  .status{
    font-size:11px; padding:4px 10px; border-radius:999px; text-transform:uppercase;
    letter-spacing:.06em; font-family:'Sora',sans-serif;
  }
  .status-ready{ background:rgba(95,143,110,.14); color:var(--success); }
  .status-generating, .status-preview_ready{ background:rgba(168,131,75,.14); color:var(--gold-deep); }
  .status-draft{ background:rgba(107,107,107,.12); color:var(--text-secondary); }
  .status-generation_failed{ background:rgba(179,87,74,.12); color:var(--error); }
  audio{ width:100%; margin-top:14px; }
  .empty{ color:var(--text-secondary); font-size:14px; }
  a.download{ color:var(--gold-deep); font-size:13px; display:inline-block; margin-top:10px; margin-right:14px; }
  .plan-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--gold); border-radius:999px; padding:6px 14px; margin-bottom:12px;
    font-size:12px; font-weight:600; color:var(--gold-deep);
  }

  .memories{ margin-top:20px; padding-top:20px; border-top:1px solid var(--line); }
  .memories-sub{ font-size:13px; color:var(--text-secondary); margin-bottom:14px; }
  .memories-hint{ font-size:12px; color:var(--text-secondary); margin:8px 0 14px; }
  .mem-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .mem-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font-size:13px;
  }
  .mem-item .mem-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .mem-info{ flex:1; min-width:0; }
  .mem-item .mem-meta{ font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .mem-item .mem-meta.err{ color:var(--error); }
  .mem-progress-track{ background:var(--line); border-radius:999px; height:4px; overflow:hidden; margin-top:5px; }
  .mem-progress-fill{ background:var(--gold); height:100%; border-radius:999px; transition:width .2s ease; }
  .mem-batch-status{ font-size:12px; font-weight:600; color:var(--gold-deep); margin:2px 0 10px; min-height:15px; }
  .mem-item select{
    font-family:'Sora',sans-serif; font-size:12px; border:1px solid var(--line); border-radius:6px;
    padding:4px 6px; background:var(--bg); color:var(--text);
  }
  .mem-page-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .mem-actions{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .mem-actions button{
    background:none; border:none; cursor:pointer; line-height:1; padding:4px 6px;
    color:var(--text-secondary); font-size:14px; border-radius:6px;
  }
  .mem-actions button:hover{ background:rgba(43,43,43,.06); }
  .mem-actions button:disabled{ opacity:.35; cursor:default; }
  .mem-actions .mem-remove{ color:var(--error); font-size:16px; }
  .mem-actions .mem-retry{ color:var(--gold-deep); font-size:12px; font-weight:600; }
  #mem-file-input{
    display:block; width:100%; font-size:13px; margin-bottom:10px;
    font-family:'Sora',sans-serif; color:var(--text-secondary);
  }
  .mem-status{ font-size:13px; margin-top:10px; }
  .mem-status.err{ color:var(--error); }
</style>

      status: { draft: 'Ödenmedi', generating: 'Besteleniyor', preview_ready: 'Ön izleme hazır', ready: 'Hazır', generation_failed: 'Hata' },
      memories_title: 'Fotoğraflarınızı ve videolarınızı ekleyin',
      memories_sub: '3 ile 10 arası fotoğraf veya video klip ekleyin, bunları sinematik geçişlerle bir söz videosuna dönüştürelim.',
      memories_hint: 'Bu adımı atlayabilirsiniz — video basit, şık bir arka plan kullanır.',
      memories_upload_btn: 'Yükle', memories_uploading: 'Yükleniyor...',
      memories_create_btn: 'Videomu oluştur', memories_create_btn_skip: 'Fotoğrafsız oluştur',
      memories_creating: 'Anı videonuz oluşturuluyor... bu birkaç dakika sürebilir',
      memories_remove: '✕', memories_upload_error: 'Yükleme başarısız oldu. Lütfen tekrar deneyin.',
      memories_queued: 'Sırada...', memories_uploaded: 'Yüklendi', memories_retry: 'Tekrar dene',
      memories_processing: 'İşleniyor',
      memories_uploading_pct: (pct) => `Yükleniyor — ${pct}%`,
      memories_batch_progress: (done, total, pct) => `${total} dosyadan ${done} tanesi yükleniyor — ${pct}%`,
      memories_batch_done: (n) => `${n} materyal yüklendi — devam edebilirsin`,
      memories_auto_upload_hint: 'Materyaller otomatik olarak yükleniyor. Tekrar dokunmana gerek yok.',
      memories_upload_timeout: 'Bu çok uzun sürüyor — bağlantınızı kontrol edip tekrar deneyin.',
      memories_no_files_selected: "Seçiciden hiçbir dosya alamadık — lütfen tekrar deneyin (fotoğrafların iCloud'dan tamamen indirildiğinden de emin olun).",
      memories_ios_recovery: "iPhone'unuz dosyaları siteye göndermedi. Bu sayfayı doğrudan Safari'de açın ve fotoğrafların veya videoların telefonunuzda tamamen indirildiğinden emin olun.",
      memories_ios_preparing: "iPhone'unuz seçilen videoları hazırlıyor. Büyük dosyalar veya iCloud'da saklananlar için bu biraz zaman alabilir. Lütfen tekrar dokunmayın.",
      memories_create_error: 'Video oluşturma başarısız oldu. Lütfen tekrar deneyin.',
      plan_standard: '🎵 Standart Paket', plan_premium: '💿 Premium Paket', plan_video: '🎬 Video Hediye'
    }
  };
  const supportedLangs = ['ro', 'en', 'de', 'es', 'it', 'fr', 'bg', 'tr'];
  const savedLang = localStorage.getItem('nds_lang');
  const lang = supportedLangs.includes(savedLang) ? savedLang : 'ro';
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('h1-title').textContent = t.title;
  document.getElementById('p-sub').textContent = t.sub;
  document.getElementById('btn-search').textContent = t.search;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  let currentToken = null;
  // RELANSARE (2026-08-14, "un singur FormData cu toate fisierele intr-un singur POST nu e
  // incarcare directa/fragmentata/reluabila"): inlocuit stagedFiles + un buton "Incarca" manual
  // care trimitea TOATE fisierele intr-o singura cerere (o cerere esuata = tot lotul pierdut,
  // fara nicio distinctie intre fisiere) cu acelasi mecanism DEJA verificat live in
  // melodia-mea.html: o coada per-fisier (uploadQueue), fiecare fisier cu propriul
  // XMLHttpRequest, propriul progres, propria stare si retry individual — un fisier care
  // esueaza NU afecteaza restul lotului, deja incarcat sau inca in coada.
  let uploadQueue = []; // { localId, file, status, progress, errorMsg, thumbUrl, xhr }
  let memOrderRef = null;

  // Identic cu isVideoFile() din melodia-mea.html — vezi comentariul de acolo: Safari iOS poate
  // raporta file.type gol pentru unele videoclipuri, mai ales cele nematerializate complet din
  // iCloud; STRICT pentru afisarea iconitei locale, validarea reala ramane server-side.
  const VIDEO_EXTENSIONS = ['.mp4', '.m4v', '.mov', '.webm'];
  function isVideoFile(file) {
    if (file.type.startsWith('video')) return true;
    if (file.type) return false;
    const match = String(file.name || '').match(/\.[^./\\]+$/);
    return !!match && VIDEO_EXTENSIONS.includes(match[0].toLowerCase());
  }

  // Diagnostic minim, respectand explicit cerinta de confidentialitate: NICIODATA nume de
  // fisier, continut de poza/video sau alt date personale — doar evenimente, numaratori si
  // tip/dimensiune generale per pozitie, pentru a putea urmari unde se pierde eventual un
  // fisier intre selector -> pagina -> server, fara sa expunem vreodata continutul selectat.
  function memLog(orderId, event, data) {
    try {
      console.debug('[naluna-media]', { orderId, uploadAttemptId: memUploadAttemptId, event, ...(data || {}) });
    } catch (e) { /* diagnosticul nu trebuie sa opreasca fluxul real */ }
  }
  let memUploadAttemptId = null;
  const memIsIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const memIsInAppBrowser = /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|Telegram/i.test(navigator.userAgent);

  function renderMemories(o) {
    if (o.plan !== 'video' || o.hasVideo) return '';
    memOrderRef = o;
    return `
      <div class="memories" id="memories">
        <h2>${t.memories_title}</h2>
        <p class="memories-sub">${t.memories_sub}</p>
        <div class="mem-list" id="mem-uploaded-list"></div>
        <p class="mem-batch-status" id="mem-batch-status"></p>
        <div class="mem-list" id="mem-staged-list"></div>
        <!-- CORECȚIE (2026-08-14, "Articolele nu pot fi încărcate" pe iPhone) — vezi comentariul
             identic din melodia-mea.html: acceptul explicit, cu "image/x-adobe-dng" (MIME
             nestandard) si ".dng" redundant, putea face Safari/iOS sa esueze la initializarea
             selectorului nativ pentru INTREAGA selectie. Validarea reala ramane STRICT
             server-side (POST /media), neschimbata. NU s-a mai modificat de atunci — HTML valid,
             confirmat exact asa in productie. -->
        <input type="file" id="mem-file-input" multiple accept="image/*,video/*">
        <p class="memories-hint">${t.memories_hint}</p>
        <div class="mem-page-actions">
          <button type="button" class="${(o.uploadedMedia || []).length > 0 ? '' : 'btn-secondary'}" id="mem-create-btn">${(o.uploadedMedia || []).length > 0 ? t.memories_create_btn : t.memories_create_btn_skip}</button>
        </div>
        <p class="mem-status" id="mem-status"></p>
      </div>
    `;
  }

  // CORECȚIE (2026-08-14, "poziționare complet automată"): dropdown-ul de preferință de
  // sectiune a fost eliminat — pozitionarea materialelor in montaj e acum STRICT automata.
  // Extras intr-o functie separata (RELANSARE, "nu reincarca toata comanda dupa fiecare
  // fisier") — randata atat la deschiderea initiala CAT si de refreshOrderMediaOnly(), fara
  // sa mai fie nevoie de un rebuild al INTREGII pagini (results.innerHTML) doar pentru atat.
  function renderExistingMediaList(order) {
    const el = document.getElementById('mem-uploaded-list');
    if (!el) return;
    const uploaded = order.uploadedMedia || [];
    el.innerHTML = uploaded.map((m, i) => `
      <div class="mem-item">
        <span class="mem-name">${m.type === 'photo' ? '🖼️' : '🎬'}</span>
        <button type="button" class="mem-remove" data-remove-index="${i}" title="${t.memories_remove}">${t.memories_remove}</button>
      </div>
    `).join('');
    el.querySelectorAll('button[data-remove-index]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await fetch(`/api/orders/${order.id}/media/${btn.dataset.removeIndex}`, {
            method: 'DELETE',
            headers: { 'X-Access-Token': currentToken || '' }
          });
          await refreshOrderMediaOnly();
        } catch (e) {
          btn.disabled = false;
        }
      });
    });
    const createBtn = document.getElementById('mem-create-btn');
    if (createBtn) {
      createBtn.className = uploaded.length > 0 ? '' : 'btn-secondary';
      createBtn.textContent = uploaded.length > 0 ? t.memories_create_btn : t.memories_create_btn_skip;
    }
  }

  // Sincronizare USOARA — reia STRICT materialele (acelasi endpoint token-based folosit deja
  // de lookup()), fara sa reconstruiasca playerul audio, badge-ul de pachet sau restul cardului
  // de comanda. Folosita de scheduleMemSync() dupa fiecare fisier confirmat — vezi comentariul
  // de acolo pentru motivul exact (renderQueueList complet + lookup() complet la fiecare fisier
  // faceau interfata sa raspunda greu, cu carduri care pareau ca "dispar" la fiecare reconstructie).
  async function refreshOrderMediaOnly() {
    if (!currentToken) return;
    try {
      const res = await fetch('/api/orders/access/' + encodeURIComponent(currentToken));
      if (!res.ok) return;
      const fresh = await res.json();
      if (memOrderRef) {
        memOrderRef.uploadedMedia = fresh.uploadedMedia;
        memOrderRef.hasVideo = fresh.hasVideo;
      }
      renderExistingMediaList(memOrderRef);
      updateMemActionGates();
    } catch (e) { /* urmatoarea sincronizare va corecta */ }
  }

  // ==========================================================================================
  // RELANSARE 2026-08-14 ("cardurile apar greu/inegal, unele goale, interfata raspunde greu"):
  // dovada masurata — renderQueueList() (rebuild COMPLET, prin innerHTML, cu re-instalarea TUTUROR
  // listenerelor) rula la FIECARE eveniment xhr.upload.onprogress. Inlocuit cu: randare COMPLETA
  // doar la schimbari STRUCTURALE (fisier adaugat/eliminat) — renderQueueList()/renderQueueRow();
  // actualizari de progres fac DOAR un patch direct pe randul afectat (patchQueueRowProgress),
  // throttled la un singur update pe frame prin requestAnimationFrame.
  // ==========================================================================================
  function renderQueueRowInner(q) {
    const pct = q.status === 'processing' ? 100 : q.progress;
    return `
      <div class="mem-info">
        <span class="mem-name">${isVideoFile(q.file) ? '🎬' : '🖼️'} ${escapeHtml(q.file.name)}</span>
        <span class="mem-meta ${q.status === 'error' ? 'err' : ''}">${
          q.status === 'uploading' ? t.memories_uploading_pct(q.progress)
          : q.status === 'processing' ? t.memories_processing
          : q.status === 'pending' ? t.memories_queued
          : q.status === 'error' ? (q.errorMsg || t.memories_upload_error)
          : t.memories_uploaded
        }</span>
        ${(q.status === 'uploading' || q.status === 'processing') ? `<div class="mem-progress-track"><div class="mem-progress-fill" style="width:${pct}%"></div></div>` : ''}
      </div>
      <div class="mem-actions">
        ${q.status === 'error' ? `<button type="button" class="mem-retry" data-retry-id="${q.localId}">${t.memories_retry}</button>` : ''}
        <button type="button" class="mem-remove" data-queue-remove="${q.localId}" title="${t.memories_remove}" ${(q.status === 'uploading' || q.status === 'processing') ? 'disabled' : ''}>${t.memories_remove}</button>
      </div>
    `;
  }

  function wireQueueRow(row, entry) {
    const retryBtn = row.querySelector('[data-retry-id]');
    if (retryBtn) retryBtn.addEventListener('click', () => {
      entry.status = 'pending';
      entry.errorMsg = null;
      renderQueueRow(entry);
      processUploadQueue();
    });
    const removeBtn = row.querySelector('[data-queue-remove]');
    if (removeBtn) removeBtn.addEventListener('click', () => {
      const idx = uploadQueue.findIndex(q => q.localId === entry.localId);
      if (idx === -1) return;
      entry.abortRequested = true;
      if (entry.xhr) entry.xhr.abort();
      if (entry.activePartXhrs) Object.values(entry.activePartXhrs).forEach(xhr => { try { xhr.abort(); } catch (e) {} });
      if (entry.multipartSessionId && memOrderRef) {
        fetch(`/api/orders/${memOrderRef.id}/media/multipart/${entry.multipartSessionId}`, {
          method: 'DELETE', headers: { 'X-Access-Token': currentToken || '' }
        }).catch(() => {});
      }
      uploadQueue.splice(idx, 1);
      processUploadQueue();
      renderQueueList();
    });
  }

  function renderQueueList() {
    const el = document.getElementById('mem-staged-list');
    if (!el) return;
    el.innerHTML = uploadQueue.map(q => `<div class="mem-item" data-queue-id="${q.localId}">${renderQueueRowInner(q)}</div>`).join('');
    el.querySelectorAll('[data-queue-id]').forEach(row => {
      const entry = uploadQueue.find(q => q.localId === row.dataset.queueId);
      if (entry) wireQueueRow(row, entry);
    });
    renderBatchStatus();
    updateMemActionGates();
  }

  function renderQueueRow(entry) {
    const row = document.querySelector(`#mem-staged-list [data-queue-id="${entry.localId}"]`);
    if (!row) { renderQueueList(); return; }
    row.innerHTML = renderQueueRowInner(entry);
    wireQueueRow(row, entry);
    renderBatchStatus();
    updateMemActionGates();
  }

  function patchQueueRowProgress(entry) {
    const row = document.querySelector(`#mem-staged-list [data-queue-id="${entry.localId}"]`);
    if (!row) return;
    const fill = row.querySelector('.mem-progress-fill');
    const meta = row.querySelector('.mem-meta');
    if (!fill || !meta) { renderQueueRow(entry); return; }
    fill.style.width = (entry.status === 'processing' ? 100 : entry.progress) + '%';
    meta.textContent = entry.status === 'processing' ? t.memories_processing : t.memories_uploading_pct(entry.progress);
    meta.classList.remove('err');
  }

  let progressRafScheduled = false;
  const pendingProgressIds = new Set();
  function scheduleProgressUpdate(entry) {
    pendingProgressIds.add(entry.localId);
    if (progressRafScheduled) return;
    progressRafScheduled = true;
    requestAnimationFrame(() => {
      progressRafScheduled = false;
      const ids = Array.from(pendingProgressIds);
      pendingProgressIds.clear();
      ids.forEach(id => {
        const e = uploadQueue.find(q => q.localId === id);
        if (e) patchQueueRowProgress(e);
      });
      renderBatchStatus();
    });
  }

  let memBatchTotal = 0;
  let memBatchDoneCount = 0;
  function renderBatchStatus() {
    const el = document.getElementById('mem-batch-status');
    if (!el) return;
    const active = uploadQueue.filter(q => q.status !== 'error');
    if (memBatchTotal === 0) { el.textContent = ''; return; }
    if (active.length === 0) {
      el.textContent = memBatchDoneCount > 0 ? t.memories_batch_done(memBatchDoneCount) : '';
      return;
    }
    const inFlightSum = active.reduce((s, q) => s + (q.status === 'processing' ? 100 : (q.progress || 0)), 0);
    const overallPct = Math.min(100, Math.round(((memBatchDoneCount * 100) + inFlightSum) / memBatchTotal));
    el.textContent = t.memories_batch_progress(memBatchDoneCount, memBatchTotal, overallPct);
  }

  // Sincronizare "single-flight", debounced (700ms) — vezi comentariul identic din
  // melodia-mea.html: niciodata doua sincronizari simultane, niciodata un raspuns mai vechi
  // suprascriind unul mai nou.
  let memSyncTimer = null;
  let memSyncInFlight = false;
  let memSyncAgainNeeded = false;
  function scheduleMemSync() {
    memSyncAgainNeeded = true;
    if (memSyncTimer || memSyncInFlight) return;
    memSyncTimer = setTimeout(runMemSync, 700);
  }
  async function runMemSync() {
    memSyncTimer = null;
    if (memSyncInFlight || !memSyncAgainNeeded) return;
    memSyncAgainNeeded = false;
    memSyncInFlight = true;
    try {
      await refreshOrderMediaOnly();
    } finally {
      memSyncInFlight = false;
      if (memSyncAgainNeeded) memSyncTimer = setTimeout(runMemSync, 700);
    }
  }

  const MEM_MAX_CONCURRENT_UPLOADS = 2;
  const MEM_UPLOAD_TIMEOUT_MS = 900000;
  const MEM_MULTIPART_THRESHOLD_BYTES = 20 * 1024 * 1024;
  const MEM_PART_RETRY_LIMIT = 5;
  const MEM_MAX_PARALLEL_PARTS = 2;

  function processUploadQueue() {
    const active = uploadQueue.filter(q => q.status === 'uploading' || q.status === 'processing').length;
    let slots = MEM_MAX_CONCURRENT_UPLOADS - active;
    if (slots <= 0) return;
    for (const entry of uploadQueue) {
      if (slots <= 0) break;
      if (entry.status === 'pending') {
        startUpload(entry);
        slots--;
      }
    }
  }

  function startUpload(entry) {
    if (!memOrderRef) return;
    entry.abortRequested = false;
    if (isVideoFile(entry.file) && entry.file.size > MEM_MULTIPART_THRESHOLD_BYTES) {
      startMultipartUpload(entry);
    } else {
      startSingleUpload(entry);
    }
  }

  function startSingleUpload(entry) {
    const orderId = memOrderRef.id;
    entry.status = 'uploading';
    entry.progress = 0;
    entry.errorMsg = null;
    renderQueueRow(entry);

    const formData = new FormData();
    formData.append('media', entry.file);
    formData.append('sections', JSON.stringify(['']));

    const xhr = new XMLHttpRequest();
    entry.xhr = xhr;
    xhr.open('POST', `/api/orders/${orderId}/media`);
    xhr.setRequestHeader('X-Access-Token', currentToken || '');
    xhr.timeout = MEM_UPLOAD_TIMEOUT_MS;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        entry.progress = pct;
        if (pct >= 100 && entry.status === 'uploading') entry.status = 'processing';
        scheduleProgressUpdate(entry);
      }
    };
    xhr.onload = () => {
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) { /* raspuns invalid */ }
      const failedEntry = data && Array.isArray(data.failed) ? data.failed[0] : null;
      const succeeded = data && Array.isArray(data.uploaded) && data.uploaded.length > 0;
      memLog(orderId, 'upload_response', { status: xhr.status, receivedOk: !!succeeded });
      if (xhr.status >= 200 && xhr.status < 300 && succeeded) {
        uploadQueue = uploadQueue.filter(q => q.localId !== entry.localId);
        memBatchDoneCount++;
        renderQueueList();
        processUploadQueue();
        scheduleMemSync();
      } else {
        entry.status = 'error';
        entry.errorMsg = (failedEntry && failedEntry.reason) || (data && data.error) || t.memories_upload_error;
        renderQueueRow(entry);
        processUploadQueue();
      }
    };
    xhr.onerror = () => {
      entry.status = 'error';
      entry.errorMsg = t.memories_upload_error;
      renderQueueRow(entry);
      processUploadQueue();
    };
    xhr.ontimeout = () => {
      entry.status = 'error';
      entry.errorMsg = t.memories_upload_timeout;
      renderQueueRow(entry);
      processUploadQueue();
    };
    xhr.onabort = () => { processUploadQueue(); };
    xhr.send(formData);
  }

  // Upload MULTIPART DIRECT DIN BROWSER CATRE R2 — vezi comentariul identic, mai detaliat, din
  // melodia-mea.html si din server.js. Rezervat videoclipurilor mari. Fragmentele NU mai trec
  // prin acest server — Railway autorizeaza si intoarce cate un URL semnat per fragment.
  function uploadOnePart(entry, orderId, partNumber, blob, onProgress) {
    return new Promise((resolve, reject) => {
      let attempt = 0;
      const tryOnce = async () => {
        if (entry.abortRequested) { reject(new Error('aborted')); return; }
        try {
          const urlRes = await fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}/part-url`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Access-Token': currentToken || '' },
            body: JSON.stringify({ partNumber })
          });
          const urlData = await urlRes.json().catch(() => ({}));
          if (!urlRes.ok || !urlData.url) { retryOrFail(); return; }
          const xhr = new XMLHttpRequest();
          entry.activePartXhrs = entry.activePartXhrs || {};
          entry.activePartXhrs[partNumber] = xhr;
          xhr.open('PUT', urlData.url);
          xhr.timeout = MEM_UPLOAD_TIMEOUT_MS;
          xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded); };
          xhr.onload = () => {
            delete entry.activePartXhrs[partNumber];
            if (xhr.status >= 200 && xhr.status < 300) {
              const etag = xhr.getResponseHeader('ETag');
              if (!etag) { retryOrFail(); return; }
              onProgress(blob.size);
              resolve(etag);
            } else { retryOrFail(); }
          };
          xhr.onerror = () => { delete entry.activePartXhrs[partNumber]; retryOrFail(); };
          xhr.ontimeout = () => { delete entry.activePartXhrs[partNumber]; retryOrFail(); };
          xhr.onabort = () => { delete entry.activePartXhrs[partNumber]; reject(new Error('aborted')); };
          xhr.send(blob);
        } catch (err) {
          retryOrFail();
        }
      };
      const retryOrFail = () => {
        attempt++;
        if (entry.abortRequested) { reject(new Error('aborted')); return; }
        if (attempt > MEM_PART_RETRY_LIMIT) { reject(new Error('part failed')); return; }
        onProgress(0);
        setTimeout(tryOnce, Math.min(1000 * attempt, 5000));
      };
      tryOnce();
    });
  }

  async function startMultipartUpload(entry) {
    const orderId = memOrderRef.id;
    entry.status = 'uploading';
    entry.progress = 0;
    entry.errorMsg = null;
    renderQueueRow(entry);
    try {
      const initRes = await fetch(`/api/orders/${orderId}/media/multipart/init`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Access-Token': currentToken || '' },
        body: JSON.stringify({ filename: entry.file.name, size: entry.file.size, mimeType: entry.file.type || '', section: '' })
      });
      const initData = await initRes.json().catch(() => ({}));
      if (!initRes.ok || !initData.sessionId) throw new Error(initData.error || 'init failed');
      entry.multipartSessionId = initData.sessionId;
      const partSize = initData.partSize || (10 * 1024 * 1024);
      const totalBytes = entry.file.size;
      const totalParts = Math.max(1, Math.ceil(totalBytes / partSize));

      const partBytesSent = new Array(totalParts + 1).fill(0);
      function reportProgress() {
        const sum = partBytesSent.reduce((a, b) => a + b, 0);
        entry.progress = Math.min(99, Math.round((sum / totalBytes) * 100));
        scheduleProgressUpdate(entry);
      }

      const completedParts = await new Promise((resolveAll, rejectAll) => {
        const results = [];
        let nextPartNumber = 1;
        let active = 0;
        let firstError = null;
        function pump() {
          if (firstError) { rejectAll(firstError); return; }
          if (results.length === totalParts) { resolveAll(results); return; }
          while (active < MEM_MAX_PARALLEL_PARTS && nextPartNumber <= totalParts) {
            const partNumber = nextPartNumber++;
            const start = (partNumber - 1) * partSize;
            const end = Math.min(start + partSize, totalBytes);
            const blob = entry.file.slice(start, end);
            active++;
            uploadOnePart(entry, orderId, partNumber, blob, (loaded) => { partBytesSent[partNumber] = loaded; reportProgress(); })
              .then(etag => { active--; results.push({ partNumber, etag }); pump(); })
              .catch(err => { active--; firstError = firstError || err; pump(); });
          }
        }
        pump();
      });

      if (entry.abortRequested) return;
      entry.status = 'processing';
      scheduleProgressUpdate(entry);
      completedParts.sort((a, b) => a.partNumber - b.partNumber);
      const completeRes = await fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Access-Token': currentToken || '' },
        body: JSON.stringify({ parts: completedParts })
      });
      const data = await completeRes.json().catch(() => ({}));
      const succeeded = data && Array.isArray(data.uploaded) && data.uploaded.length > 0;
      if (completeRes.ok && succeeded) {
        uploadQueue = uploadQueue.filter(q => q.localId !== entry.localId);
        memBatchDoneCount++;
        renderQueueList();
        processUploadQueue();
        scheduleMemSync();
      } else {
        const failedEntry = data && Array.isArray(data.failed) ? data.failed[0] : null;
        entry.status = 'error';
        entry.errorMsg = (failedEntry && failedEntry.reason) || (data && data.error) || t.memories_upload_error;
        renderQueueRow(entry);
        processUploadQueue();
      }
    } catch (err) {
      if (entry.abortRequested) return;
      entry.status = 'error';
      entry.errorMsg = t.memories_upload_error;
      renderQueueRow(entry);
      processUploadQueue();
    }
  }

  // Butonul de creare a videoclipului nu trebuie sa fie activ cat timp mai exista fisiere in
  // curs de incarcare sau esuate nerezolvate — selectia clientului trebuie fie confirmata pe
  // server, fie reincercata/eliminata explicit, inainte de a continua.
  function updateMemActionGates() {
    const createBtn = document.getElementById('mem-create-btn');
    if (!createBtn) return;
    const busy = uploadQueue.some(q => q.status === 'uploading' || q.status === 'pending' || q.status === 'processing');
    createBtn.disabled = busy;
  }

  function wireMemoriesEvents(orderId) {
    const fileInput = document.getElementById('mem-file-input');
    const createBtn = document.getElementById('mem-create-btn');
    const statusEl = document.getElementById('mem-status');
    if (!fileInput) return;

    renderExistingMediaList(memOrderRef);
    renderQueueList();
    updateMemActionGates();

    // RELANSARE 2026-08-14 ("starea de asteptare dupa selectarea videoclipurilor iPhone"):
    // eliminat complet timeout-ul orb de 1.2s care declara PREMATUR "iOS nu a predat
    // fisierele" si timeout-ul de 20s care debloca automat selectorul — iPhone Photos/iCloud
    // poate avea nevoie de 2-3 minute sa pregateasca un videoclip mare ÎNAINTE ca Safari sa
    // primeasca evenimentul 'change', iar ambele timeout-uri anterioare declarau eronat esec
    // exact in acest interval normal, obligand clientul sa apese repetat. Selectorul se
    // deblocheaza ACUM STRICT la: 'change' real, 'cancel' real, sau o apasare manuala explicita
    // DUPA PICKER_MANUAL_RECOVERY_MS (recuperare la cerere, niciodata redeschidere automata).
    // Cat timp asteptam 'change', revenirea in focus/visibilitychange arata STRICT un mesaj
    // neutru (niciodata eroare) si NU deblocheaza nimic.
    let pickerLocked = false;
    let pickerLockedAt = 0;
    const PICKER_MANUAL_RECOVERY_MS = 5 * 60 * 1000;
    let pickerAwaitingChange = false;
    let pickerOpenToken = 0;
    fileInput.addEventListener('click', (e) => {
      if (pickerLocked) {
        if (Date.now() - pickerLockedAt < PICKER_MANUAL_RECOVERY_MS) { e.preventDefault(); return; }
        memLog(orderId, 'picker_manual_recovery', { elapsedMs: Date.now() - pickerLockedAt });
      }
      pickerLocked = true;
      pickerLockedAt = Date.now();
      pickerAwaitingChange = true;
      pickerOpenToken++;
      statusEl.textContent = '';
      statusEl.classList.remove('err');
      memUploadAttemptId = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      memLog(orderId, 'picker_open', { ios: memIsIOS, inAppBrowser: memIsInAppBrowser });
    });
    fileInput.addEventListener('cancel', () => {
      pickerLocked = false;
      pickerAwaitingChange = false;
      statusEl.textContent = '';
      statusEl.classList.remove('err');
      memLog(orderId, 'picker_cancel', {});
    });
    // Fara niciun timer — arata mesajul neutru IMEDIAT daca revenim in pagina si inca asteptam
    // 'change' (iPhone inca pregateste materialul). Daca 'change' a sosit deja intre timp,
    // pickerAwaitingChange e deja fals si aceasta functie nu face nimic.
    function checkPickerDelivery() {
      if (!pickerAwaitingChange) return;
      memLog(orderId, 'picker_still_awaiting_after_focus_return', { ios: memIsIOS });
      if (memIsIOS) {
        statusEl.textContent = t.memories_ios_preparing;
        statusEl.classList.remove('err');
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkPickerDelivery();
    });
    window.addEventListener('focus', checkPickerDelivery);

    let memStatusHintToken = 0;

    fileInput.addEventListener('change', () => {
      pickerLocked = false;
      pickerAwaitingChange = false;
      const files = Array.from(fileInput.files);
      fileInput.value = '';
      memLog(orderId, 'change', {
        filesLength: files.length,
        items: files.map(f => ({ type: (f.type || '').split('/')[0] || 'unknown', sizeMb: Math.round((f.size || 0) / 1024 / 1024) }))
      });
      if (files.length === 0) {
        statusEl.textContent = t.memories_no_files_selected;
        statusEl.classList.add('err');
        return;
      }
      statusEl.textContent = t.memories_auto_upload_hint;
      statusEl.classList.remove('err');
      const hintToken = ++memStatusHintToken;
      setTimeout(() => { if (memStatusHintToken === hintToken) statusEl.textContent = ''; }, 4000);

      memBatchTotal += files.length;

      files.forEach(file => {
        try {
          uploadQueue.push({
            localId: 'q' + Math.random().toString(36).slice(2),
            file,
            status: 'pending',
            progress: 0,
            errorMsg: null,
            thumbUrl: null,
            xhr: null,
            multipartSessionId: null,
            abortRequested: false
          });
        } catch (err) {
          uploadQueue.push({
            localId: 'q' + Math.random().toString(36).slice(2),
            file,
            status: 'error',
            progress: 0,
            errorMsg: t.memories_upload_error,
            thumbUrl: null,
            xhr: null,
            multipartSessionId: null,
            abortRequested: false
          });
        }
      });
      memLog(orderId, 'staged', { queueLength: uploadQueue.length });
      // Toate cardurile intra IMEDIAT in interfata (randare completa, o singura data, sincron),
      // apoi uploadul porneste automat.
      renderQueueList();
      processUploadQueue();
    });

    createBtn.addEventListener('click', async () => {
      createBtn.disabled = true;
      statusEl.textContent = t.memories_creating;
      statusEl.classList.remove('err');
      try {
        const res = await fetch(`/api/orders/${orderId}/create-video`, {
          method: 'POST',
          headers: { 'X-Access-Token': currentToken || '' }
        });
        if (!res.ok && res.status !== 409) throw new Error('create failed');
        setTimeout(() => lookup(currentToken), 8000);
      } catch (e) {
        statusEl.textContent = t.memories_create_error;
        statusEl.classList.add('err');
        createBtn.disabled = false;
      }
    });
  }

  async function lookup(tokenOverride) {
    const token = (tokenOverride || document.getElementById('token').value.trim());
    const results = document.getElementById('results');
    if (!token) return;

    results.innerHTML = `<p class="empty">${t.searching}</p>`;

    try {
      const res = await fetch('/api/orders/access/' + encodeURIComponent(token));

      if (res.status === 400) {
        results.innerHTML = `<p class="empty">${t.invalid}</p>`;
        return;
      }
      if (res.status === 404) {
        results.innerHTML = `<p class="empty">${t.not_found}</p>`;
        return;
      }
      if (!res.ok) {
        results.innerHTML = `<p class="empty">${t.conn_error}</p>`;
        return;
      }

      const o = await res.json();
      currentToken = token;
      const fullUrl = `/media/full/${o.id}?token=${encodeURIComponent(token)}`;

      let extrasHtml = '';
      if (o.status === 'ready' && (o.plan === 'premium' || o.plan === 'video') && o.hasWav) {
        const wavUrl = `/media/wav/${o.id}?token=${encodeURIComponent(token)}`;
        extrasHtml += `<a class="download" href="${wavUrl}" download>${t.download_wav}</a>`;
      }
      if (o.status === 'ready' && o.plan === 'video' && o.hasVideo) {
        const videoUrl = `/media/video/${o.id}?token=${encodeURIComponent(token)}`;
        extrasHtml += `<a class="download" href="${videoUrl}" download>${t.download_video}</a>`;
      }
      // "Melodia cadou" — livrata la toate cele trei pachete dupa plata.
      if (o.status === 'ready' && o.hasGiftAudio) {
        const giftUrl = `/media/full/${o.id}/gift?token=${encodeURIComponent(token)}`;
        extrasHtml += `<a class="download" href="${giftUrl}" download>${t.gift_download}</a>`;
      }

      const planBadgeHtml = (o.plan === 'standard' || o.plan === 'premium' || o.plan === 'video')
        ? `<div class="plan-badge">${t['plan_' + o.plan]}</div>` : '';

      results.innerHTML = `
        <div class="order">
          <div class="top">
            <div class="name">${t.for_label} ${escapeHtml(o.recipient)}</div>
            <div class="status status-${o.status}">${t.status[o.status] || o.status}</div>
          </div>
          ${planBadgeHtml}
          ${o.status === 'ready' ? `
            <audio controls src="${fullUrl}"></audio>
            <div><a class="download" href="${fullUrl}" download>${t.download}</a>${extrasHtml}</div>
            ${renderMemories(o)}
          ` : ''}
        </div>
      `;

      if (o.status === 'ready') wireMemoriesEvents(o.id);
    } catch (e) {
      results.innerHTML = `<p class="empty">${t.conn_error}</p>`;
    }
  }

  // daca vine dintr-un link din email (?token=...), cautam automat, fara sa mai tasteze nimic
  const urlToken = new URLSearchParams(window.location.search).get('token');
  if (urlToken) {
    document.getElementById('token').value = urlToken;
    lookup(urlToken);
  }
</script>
