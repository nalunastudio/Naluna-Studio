<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comanda mea — NALUNA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F5; --bg-secondary:#F8F6F2; --surface:#FDFCFA;
    --text:#2B2B2B; --text-secondary:#6B6B6B;
    --gold:#A8834B; --gold-deep:#8B6D3F; --line:#E8E2D6;
    --success:#5F8F6E; --error:#B3574A;
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:'Sora', sans-serif; min-height:100vh; margin:0; }
  .wrap{ max-width:520px; margin:0 auto; padding:64px 24px; }
  .logo-mark{ width:44px; margin-bottom:32px; display:block; }
  h1{ font-family:'Fraunces', serif; font-weight:400; font-size:26px; margin-bottom:8px; }
  h2{ font-family:'Fraunces', serif; font-weight:400; font-size:17px; margin:0 0 6px; }
  p.sub{ color:var(--text-secondary); font-size:14px; margin-bottom:28px; }
  .field{ display:flex; gap:10px; margin-bottom:32px; }
  input[type="text"]{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:'Sora', sans-serif; font-size:14px;
  }
  input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  button{
    background:var(--text); color:var(--bg); border:none; border-radius:10px;
    padding:12px 22px; font-weight:500; font-size:14px; cursor:pointer;
    transition:background-color .25s ease; font-family:'Sora',sans-serif;
  }
  button:hover{ background:var(--gold-deep); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--text-secondary); border:1px solid var(--line); }
  .btn-secondary:hover{ background:var(--surface); color:var(--text); }
  .order{
    background:var(--bg-secondary); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:14px;
  }
  .order .top{ display:flex; justify-content:space-between; align-items:center; }
  .order .name{ font-weight:600; }
  .status{
    font-size:11px; padding:4px 10px; border-radius:999px; text-transform:uppercase;
    letter-spacing:.06em; font-family:'Sora',sans-serif;
  }
  .status-ready{ background:rgba(95,143,110,.14); color:var(--success); }
  .status-generating, .status-preview_ready{ background:rgba(168,131,75,.14); color:var(--gold-deep); }
  .status-draft{ background:rgba(107,107,107,.12); color:var(--text-secondary); }
  .status-generation_failed{ background:rgba(179,87,74,.12); color:var(--error); }
  audio{ width:100%; margin-top:14px; }
  .empty{ color:var(--text-secondary); font-size:14px; }
  a.download{ color:var(--gold-deep); font-size:13px; display:inline-block; margin-top:10px; margin-right:14px; }

  .memories{ margin-top:20px; padding-top:20px; border-top:1px solid var(--line); }
  .memories-sub{ font-size:13px; color:var(--text-secondary); margin-bottom:14px; }
  .memories-hint{ font-size:12px; color:var(--text-secondary); margin:8px 0 14px; }
  .mem-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .mem-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font-size:13px;
  }
  .mem-item .mem-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .mem-item select{
    font-family:'Sora',sans-serif; font-size:12px; border:1px solid var(--line); border-radius:6px;
    padding:4px 6px; background:var(--bg); color:var(--text);
  }
  .mem-item .mem-remove{
    background:none; border:none; color:var(--error); font-size:16px; cursor:pointer; line-height:1;
    padding:2px 4px;
  }
  #mem-file-input{
    display:block; width:100%; font-size:13px; margin-bottom:10px;
    font-family:'Sora',sans-serif; color:var(--text-secondary);
  }
  .mem-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .mem-status{ font-size:13px; margin-top:10px; }
  .mem-status.err{ color:var(--error); }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo-mark" src="/logo.svg" alt="NALUNA">
  <h1 id="h1-title">Comanda mea</h1>
  <p class="sub" id="p-sub">Introdu codul de acces primit pe email ca să-ți vezi melodia</p>

  <div class="field">
    <input type="text" id="token" placeholder="cod din emailul de confirmare" autocomplete="off">
    <button onclick="lookup()" id="btn-search">Caută</button>
  </div>

  <div id="results"></div>
</div>

      invalid: 'Codice di accesso non valido.',
      status: { draft: 'Non pagato', generating: 'In composizione', preview_ready: 'Anteprima pronta', ready: 'Pronta', generation_failed: 'Errore' },
      memories_title: 'Aggiungi le tue foto e i tuoi video',
      memories_sub: 'Aggiungi da 3 a 10 foto o clip video: le trasformeremo in un video con testo e transizioni cinematografiche.',
      memories_hint: 'Puoi saltare questo passaggio — il video userà uno sfondo semplice ed elegante.',
      memories_upload_btn: 'Carica', memories_uploading: 'Caricamento...',
      memories_create_btn: 'Crea il mio video', memories_create_btn_skip: 'Crea senza foto',

      invalid: 'Code d\'accès invalide.',
      status: { draft: 'Non payée', generating: 'En composition', preview_ready: 'Aperçu prêt', ready: 'Prête', generation_failed: 'Erreur' },

      memories_remove: '✕', memories_upload_error: 'Échec de l\'envoi. Veuillez réessayer.',

      memories_sections: { none: 'Aucune préférence', beginning: 'Début', verse1: 'Couplet 1', chorus: 'Refrain', verse2: 'Couplet 2', ending: 'Fin' }
    },
    bg: {
      title: 'Моята поръчка', sub: 'Въведи кода за достъп, получен по имейл, за да видиш песента си.',

      invalid: 'Невалиден код за достъп.',
      status: { draft: 'Неплатена', generating: 'Композира се', preview_ready: 'Прегледът е готов', ready: 'Готова', generation_failed: 'Грешка' },
      memories_title: 'Добави своите снимки и видеа',
      memories_sub: 'Добави между 3 и 10 снимки или видеоклипа и ние ще ги вплетем в лирик видео с кинематографични преходи.',
      memories_hint: 'Можеш да пропуснеш тази стъпка — видеото ще използва прост, елегантен фон.',
      memories_upload_btn: 'Качи', memories_uploading: 'Качване...',
      memories_create_btn: 'Създай видеото ми', memories_create_btn_skip: 'Създай без снимки',
      memories_creating: 'Създаваме твоето видео със спомени... може да отнеме няколко минути',
      memories_remove: '✕', memories_upload_error: 'Качването не бе успешно. Опитай отново.',
      memories_create_error: 'Създаването на видеото не бе успешно. Опитай отново.',

    },
    tr: {
      title: 'Siparişim', sub: 'Şarkınızı görmek için e-posta ile aldığınız erişim kodunu girin.',
      search: 'Ara', searching: 'Aranıyor...', not_found: 'Bu kod için sipariş bulunamadı.',
      conn_error: 'Bağlantı hatası. Lütfen tekrar deneyin.', for_label: 'Kimin için', download: 'Dosyayı indir', download_wav: 'WAV indir', download_video: 'Videoyu indir',
      invalid: 'Geçersiz erişim kodu.',
      status: { draft: 'Ödenmedi', generating: 'Besteleniyor', preview_ready: 'Ön izleme hazır', ready: 'Hazır', generation_failed: 'Hata' },
      memories_title: 'Fotoğraflarınızı ve videolarınızı ekleyin',
      memories_sub: '3 ile 10 arası fotoğraf veya video klip ekleyin, bunları sinematik geçişlerle bir söz videosuna dönüştürelim.',
      memories_hint: 'Bu adımı atlayabilirsiniz — video basit, şık bir arka plan kullanır.',
      memories_upload_btn: 'Yükle', memories_uploading: 'Yükleniyor...',
      memories_create_btn: 'Videomu oluştur', memories_create_btn_skip: 'Fotoğrafsız oluştur',
      memories_creating: 'Anı videonuz oluşturuluyor... bu birkaç dakika sürebilir',
      memories_remove: '✕', memories_upload_error: 'Yükleme başarısız oldu. Lütfen tekrar deneyin.',
      memories_create_error: 'Video oluşturma başarısız oldu. Lütfen tekrar deneyin.',

    }
  };
  const supportedLangs = ['ro', 'en', 'de', 'es', 'it', 'fr', 'bg', 'tr'];
  const savedLang = localStorage.getItem('nds_lang');
  const lang = supportedLangs.includes(savedLang) ? savedLang : 'ro';
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('h1-title').textContent = t.title;
  document.getElementById('p-sub').textContent = t.sub;
  document.getElementById('btn-search').textContent = t.search;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  let currentToken = null;
  let stagedFiles = []; // { file, section }

  function renderMemories(o) {
    if (o.plan !== 'video' || o.hasVideo) return '';
    const uploaded = o.uploadedMedia || [];
    const uploadedHtml = uploaded.map((m, i) => `
      <div class="mem-item">
        <span class="mem-name">${m.type === 'photo' ? '🖼️' : '🎬'} ${escapeHtml(t.memories_sections[m.section] || t.memories_sections.none)}</span>
        <button type="button" class="mem-remove" data-remove-index="${i}" title="${t.memories_remove}">${t.memories_remove}</button>
      </div>
    `).join('');

    return `
      <div class="memories" id="memories">
        <h2>${t.memories_title}</h2>
        <p class="memories-sub">${t.memories_sub}</p>
        <div class="mem-list" id="mem-uploaded-list">${uploadedHtml}</div>
        <div class="mem-list" id="mem-staged-list"></div>
        <input type="file" id="mem-file-input" multiple
          accept="image/jpeg,image/png,image/webp,image/heic,image/heif,video/mp4,video/quicktime,video/webm">
        <p class="memories-hint">${t.memories_hint}</p>
        <div class="mem-actions">
          <button type="button" id="mem-upload-btn" style="display:none;">${t.memories_upload_btn}</button>
          <button type="button" class="${uploaded.length > 0 ? '' : 'btn-secondary'}" id="mem-create-btn">${uploaded.length > 0 ? t.memories_create_btn : t.memories_create_btn_skip}</button>
        </div>
        <p class="mem-status" id="mem-status"></p>
      </div>
    `;
  }

  function renderStagedList() {
    const el = document.getElementById('mem-staged-list');
    const uploadBtn = document.getElementById('mem-upload-btn');
    if (!el || !uploadBtn) return;
    const sectionOptions = Object.keys(t.memories_sections)
      .map(k => `<option value="${k === 'none' ? '' : k}">${escapeHtml(t.memories_sections[k])}</option>`).join('');
    el.innerHTML = stagedFiles.map((sf, i) => `
      <div class="mem-item">
        <span class="mem-name">${sf.file.type.startsWith('video') ? '🎬' : '🖼️'} ${escapeHtml(sf.file.name)}</span>
        <select data-staged-index="${i}">${sectionOptions}</select>
        <button type="button" class="mem-remove" data-staged-remove="${i}" title="${t.memories_remove}">${t.memories_remove}</button>
      </div>
    `).join('');
    uploadBtn.style.display = stagedFiles.length > 0 ? 'inline-block' : 'none';

    el.querySelectorAll('select[data-staged-index]').forEach(sel => {
      sel.addEventListener('change', () => {
        stagedFiles[Number(sel.dataset.stagedIndex)].section = sel.value || null;
      });
    });
    el.querySelectorAll('button[data-staged-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        stagedFiles.splice(Number(btn.dataset.stagedRemove), 1);
        renderStagedList();
      });
    });
  }

  function wireMemoriesEvents(orderId) {
    const fileInput = document.getElementById('mem-file-input');
    const uploadBtn = document.getElementById('mem-upload-btn');
    const createBtn = document.getElementById('mem-create-btn');
    const statusEl = document.getElementById('mem-status');
    if (!fileInput) return;

    document.querySelectorAll('#mem-uploaded-list button[data-remove-index]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await fetch(`/api/orders/${orderId}/media/${btn.dataset.removeIndex}`, {
            method: 'DELETE',
            headers: { 'X-Access-Token': currentToken || '' }
          });
          await lookup(currentToken);
        } catch (e) {
          btn.disabled = false;
        }
      });
    });

    fileInput.addEventListener('change', () => {
      stagedFiles = stagedFiles.concat(Array.from(fileInput.files).map(file => ({ file, section: null })));
      fileInput.value = '';
      renderStagedList();
    });

    uploadBtn.addEventListener('click', async () => {
      if (stagedFiles.length === 0) return;
      uploadBtn.disabled = true;
      uploadBtn.textContent = t.memories_uploading;
      statusEl.textContent = '';
      statusEl.classList.remove('err');
      try {
        const formData = new FormData();
        stagedFiles.forEach(sf => formData.append('media', sf.file));
        formData.append('sections', JSON.stringify(stagedFiles.map(sf => sf.section || '')));
        const res = await fetch(`/api/orders/${orderId}/media`, {
          method: 'POST',
          headers: { 'X-Access-Token': currentToken || '' },
          body: formData
        });
        if (!res.ok) throw new Error('upload failed');
        stagedFiles = [];
        await lookup(currentToken);
      } catch (e) {
        statusEl.textContent = t.memories_upload_error;
        statusEl.classList.add('err');
        uploadBtn.disabled = false;
        uploadBtn.textContent = t.memories_upload_btn;
      }
    });

    createBtn.addEventListener('click', async () => {
      createBtn.disabled = true;
      statusEl.textContent = t.memories_creating;
      statusEl.classList.remove('err');
      try {
        const res = await fetch(`/api/orders/${orderId}/create-video`, {
          method: 'POST',
          headers: { 'X-Access-Token': currentToken || '' }
        });
        if (!res.ok && res.status !== 409) throw new Error('create failed');
        setTimeout(() => lookup(currentToken), 8000);
      } catch (e) {
        statusEl.textContent = t.memories_create_error;
        statusEl.classList.add('err');
        createBtn.disabled = false;
      }
    });
  }

  async function lookup(tokenOverride) {
    const token = (tokenOverride || document.getElementById('token').value.trim());
    const results = document.getElementById('results');
    if (!token) return;

    results.innerHTML = `<p class="empty">${t.searching}</p>`;

    try {
      const res = await fetch('/api/orders/access/' + encodeURIComponent(token));

      if (res.status === 400) {
        results.innerHTML = `<p class="empty">${t.invalid}</p>`;
        return;
      }
      if (res.status === 404) {
        results.innerHTML = `<p class="empty">${t.not_found}</p>`;
        return;
      }
      if (!res.ok) {
        results.innerHTML = `<p class="empty">${t.conn_error}</p>`;
        return;
      }

      const o = await res.json();
      currentToken = token;
      const fullUrl = `/media/full/${o.id}?token=${encodeURIComponent(token)}`;

      let extrasHtml = '';
      if (o.status === 'ready' && (o.plan === 'premium' || o.plan === 'video') && o.hasWav) {
        const wavUrl = `/media/wav/${o.id}?token=${encodeURIComponent(token)}`;
        extrasHtml += `<a class="download" href="${wavUrl}" download>${t.download_wav}</a>`;
      }
      if (o.status === 'ready' && o.plan === 'video' && o.hasVideo) {
        const videoUrl = `/media/video/${o.id}?token=${encodeURIComponent(token)}`;
        extrasHtml += `<a class="download" href="${videoUrl}" download>${t.download_video}</a>`;
      }

      results.innerHTML = `
        <div class="order">
          <div class="top">
            <div class="name">${t.for_label} ${escapeHtml(o.recipient)}</div>
            <div class="status status-${o.status}">${t.status[o.status] || o.status}</div>
          </div>
          ${o.status === 'ready' ? `
            <audio controls src="${fullUrl}"></audio>
            <div><a class="download" href="${fullUrl}" download>${t.download}</a>${extrasHtml}</div>
            ${renderMemories(o)}
          ` : ''}
        </div>
      `;

      if (o.status === 'ready') wireMemoriesEvents(o.id);
    } catch (e) {
      results.innerHTML = `<p class="empty">${t.conn_error}</p>`;
    }
  }

  // daca vine dintr-un link din email (?token=...), cautam automat, fara sa mai tasteze nimic
  const urlToken = new URLSearchParams(window.location.search).get('token');
  if (urlToken) {
    document.getElementById('token').value = urlToken;
    lookup(urlToken);
  }
</script>
</body>
</html>
