<meta charset="UTF-8">

<title>NALUNA — cântecul tău</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F5; --bg-secondary:#F8F6F2; --surface:#FDFCFA;
    --text:#2B2B2B; --text-secondary:#6B6B6B;
    --gold:#A8834B; --gold-deep:#8B6D3F; --line:#E8E2D6; --error:#B3574A;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text); font-family:'Sora', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0;
    padding:24px 0;
  }
  .logo-mark{ width:56px; margin:0 auto 24px; display:block; }
  .card{
    background:var(--bg-secondary); border:1px solid var(--line); border-radius:20px;
    padding:48px; max-width:480px; width:100%; text-align:center;
  }
  h1{ font-family:'Fraunces', serif; font-weight:400; font-size:26px; margin-bottom:12px; }
  h2{ font-family:'Fraunces', serif; font-weight:400; font-size:19px; margin:0 0 6px; }
  p{ color:var(--text-secondary); font-size:15px; margin-bottom:24px; }
  .spinner{
    width:40px; height:40px; margin:0 auto 24px;
    border:2px solid var(--line); border-top-color:var(--gold); border-radius:50%;
    animation:spin 1.1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation-duration:3s; } }
  audio{ width:100%; margin-top:12px; }
  video{ width:100%; margin-top:12px; border-radius:12px; background:#000; }
  .btn{
    display:inline-block; margin-top:10px; padding:13px 26px; border-radius:999px;
    background:var(--text); color:var(--bg); text-decoration:none; font-weight:500; font-size:14px;
    transition:background-color .25s ease; border:none; cursor:pointer; font-family:'Sora',sans-serif;
  }
  .btn:hover{ background:var(--gold-deep); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--text-secondary); border:1px solid var(--line); }
  .btn-secondary:hover{ background:var(--surface); color:var(--text); }
  .err{ color:var(--error); }

  .plan-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--gold); border-radius:999px; padding:7px 16px; margin-bottom:16px;
    font-size:13px; font-weight:600; color:var(--gold-deep);
  }

  .memories{ margin-top:28px; padding-top:28px; border-top:1px solid var(--line); text-align:left; }
  .memories-sub{ font-size:13px; margin-bottom:16px; }
  .memories-hint{ font-size:12px; color:var(--text-secondary); margin:8px 0 16px; }
  .mem-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .mem-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font-size:13px;
  }
  .mem-item .mem-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .mem-info{ flex:1; min-width:0; }
  .mem-item .mem-meta{ font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .mem-item .mem-meta.err{ color:var(--error); }
  .mem-progress-track{ background:var(--line); border-radius:999px; height:4px; overflow:hidden; margin-top:5px; }
  .mem-progress-fill{ background:var(--gold); height:100%; border-radius:999px; transition:width .2s ease; }
  .mem-item select{
    font-family:'Sora',sans-serif; font-size:12px; border:1px solid var(--line); border-radius:6px;
    padding:4px 6px; background:var(--bg); color:var(--text);
  }
  .mem-page-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .mem-actions{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .mem-actions button{
    background:none; border:none; cursor:pointer; line-height:1; padding:4px 6px;
    color:var(--text-secondary); font-size:14px; border-radius:6px;
  }
  .mem-actions button:hover{ background:rgba(43,43,43,.06); }
  .mem-actions button:disabled{ opacity:.35; cursor:default; }
  .mem-actions .mem-remove{ color:var(--error); font-size:16px; }
  .mem-actions .mem-retry{ color:var(--gold-deep); font-size:12px; font-weight:600; }
  #mem-file-input{
    display:block; width:100%; font-size:13px; margin-bottom:12px;
    font-family:'Sora',sans-serif; color:var(--text-secondary);
  }
  .mem-batch-status{ font-size:12px; font-weight:600; color:var(--gold-deep); margin:2px 0 10px; min-height:15px; }
  .mem-status{ font-size:13px; margin-top:10px; }
  .mem-picker-retry-btn{
    background:none; border:none; padding:0; margin-left:4px; color:var(--gold-deep);
    font-size:13px; font-weight:600; text-decoration:underline; cursor:pointer;
    font-family:'Sora',sans-serif;
  }
  /* CERINTA 5 (2026-08-31, "un singur loader mare pentru incarcarea media") — replica exacta a
     loaderului agregat din amintiri-video.html, STRICT portocaliu (cerinta explicita de culoare),
     fara sa redefineasca paleta gold/gold-deep existenta a restului paginii. */
  .mem-batch-loader{ display:none; flex-direction:column; align-items:center; text-align:center; margin:18px 0 22px; }
  .mem-batch-loader-ring{
    width:64px; height:64px; border-radius:50%; margin-bottom:14px;
    border:6px solid var(--line); border-top-color:#F5A623; box-sizing:border-box;
  }
  @media (prefers-reduced-motion: no-preference){
    .mem-batch-loader-ring{ animation:mem-loader-spin 1s linear infinite; }
  }
  @keyframes mem-loader-spin{ to{ transform:rotate(360deg); } }
  .mem-batch-loader-pct{ font-family:'Fraunces',serif; font-size:32px; font-weight:600; color:#C97F14; margin:0 0 6px; }
  .upload-overall-track{
    background:var(--line); border-radius:999px; height:14px; overflow:hidden; margin:6px 0 14px;
    width:100%; max-width:360px;
  }
  .upload-overall-fill{ background:#F5A623; height:100%; border-radius:999px; transition:width .3s ease; width:0%; }
  @media (prefers-reduced-motion: reduce){
    .upload-overall-fill{ transition:none; }
  }
  .mem-batch-loader .mem-batch-status{ font-size:14px; margin:0 0 4px; }
  .mem-batch-loader-note{ font-size:12px; color:var(--text-secondary); margin:0; }
  .mem-batch-loader.has-errors .mem-batch-loader-ring{ border-top-color:var(--error); animation:none; }
  .mem-batch-loader.has-errors .mem-batch-loader-fill{ background:var(--error); }
  /* CERINTA 4 (2026-08-31, fallback "Colectii" iPhone) — panou de recuperare, afisat STRICT dupa
     un cancel/revenire fara fisiere de la selectorul nativ (niciodata preemptiv). */
  .mem-recovery{
    display:none; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin:14px 0; text-align:left;
  }
  .mem-recovery p{ font-size:13px; color:var(--text-secondary); margin:0 0 8px; }
  .mem-recovery p:last-of-type{ margin-bottom:12px; }
  .mem-recovery-fallback-input{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .btn-pick-files-fallback{
    display:flex; align-items:center; justify-content:center; text-align:center;
    width:100%; min-height:48px; box-sizing:border-box; padding:12px 20px; font-size:14px;
    font-weight:700; border-radius:12px; background:transparent; color:#C97F14;
    border:2px solid #F5A623; cursor:pointer;
  }
  .btn-pick-files-fallback:focus-visible{ outline:3px solid #C97F14; outline-offset:2px; }
</style>

    // cu timeout si buton de reincercare clar — niciodata un player blocat fara explicatie.
    function mountMedia(wrapEl, url, tagName) {
      if (!wrapEl) return;
      wrapEl.innerHTML = '';
      const el = document.createElement(tagName);
      el.controls = true;
      el.preload = 'metadata';
      if (tagName === 'video') el.playsInline = true;

      let settled = false;

      function showError() {
        clearTimeout(loadTimeout);
        wrapEl.innerHTML = `<p class="media-error" style="color:var(--error); font-size:13px; cursor:pointer; text-decoration:underline; margin:8px 0;">${t.media_load_error}</p>`;
        wrapEl.querySelector('.media-error').addEventListener('click', () => mountMedia(wrapEl, url, tagName));
      }

      el.addEventListener('loadedmetadata', () => { settled = true; clearTimeout(loadTimeout); });
      el.addEventListener('error', () => { if (!settled) { settled = true; showError(); } });

      wrapEl.appendChild(el);
      el.src = url;

               valid, confirmat exact asa in productie. -->
          <input type="file" id="mem-file-input" multiple accept="image/*,video/*">
          <p class="memories-hint">${t.memories_hint}</p>
          <!-- CERINTA 4 (2026-08-31): panou de recuperare, afisat STRICT dupa un cancel/revenire
               fara fisiere din selectorul nativ (showRecoveryUI(), niciodata preemptiv). -->
          <div class="mem-recovery" id="mem-recovery" role="region" aria-live="polite">
            <p id="mem-recovery-title" style="font-weight:700; color:var(--text);">${t.memories_recovery_title}</p>
            <p id="mem-recovery-safari" style="display:none;">${t.memories_recovery_safari}</p>
            <p id="mem-recovery-check">${t.memories_recovery_check}</p>
            <p id="mem-recovery-icloud">${t.memories_recovery_icloud}</p>
            <input type="file" id="mem-file-input-fallback" class="mem-recovery-fallback-input" multiple aria-label="${t.memories_pick_files_fallback_btn}">
            <label class="btn-pick-files-fallback" for="mem-file-input-fallback" id="mem-pick-fallback-label"><span id="mem-pick-fallback-label-text">${t.memories_pick_files_fallback_btn}</span></label>
          </div>
          <div class="mem-page-actions">
            <button type="button" class="btn ${(data.uploadedMedia || []).length > 0 ? '' : 'btn-secondary'}" id="mem-create-btn">${(data.uploadedMedia || []).length > 0 ? t.memories_create_btn : t.memories_create_btn_skip}</button>
          </div>
          <p class="mem-status" id="mem-status"></p>
        </div>
      `;
    }

    // Extras intr-o functie separata (RELANSARE, "nu reincarca toata comanda dupa fiecare
    // fisier") — randata atat la afisarea initiala CAT si de refreshOrderMediaOnly(), fara sa
    // mai fie nevoie de renderReadyCard() (rebuild complet al cardului) doar pentru atat.
    function renderExistingMediaList(data) {
      const el = document.getElementById('mem-uploaded-list');
      if (!el) return;
      const uploaded = data.uploadedMedia || [];
      el.innerHTML = uploaded.map((m, i) => `
        <div class="mem-item">
          <span class="mem-name">${m.type === 'photo' ? '🖼️' : '🎬'}</span>
          <button type="button" class="mem-remove" data-remove-index="${i}" title="${t.memories_remove}">${t.memories_remove}</button>
        </div>
      `).join('');
      el.querySelectorAll('button[data-remove-index]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await fetch(`/api/orders/${orderId}/media/${btn.dataset.removeIndex}`, {
              method: 'DELETE',
              headers: { 'X-Access-Token': accessToken || '' }
            });
            await refreshOrderMediaOnly();
          } catch (e) {
            btn.disabled = false;
          }
        });
      });
      const createBtn = document.getElementById('mem-create-btn');
      if (createBtn) {
        createBtn.className = 'btn ' + (uploaded.length > 0 ? '' : 'btn-secondary');
        createBtn.textContent = uploaded.length > 0 ? t.memories_create_btn : t.memories_create_btn_skip;
      }
    }

    // Sincronizare USOARA — reia STRICT comanda (acelasi fetchOrder() folosit deja de
    // refreshCard()), dar NU mai reconstruieste tot cardul (renderReadyCard rebuild-uieste
    // playerul audio/video, badge-ul de pachet etc.) — doar lista de materiale existente.
    async function refreshOrderMediaOnly() {
      try {
        const data = await fetchOrder();
        if (memDataRef) memDataRef.uploadedMedia = data.uploadedMedia;
        renderExistingMediaList(memDataRef || data);
        updateMemActionGates();
      } catch (e) { /* urmatoarea sincronizare va corecta */ }
    }

    // ==========================================================================================
    // RELANSARE 2026-08-14 ("cardurile apar greu/inegal, unele goale, interfata raspunde greu"):
    // vezi comentariul identic, mai detaliat, din melodia-mea.html/comanda-mea.html. Randare
    // COMPLETA doar la schimbari structurale; progresul foloseste patch direct, throttled.
    // ==========================================================================================
    // CERINTA 5 (2026-08-31, "un singur loader mare"): randul static NU mai afiseaza bara/procent
    // individual — progresul e reprezentat STRICT de loaderul agregat unic.
    function renderQueueRowInner(q) {
      return `
        <div class="mem-info">
          <span class="mem-name">${isVideoFile(q.file) ? '🎬' : '🖼️'} ${escapeHtml(q.file.name)}</span>
          <span class="mem-meta ${q.status === 'error' ? 'err' : ''}">${
            q.status === 'uploading' ? t.memories_uploading_pct(q.progress)
            : q.status === 'processing' ? t.memories_processing
            : q.status === 'pending' ? t.memories_queued
            : q.status === 'error' ? (q.errorMsg || t.memories_upload_error)
            : t.memories_uploaded
          }</span>
        </div>
        <div class="mem-actions">
          ${q.status === 'error' ? `<button type="button" class="mem-retry" data-retry-id="${q.localId}">${t.memories_retry}</button>` : ''}
          <button type="button" class="mem-remove" data-queue-remove="${q.localId}" title="${t.memories_remove}" ${(q.status === 'uploading' || q.status === 'processing') ? 'disabled' : ''}>${t.memories_remove}</button>
        </div>
      `;
    }

    function wireQueueRow(row, entry) {
      const retryBtn = row.querySelector('[data-retry-id]');
      if (retryBtn) retryBtn.addEventListener('click', () => {
        entry.status = 'pending';
        entry.errorMsg = null;
        renderQueueRow(entry);
        processUploadQueue();
      });
      const removeBtn = row.querySelector('[data-queue-remove]');
      if (removeBtn) removeBtn.addEventListener('click', () => {
        const idx = uploadQueue.findIndex(q => q.localId === entry.localId);
        if (idx === -1) return;
        entry.abortRequested = true;
        if (entry.xhr) entry.xhr.abort();
        if (entry.activePartXhrs) Object.values(entry.activePartXhrs).forEach(xhr => { try { xhr.abort(); } catch (e) {} });
        if (entry.multipartSessionId) {
          fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}`, {
            method: 'DELETE', headers: { 'X-Access-Token': accessToken || '' }
          }).catch(() => {});
        }
        uploadQueue.splice(idx, 1);
        processUploadQueue();
        renderQueueList();
      });
    }

    function renderQueueList() {
      const el = document.getElementById('mem-staged-list');
      if (!el) return;
      el.innerHTML = uploadQueue.map(q => `<div class="mem-item" data-queue-id="${q.localId}">${renderQueueRowInner(q)}</div>`).join('');
      el.querySelectorAll('[data-queue-id]').forEach(row => {
        const entry = uploadQueue.find(q => q.localId === row.dataset.queueId);
        if (entry) wireQueueRow(row, entry);
      });
      renderBatchStatus();
      updateMemActionGates();
    }

    function renderQueueRow(entry) {
      const row = document.querySelector(`#mem-staged-list [data-queue-id="${entry.localId}"]`);
      if (!row) { renderQueueList(); return; }
      row.innerHTML = renderQueueRowInner(entry);
      wireQueueRow(row, entry);
      renderBatchStatus();
      updateMemActionGates();
    }

    function patchQueueRowProgress(entry) {
      const row = document.querySelector(`#mem-staged-list [data-queue-id="${entry.localId}"]`);
      if (!row) return;
      const meta = row.querySelector('.mem-meta');
      if (!meta) { renderQueueRow(entry); return; }
      meta.textContent = entry.status === 'processing' ? t.memories_processing : t.memories_uploading_pct(entry.progress);
      meta.classList.remove('err');
    }

    let progressRafScheduled = false;
    const pendingProgressIds = new Set();
    function scheduleProgressUpdate(entry) {
      pendingProgressIds.add(entry.localId);
      if (progressRafScheduled) return;
      progressRafScheduled = true;
      requestAnimationFrame(() => {
        progressRafScheduled = false;
        const ids = Array.from(pendingProgressIds);
        pendingProgressIds.clear();
        ids.forEach(id => {
          const e = uploadQueue.find(q => q.localId === id);
          if (e) patchQueueRowProgress(e);
        });
        renderBatchStatus();
      });
    }

    let memBatchTotal = 0;
    let memBatchDoneCount = 0;
    // CERINTA 5 (2026-08-31): progres agregat ponderat STRICT dupa octeti REALI.
    let memBatchTotalBytes = 0;
    let memBatchBytesDone = 0;
    function setLoaderProgressAttrs(pct) {
      const track = document.getElementById('upload-overall-track');
      if (track) track.setAttribute('aria-valuenow', String(pct));
      const pctEl = document.getElementById('mem-batch-loader-pct');
      if (pctEl) pctEl.textContent = pct + '%';
    }
    function renderBatchStatus() {
      const el = document.getElementById('mem-batch-status');
      if (!el) return;
      const loaderWrap = document.getElementById('mem-batch-loader');
      const overallFill = document.getElementById('upload-overall-fill');
      const noteEl = document.getElementById('mem-batch-loader-note');
      const hasQueueItems = uploadQueue.length > 0;
      if (loaderWrap) loaderWrap.style.display = (memBatchTotal > 0 && hasQueueItems) ? 'flex' : 'none';
      if (noteEl) noteEl.textContent = t.memories_dont_close;
      if (memBatchTotal === 0 || !hasQueueItems) {
        if (!hasQueueItems && memBatchTotal > 0) {
          el.textContent = memBatchDoneCount > 0 ? t.memories_batch_done(memBatchDoneCount) : '';
        } else {
          el.textContent = '';
        }
        if (overallFill) overallFill.style.width = '0%';
        if (loaderWrap) loaderWrap.classList.remove('has-errors');
        setLoaderProgressAttrs(0);
        return;
      }
      const errorEntries = uploadQueue.filter(q => q.status === 'error');
      const activeEntries = uploadQueue.filter(q => q.status !== 'error');
      const inFlightBytes = activeEntries.reduce((sum, q) => {
        if (q.status === 'processing') return sum + q.file.size;
        if (q.status === 'uploading') return sum + q.file.size * (Math.min(100, q.progress || 0) / 100);
        return sum;
      }, 0);
      const doneBytes = memBatchBytesDone + inFlightBytes;
      const overallPct = memBatchTotalBytes > 0 ? Math.min(100, Math.round((doneBytes / memBatchTotalBytes) * 100)) : 0;

      if (activeEntries.length === 0) {
        if (errorEntries.length > 0) {
          el.textContent = t.memories_batch_errors(memBatchDoneCount, memBatchTotal, errorEntries.length);
          if (loaderWrap) loaderWrap.classList.add('has-errors');
          if (overallFill) overallFill.style.width = overallPct + '%';
          setLoaderProgressAttrs(overallPct);
        } else {
          el.textContent = memBatchDoneCount > 0 ? t.memories_batch_done(memBatchDoneCount) : '';
          if (loaderWrap) loaderWrap.classList.remove('has-errors');
          if (overallFill) overallFill.style.width = '100%';
          setLoaderProgressAttrs(100);
        }
        return;
      }
      if (loaderWrap) loaderWrap.classList.toggle('has-errors', errorEntries.length > 0);
      el.textContent = errorEntries.length > 0
        ? t.memories_batch_errors(memBatchDoneCount, memBatchTotal, errorEntries.length)
        : t.memories_batch_progress(memBatchDoneCount, memBatchTotal, overallPct);
      if (overallFill) overallFill.style.width = overallPct + '%';
      setLoaderProgressAttrs(overallPct);
    }

    let memSyncTimer = null;
    let memSyncInFlight = false;
    let memSyncAgainNeeded = false;
    function scheduleMemSync() {
      memSyncAgainNeeded = true;
      if (memSyncTimer || memSyncInFlight) return;
      memSyncTimer = setTimeout(runMemSync, 700);
    }
    async function runMemSync() {
      memSyncTimer = null;
      if (memSyncInFlight || !memSyncAgainNeeded) return;
      memSyncAgainNeeded = false;
      memSyncInFlight = true;
      try {
        await refreshOrderMediaOnly();
      } finally {
        memSyncInFlight = false;
        if (memSyncAgainNeeded) memSyncTimer = setTimeout(runMemSync, 700);
      }
    }

    const MEM_MAX_CONCURRENT_UPLOADS = 2;
    const MEM_UPLOAD_TIMEOUT_MS = 900000;
    const MEM_MULTIPART_THRESHOLD_BYTES = 20 * 1024 * 1024;
    const MEM_PART_RETRY_LIMIT = 5;
    const MEM_MAX_PARALLEL_PARTS = 2;

    function processUploadQueue() {
      const active = uploadQueue.filter(q => q.status === 'uploading' || q.status === 'processing').length;
      let slots = MEM_MAX_CONCURRENT_UPLOADS - active;
      if (slots <= 0) return;
      for (const entry of uploadQueue) {
        if (slots <= 0) break;
        if (entry.status === 'pending') {
          startUpload(entry);
          slots--;
        }
      }
    }

    function startUpload(entry) {
      entry.abortRequested = false;
      if (isVideoFile(entry.file) && entry.file.size > MEM_MULTIPART_THRESHOLD_BYTES) {
        startMultipartUpload(entry);
      } else {
        startSingleUpload(entry);
      }
    }

    function startSingleUpload(entry) {
      entry.status = 'uploading';
      entry.progress = 0;
      entry.errorMsg = null;
      renderQueueRow(entry);

      const formData = new FormData();
      formData.append('media', entry.file);
      formData.append('sections', JSON.stringify(['']));

      const xhr = new XMLHttpRequest();
      entry.xhr = xhr;
      xhr.open('POST', `/api/orders/${orderId}/media`);
      xhr.setRequestHeader('X-Access-Token', accessToken || '');
      xhr.timeout = MEM_UPLOAD_TIMEOUT_MS;
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          entry.progress = pct;
          if (pct >= 100 && entry.status === 'uploading') entry.status = 'processing';
          scheduleProgressUpdate(entry);
        }
      };
      xhr.onload = () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { /* raspuns invalid */ }
        const failedEntry = data && Array.isArray(data.failed) ? data.failed[0] : null;
        const succeeded = data && Array.isArray(data.uploaded) && data.uploaded.length > 0;
        memLog('upload_response', { status: xhr.status, receivedOk: !!succeeded });
        if (xhr.status >= 200 && xhr.status < 300 && succeeded) {
          uploadQueue = uploadQueue.filter(q => q.localId !== entry.localId);
          memBatchDoneCount++;
          memBatchBytesDone += entry.file.size;
          renderQueueList();
          processUploadQueue();
          scheduleMemSync();
        } else {
          entry.status = 'error';
          entry.errorMsg = (failedEntry && failedEntry.reason) || (data && data.error) || t.memories_upload_error;
          renderQueueRow(entry);
          processUploadQueue();
        }
      };
      xhr.onerror = () => {
        entry.status = 'error';
        entry.errorMsg = t.memories_upload_error;
        renderQueueRow(entry);
        processUploadQueue();
      };
      xhr.ontimeout = () => {
        entry.status = 'error';
        entry.errorMsg = t.memories_upload_timeout;
        renderQueueRow(entry);
        processUploadQueue();
      };
      xhr.onabort = () => { processUploadQueue(); };
      xhr.send(formData);
    }

    // Upload MULTIPART DIRECT DIN BROWSER CATRE R2 — vezi comentariul identic, mai detaliat, din
    // melodia-mea.html si din server.js. Rezervat videoclipurilor mari. Fragmentele NU mai trec
    // prin acest server — Railway autorizeaza si intoarce cate un URL semnat per fragment.
    // Cale de rezerva, independenta de CORS — vezi comentariul detaliat de la
    // storage.getMultipartPartETag in server.js. Apelata STRICT dupa un PUT reusit (2xx) fara
    // ETag citibil in raspuns (CORS-ul bucket-ului nu expune header-ul ETag pentru aceasta origine).
    async function fetchPartEtagFallback(sessionId, partNumber) {
      const res = await fetch(`/api/orders/${orderId}/media/multipart/${sessionId}/part-etag?partNumber=${partNumber}`, {
        headers: { 'X-Access-Token': accessToken || '' }
      });
      if (!res.ok) return null;
      const data = await res.json().catch(() => ({}));
      return data.etag || null;
    }

    function uploadOnePart(entry, partNumber, blob, onProgress) {
      return new Promise((resolve, reject) => {
        let attempt = 0;
        const tryOnce = async () => {
          if (entry.abortRequested) { reject(new Error('aborted')); return; }
          try {
            const urlRes = await fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}/part-url`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken || '' },
              body: JSON.stringify({ partNumber })
            });
            const urlData = await urlRes.json().catch(() => ({}));
            if (!urlRes.ok || !urlData.url) { retryOrFail(); return; }
            const xhr = new XMLHttpRequest();
            entry.activePartXhrs = entry.activePartXhrs || {};
            entry.activePartXhrs[partNumber] = xhr;
            xhr.open('PUT', urlData.url);
            xhr.timeout = MEM_UPLOAD_TIMEOUT_MS;
            xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded); };
            xhr.onload = () => {
              delete entry.activePartXhrs[partNumber];
              if (xhr.status >= 200 && xhr.status < 300) {
                const etag = xhr.getResponseHeader('ETag');
                if (etag) { onProgress(blob.size); resolve(etag); return; }
                // PUT-ul chiar a reusit la R2 — ETag lipsa in raspuns e cel mai probabil un CORS
                // care nu expune acel header, nu o eroare tranzitorie. Intrebam serverul, care
                // are acces R2 direct, neafectat de CORS.
                fetchPartEtagFallback(entry.multipartSessionId, partNumber).then((fallbackEtag) => {
                  if (fallbackEtag) { onProgress(blob.size); resolve(fallbackEtag); }
                  else { retryOrFail(); }
                }).catch(() => { retryOrFail(); });
              } else { retryOrFail(); }
            };
            xhr.onerror = () => { delete entry.activePartXhrs[partNumber]; retryOrFail(); };
            xhr.ontimeout = () => { delete entry.activePartXhrs[partNumber]; retryOrFail(); };
            xhr.onabort = () => { delete entry.activePartXhrs[partNumber]; reject(new Error('aborted')); };
            xhr.send(blob);
          } catch (err) {
            retryOrFail();
          }
        };
        const retryOrFail = () => {
          attempt++;
          if (entry.abortRequested) { reject(new Error('aborted')); return; }
          if (attempt > MEM_PART_RETRY_LIMIT) { reject(new Error('part failed')); return; }
          onProgress(0);
          setTimeout(tryOnce, Math.min(1000 * attempt, 5000));
        };
        tryOnce();
      });
    }

    async function startMultipartUpload(entry) {
      entry.status = 'uploading';
      entry.progress = 0;
      entry.errorMsg = null;
      renderQueueRow(entry);
      try {
        const initRes = await fetch(`/api/orders/${orderId}/media/multipart/init`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken || '' },
          body: JSON.stringify({ filename: entry.file.name, size: entry.file.size, mimeType: entry.file.type || '', section: '' })
        });
        const initData = await initRes.json().catch(() => ({}));
        if (!initRes.ok || !initData.sessionId) throw new Error(initData.error || 'init failed');
        entry.multipartSessionId = initData.sessionId;
        const partSize = initData.partSize || (10 * 1024 * 1024);
        const totalBytes = entry.file.size;
        const totalParts = Math.max(1, Math.ceil(totalBytes / partSize));

        const partBytesSent = new Array(totalParts + 1).fill(0);
        function reportProgress() {
          const sum = partBytesSent.reduce((a, b) => a + b, 0);
          entry.progress = Math.min(99, Math.round((sum / totalBytes) * 100));
          scheduleProgressUpdate(entry);
        }

        const completedParts = await new Promise((resolveAll, rejectAll) => {
          const results = [];
          let nextPartNumber = 1;
          let active = 0;
          let firstError = null;
          function pump() {
            if (firstError) { rejectAll(firstError); return; }
            if (results.length === totalParts) { resolveAll(results); return; }
            while (active < MEM_MAX_PARALLEL_PARTS && nextPartNumber <= totalParts) {
              const partNumber = nextPartNumber++;
              const start = (partNumber - 1) * partSize;
              const end = Math.min(start + partSize, totalBytes);
              const blob = entry.file.slice(start, end);
              active++;
              uploadOnePart(entry, partNumber, blob, (loaded) => { partBytesSent[partNumber] = loaded; reportProgress(); })
                .then(etag => { active--; results.push({ partNumber, etag }); pump(); })
                .catch(err => { active--; firstError = firstError || err; pump(); });
            }
          }
          pump();
        });

        if (entry.abortRequested) return;
        entry.status = 'processing';
        scheduleProgressUpdate(entry);
        completedParts.sort((a, b) => a.partNumber - b.partNumber);
        const completeRes = await fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken || '' },
          body: JSON.stringify({ parts: completedParts })
        });
        const data = await completeRes.json().catch(() => ({}));
        const succeeded = data && Array.isArray(data.uploaded) && data.uploaded.length > 0;
        if (completeRes.ok && succeeded) {
          uploadQueue = uploadQueue.filter(q => q.localId !== entry.localId);
          memBatchDoneCount++;
          memBatchBytesDone += entry.file.size;
          renderQueueList();
          processUploadQueue();
          scheduleMemSync();
        } else {
          const failedEntry = data && Array.isArray(data.failed) ? data.failed[0] : null;
          entry.status = 'error';
          entry.errorMsg = (failedEntry && failedEntry.reason) || (data && data.error) || t.memories_upload_error;
          renderQueueRow(entry);
          processUploadQueue();
        }
      } catch (err) {
        if (entry.abortRequested) return;
        entry.status = 'error';
        entry.errorMsg = t.memories_upload_error;
        renderQueueRow(entry);
        processUploadQueue();
      }
    }

    function updateMemActionGates() {
      const createBtn = document.getElementById('mem-create-btn');
      if (!createBtn) return;
      const busy = uploadQueue.some(q => q.status === 'uploading' || q.status === 'pending' || q.status === 'processing');
      createBtn.disabled = busy;
    }

    function wireMemoriesEvents() {
      const fileInput = document.getElementById('mem-file-input');
      const fileInputFallback = document.getElementById('mem-file-input-fallback');
      const createBtn = document.getElementById('mem-create-btn');
      const statusEl = document.getElementById('mem-status');
      if (!fileInput) return;

      renderExistingMediaList(memDataRef);
      renderQueueList();
      updateMemActionGates();

      // CERINTA 4 (2026-08-31, fallback "Colectii" iPhone) — panou de recuperare, afisat STRICT
      // dupa un cancel/revenire fara fisiere din selectorul nativ (niciodata preemptiv).
      const memRecoveryEl = document.getElementById('mem-recovery');
      function showRecoveryUI() {
        if (!memRecoveryEl) return;
        const safariHint = document.getElementById('mem-recovery-safari');
        if (safariHint) safariHint.style.display = memIsInAppBrowser ? 'block' : 'none';
        memRecoveryEl.style.display = 'block';
        memLog('recovery_shown', { ios: memIsIOS, inAppBrowser: memIsInAppBrowser });
      }
      function hideRecoveryUI() {
        if (memRecoveryEl) memRecoveryEl.style.display = 'none';
      }

      // CERINTA 5 (2026-08-31): functia comuna de "am primit fisiere" — apelata de AMBELE
      // inputuri (Photos normal SI fallback-ul "Alege din Fișiere").
      function handleFilesReceived(files) {
        hideRecoveryUI();
        memBatchTotal += files.length;
        memBatchTotalBytes += files.reduce((s, f) => s + (f.size || 0), 0);
        files.forEach(file => {
          try {
            uploadQueue.push({
              localId: 'q' + Math.random().toString(36).slice(2),
              file,
              status: 'pending',
              progress: 0,
              errorMsg: null,
              thumbUrl: null,
              xhr: null,
              multipartSessionId: null,
              abortRequested: false
            });
          } catch (err) {
            uploadQueue.push({
              localId: 'q' + Math.random().toString(36).slice(2),
              file,
              status: 'error',
              progress: 0,
              errorMsg: t.memories_upload_error,
              thumbUrl: null,
              xhr: null,
              multipartSessionId: null,
              abortRequested: false
            });
          }
        });
        memLog('staged', { queueLength: uploadQueue.length });
        renderQueueList();
        processUploadQueue();
      }

      // CORECȚIE (2026-08-24, "selectorul ramane blocat pana la 5 minute pe iPhone daca Safari
      // nu emite 'cancel'") — vezi comentariul identic, mai detaliat, din comanda-mea.html:
      // 'change'/'cancel' raman sursa AUTORITATIVA de deblocare (neschimbat). Adaugat: revenirea
      // in pagina (visibilitychange/focus/pageshow) declanseaza acum, dupa o scurta fereastra de
      // gratie, o afordanta VIZIBILA cu buton explicit "Renunță și încearcă din nou" — inainte,
      // acest caz doar consemna intern (memLog). Plafonul orb a fost redus de la 5 minute la 90s.
      let pickerLocked = false;
      let pickerLockedAt = 0;
      const PICKER_MANUAL_RECOVERY_MS = 90 * 1000;
      const PICKER_RETURN_GRACE_MS = 1500;
      let pickerAwaitingChange = false;
      let pickerOpenToken = 0;
      let pickerReturnGraceTimer = null;
      let pickerWaitingMessageShown = false;
      function clearPickerWaitingMessage() {
        pickerWaitingMessageShown = false;
        if (pickerReturnGraceTimer) { clearTimeout(pickerReturnGraceTimer); pickerReturnGraceTimer = null; }
      }
      function showPickerWaitingMessage() {
        if (!pickerAwaitingChange || pickerWaitingMessageShown) return;
        pickerWaitingMessageShown = true;
        statusEl.innerHTML = `${escapeHtml(t.memories_picker_waiting)} <button type="button" id="mem-picker-retry-btn" class="mem-picker-retry-btn"></button>`;
        statusEl.classList.remove('err');
        const retryBtn = document.getElementById('mem-picker-retry-btn');
        retryBtn.textContent = t.memories_picker_retry;
        retryBtn.addEventListener('click', () => {
          pickerLocked = false;
          pickerAwaitingChange = false;
          clearPickerWaitingMessage();
          statusEl.textContent = '';
          statusEl.classList.remove('err');
        });
      }
      fileInput.addEventListener('click', (e) => {
        if (pickerLocked) {
          if (Date.now() - pickerLockedAt < PICKER_MANUAL_RECOVERY_MS) { e.preventDefault(); return; }
          memLog('picker_manual_recovery', { elapsedMs: Date.now() - pickerLockedAt });
        }
        pickerLocked = true;
        pickerLockedAt = Date.now();
        pickerAwaitingChange = true;
        pickerOpenToken++;
        clearPickerWaitingMessage();
        statusEl.textContent = '';
        statusEl.classList.remove('err');
        memUploadAttemptId = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        memLog('picker_open', { ios: memIsIOS, inAppBrowser: memIsInAppBrowser });
      });
      fileInput.addEventListener('cancel', () => {
        pickerLocked = false;
        pickerAwaitingChange = false;
        clearPickerWaitingMessage();
        statusEl.textContent = '';
        statusEl.classList.remove('err');
        memLog('picker_cancel', {});
        showRecoveryUI();
      });
      // Daca revenim in pagina si inca asteptam 'change' (iPhone inca pregateste materialul),
      // NU deblocam nimic automat — dupa o scurta fereastra de gratie, aratam afordanta
      // explicita de mai sus. Daca 'change' a sosit deja, pickerAwaitingChange e deja fals.
      function checkPickerDelivery() {
        if (!pickerAwaitingChange) return;
        memLog('picker_still_awaiting_after_focus_return', { ios: memIsIOS });
        if (!pickerReturnGraceTimer) {
          pickerReturnGraceTimer = setTimeout(() => { pickerReturnGraceTimer = null; showPickerWaitingMessage(); }, PICKER_RETURN_GRACE_MS);
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkPickerDelivery();
      });
      window.addEventListener('focus', checkPickerDelivery);
      window.addEventListener('pageshow', (event) => { if (event.persisted) checkPickerDelivery(); });

      let memStatusHintToken = 0;

      fileInput.addEventListener('change', () => {
        pickerLocked = false;
        pickerAwaitingChange = false;
        const files = Array.from(fileInput.files);
        fileInput.value = '';
        memLog('change', {
          filesLength: files.length,
          items: files.map(f => ({ type: (f.type || '').split('/')[0] || 'unknown', sizeMb: Math.round((f.size || 0) / 1024 / 1024) }))
        });
        if (files.length === 0) {
          statusEl.textContent = t.memories_no_files_selected;
          statusEl.classList.add('err');
          // CERINTA 4: revenire din selector FARA niciun fisier — al doilea moment declansator
          // al panoului de recuperare (pe langa 'cancel' de mai sus).
          showRecoveryUI();
          return;
        }
        statusEl.textContent = t.memories_auto_upload_hint;
        statusEl.classList.remove('err');
        const hintToken = ++memStatusHintToken;
        setTimeout(() => { if (memStatusHintToken === hintToken) statusEl.textContent = ''; }, 4000);

        handleFilesReceived(files);
      });

      // CERINTA 4 (2026-08-31) — al doilea input STATIC, FARA accept, folosit STRICT din panoul
      // de recuperare ("Alege din Fișiere"). Aceleasi reguli sigure ca inputul principal.
      if (fileInputFallback) {
        fileInputFallback.addEventListener('cancel', () => { memLog('fallback_picker_cancel', {}); });
        fileInputFallback.addEventListener('change', () => {
          const files = Array.from(fileInputFallback.files);
          fileInputFallback.value = '';
          memLog('fallback_change', { filesLength: files.length });
          if (files.length === 0) return;
          handleFilesReceived(files);
        });
      }

      createBtn.addEventListener('click', async () => {
        createBtn.disabled = true;
        statusEl.textContent = t.memories_creating;
        statusEl.classList.remove('err');
        try {
          const res = await fetch(`/api/orders/${orderId}/create-video`, {
            method: 'POST',
            headers: { 'X-Access-Token': accessToken || '' }
          });
          if (!res.ok && res.status !== 409) throw new Error('create failed');
          setTimeout(checkStatus, 8000);
        } catch (e) {
          statusEl.textContent = t.memories_create_error;
          statusEl.classList.add('err');
          createBtn.disabled = false;
        }
      });
    }

    async function refreshCard() {
      const data = await fetchOrder();
      if (data.status === 'ready') renderReadyCard(data);
    }

    async function fetchOrder() {
      const res = await fetch(`/api/orders/${orderId}?token=${encodeURIComponent(accessToken || '')}`);
      return res.json();
    }

    function renderReadyCard(data) {
      localStorage.removeItem('nds_order_id');
      const fullUrl = `/media/full/${orderId}?token=${encodeURIComponent(accessToken || '')}`;
      const variant = (data.variants || []).find(v => v.id === data.selectedVariantId) || {};

      // "Melodia cadou" (cealalta varianta, nealeasa ca principala) — livrata la Premium (doua
      // melodii complete, in doua genuri diferite) SI, dupa CORECȚIA 2026-08-30 (Cerinta 7), la
      // Video — DOAR daca exista o editare REALA (perechea legitima initiala+editata). Vezi
      // getGiftVariant in lib/entitlements.js (server.js) — regula REPLICATA aici identic:
      // exact 2 variante, exact una marcata real ca editare (isEditedAlternative), bonusul e
      // varianta diferita de cea selectata pentru checkout. O comanda Video FARA nicio editare
      // reala (o singura varianta, sau 2 variante nemarcate) NU primeste nicio melodie cadou —
      // la fel ca inainte de aceasta corectie.
      const giftVariant = (() => {
        const variants = data.variants || [];
        if (data.plan === 'video') {
          if (variants.length !== 2) return null;
          const editedCount = variants.filter(v => v.isEditedAlternative).length;
          if (editedCount !== 1) return null;
          return variants.find(v => v.id !== data.selectedVariantId) || null;
        }
        return variants.find(v => v.id !== data.selectedVariantId) || null;
      })();
      const giftUrl = giftVariant ? `/media/full/${orderId}/gift?token=${encodeURIComponent(accessToken || '')}` : null;
      // Cerinta 7: pentru Video, cand exista o editare REALA, etichetele devin explicit
      // "Versiunea inițială"/"Versiunea editată" (identice cu cele deja folosite in
      // melodia-mea.html) — mai clare decat genericul "Melodia din videoclip"/"Melodia cadou",
      // care nu spunea clientului CARE dintre cele doua melodii e care.
      const videoMainLabel = (data.plan === 'video' && giftVariant)
        ? (variant.isEditedAlternative ? t.variant_edited_label : t.variant_original_label)
        : t.video_song_title;
      const videoGiftLabel = (data.plan === 'video' && giftVariant && giftVariant.isEditedAlternative)
        ? t.variant_edited_label : t.variant_original_label;

      // Extrasele de pachet (WAV pentru premium/video, videoclip pentru video) se genereaza
      // ASINCRON dupa plata (vezi generatePremiumExtras in server.js) — WAV automat, dar
      // videoclipul DOAR dupa ce clientul apasa butonul din sectiunea "memories" de mai jos
      // (posibil dupa ce a incarcat poze/videoclipuri). Daca pachetul include WAV dar inca
      // nu e gata, aratam un mesaj si CONTINUAM sa reimprospatam pana apare.
      let extrasHtml = '';
      let stillWaitingForExtras = false;
      if (data.plan === 'premium' || data.plan === 'video') {
        if (variant.hasWav) {
          const wavUrl = `/media/wav/${orderId}?token=${encodeURIComponent(accessToken || '')}`;
          extrasHtml += `<br><a class="btn" href="${wavUrl}" download>${t.download_wav}</a>`;
        } else {
          stillWaitingForExtras = true;
        }
      }
      if (data.plan === 'video' && !variant.hasVideo) {
        stillWaitingForExtras = true;
      }
      if (stillWaitingForExtras) {
        extrasHtml += `<p style="margin-top:16px;">${t.extra_processing}</p>`;
      }

      const planBadgeHtml = (data.plan === 'standard' || data.plan === 'premium' || data.plan === 'video')
        ? `<div class="plan-badge">${t['plan_' + data.plan]}</div>` : '';

      // Structura ceruta explicit pentru pachetul "Cadou video" — exact 3 blocuri, in aceasta
      // ordine: 1) videoclipul (playabil, cu sunetul melodiei principale), 2) aceeasi melodie
      // principala, separat, doar audio, 3) melodia cadou (cealalta varianta, alt gen ales de
      // client), separat, doar audio. Un singur videoclip, o singura melodie principala,
      // o singura melodie cadou — niciodata un al doilea videoclip sau o a treia melodie.
      // Standard/Premium raman NESCHIMBATE (playerul principal + melodia cadou, fara video).
      // Elementele media (audio/video) sunt DOAR placeholder-uri goale aici — montate explicit
      // prin API DOM (mountMedia) DUPA ce innerHTML e asignat mai jos, niciodata interpolate
      // direct ca "<audio src=...>"/"<video src=...>" in acest string (vezi comentariul de la
      // mountMedia despre de ce).
      let resultHtml;
      let videoUrl = null;
      if (data.plan === 'video' && variant.hasVideo) {
        videoUrl = `/media/video/${orderId}?token=${encodeURIComponent(accessToken || '')}`;
        resultHtml = `
        <h2 style="margin-top:8px;">${t.video_gift_title}</h2>
        <div id="gift-video-wrap"></div>
        <a class="btn" href="${videoUrl}" download>${t.download_video}</a>

        <div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--line);">
          <h2>${videoMainLabel}</h2>
          <div id="main-audio-wrap"></div>
          <a class="btn" href="${fullUrl}" download>${t.download}</a>
        </div>

        ${giftUrl ? `
        <div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--line);">
          <h2>${videoGiftLabel}</h2>
          <div id="gift-audio-wrap"></div>
          <a class="btn" href="${giftUrl}" download>${t.gift_download}</a>
        </div>` : ''}`;
      } else {
        resultHtml = `
        <div id="main-audio-wrap"></div>
        <a class="btn" href="${fullUrl}" download>${t.download}</a>
        ${extrasHtml}
        ${giftUrl ? `
        <div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--line);">
          <h2>${t.gift_title}</h2>
          <div id="gift-audio-wrap"></div>
          <a class="btn" href="${giftUrl}" download>${t.gift_download}</a>
        </div>` : ''}`;
      }

      card.innerHTML = `
        <h1>${t.ready_title}</h1>
        ${planBadgeHtml}
        <p>${t.for_label} ${escapeHtml(data.recipient)}</p>
        ${resultHtml}
        ${renderMemories(data, variant)}
      `;

      if (videoUrl) mountMedia(document.getElementById('gift-video-wrap'), videoUrl, 'video');
      mountMedia(document.getElementById('main-audio-wrap'), fullUrl, 'audio');
      if (giftUrl) mountMedia(document.getElementById('gift-audio-wrap'), giftUrl, 'audio');

      wireMemoriesEvents();

      if (stillWaitingForExtras) setTimeout(checkStatus, 8000);
    }

    async function checkStatus() {
      try {
        const data = await fetchOrder();

        if (data.status === 'ready') {
          renderReadyCard(data);
        } else if (data.status === 'generation_failed') {
          card.innerHTML = `
            <h1 class="err">${t.error_title}</h1>
            <p>${t.error_sub}</p>
          `;
        } else {
          setTimeout(checkStatus, 5000);
        }
      } catch (e) {
        setTimeout(checkStatus, 5000);
      }
    }

    if (orderId) checkStatus();
    else card.innerHTML = `<h1 class="err">${t.not_found}</h1>`;
  </script>
</body>
</html>
