<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amintirile tale pentru videoclip — NALUNA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================================
     PAGINA SEPARATA pentru selectarea/incarcarea materialelor (2026-08-29) — cerinta explicita:
     "Pagina separata pentru selectarea si incarcarea media", exclusiv pentru pachetul Cadou
     video. Reutilizeaza EXACT variabilele si clasele CSS (:root, .card, .btn*, .memories/.mem-*)
     din public/melodia-mea.html — NICIO culoare/font/design nou, doar acelasi limbaj vizual,
     pe o pagina de sine statatoare, mai simpla (fara playerul melodiei, versuri, editare, plata).
     ========================================================================================== */
  :root{
    --bg:#FAF8F5; --bg-secondary:#F8F6F2; --surface:#FDFCFA;
    --text:#2B2B2B; --text-secondary:#6B6B6B;
    --gold:#A8834B; --gold-soft:#C9A876; --gold-deep:#8B6D3F; --line:#E8E2D6;
    --success:#5F8F6E; --error:#B3574A;
    --orange:#F5A623; --orange-deep:#C97F14; --orange-text:#3B2A16;
  }
  *{box-sizing:border-box;}
  html, body{ min-height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:'Sora', sans-serif;
    min-height:100vh; margin:0; padding:48px 20px; position:relative; overflow-x:hidden;
    line-height:1.6;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
  .ambient-wash{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 18% 20%, rgba(168,131,75,.08), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(168,131,75,.07), transparent 50%);
  }
  .page-wrap{ max-width:680px; margin:0 auto; position:relative; z-index:1; }
  .card{
    background:rgba(253,252,250,.68);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:26px;
    padding:48px 40px;
    box-shadow:0 24px 60px -20px rgba(139,109,63,.18), 0 2px 8px rgba(43,43,43,.05);
  }
  @media (max-width: 480px){ .card{ padding:32px 22px; } }
  .logo-mark{ width:44px; margin:0 auto 24px; display:block; opacity:.92; }
  h1.display{ font-family:'Fraunces', serif; font-weight:400; font-size:24px; text-align:center; letter-spacing:-.01em; margin-bottom:6px; }
  p.sub{ color:var(--text-secondary); font-size:14px; text-align:center; margin-bottom:26px; }
  .spinner-wrap{ position:relative; width:64px; height:64px; margin:0 auto 22px; }
  .spinner-glow{
    position:absolute; inset:-14px; border-radius:50%;
    background:radial-gradient(circle, rgba(168,131,75,.2), rgba(168,131,75,0) 70%);
    animation:glow 3.4s ease-in-out infinite;
  }
  @keyframes glow{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:1; transform:scale(1.1); } }
  .spinner{
    position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--gold); border-right-color:var(--gold-soft);
    animation:spin 2.6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 24px; border-radius:999px; font-size:14px; font-weight:500;
    border:1px solid transparent; cursor:pointer; text-decoration:none;
    transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .btn-primary{ background:var(--text); color:var(--bg); }
  .btn-primary:hover{ background:var(--gold-deep); box-shadow:0 12px 28px -10px rgba(139,109,63,.45); }
  .btn-ghost{ border-color:var(--line); color:var(--text); background:transparent; }
  .btn-ghost:hover{ border-color:var(--gold); color:var(--gold-deep); }
  .btn-cta-orange{
    width:100%; max-width:420px; min-height:56px;
    padding:14px 24px; font-size:16px; font-weight:700; border-radius:14px;
    background:var(--orange); color:var(--orange-text); border:none;
    box-shadow:0 10px 24px -8px rgba(245,166,35,.55);
  }
  .btn-cta-orange:hover{ background:var(--orange-deep); box-shadow:0 12px 28px -8px rgba(201,127,20,.55); }
  .btn-cta-orange:focus-visible{ outline:3px solid var(--orange-deep); outline-offset:2px; }
  .btn-cta-orange:disabled{ opacity:.6; box-shadow:none; }

  .back-link-row{ text-align:center; margin-bottom:18px; }
  .back-link{ font-size:13px; color:var(--text-secondary); text-decoration:none; }
  .back-link:hover{ color:var(--gold-deep); text-decoration:underline; }

  /* Explicatia PERMANENTA despre timpul de pregatire pe telefon/computer — cerinta explicita
     (2026-08-29): vizibila TOT TIMPUL inaintea selectorului, in toate limbile, niciodata doar
     un tooltip/mesaj tranzitoriu. CORECȚIE (2026-08-29, runda 3, "foloseste portocaliul
     existent al site-ului, fara titlu separat"): bordura si fundal portocalii (var(--orange)/
     var(--orange-deep)), text in var(--error) — fara titlu, chenarul incepe direct cu ℹ️, pe
     acelasi rand cu textul. Restul paginii (spatieri, stil general, uploader) neatins.*/
  .iphone-hint{
    background:rgba(245,166,35,.12);
    border:2px solid var(--orange); border-radius:14px;
    padding:14px 16px; margin-bottom:16px; line-height:1.55;
    box-shadow:0 2px 10px -4px rgba(201,127,20,.28);
  }
  .iphone-hint-text{ margin:0; font-size:13px; color:var(--error); }

  .memories{ margin:0 0 22px; padding:20px; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
  .memories h2{ font-family:'Fraunces', serif; font-weight:400; font-size:17px; margin:0 0 6px; }
  .memories-sub{ font-size:13px; color:var(--text-secondary); margin-bottom:14px; }
  .memories-meta{ font-size:12px; color:var(--text-secondary); margin:0 0 14px; line-height:1.6; }
  .memories-count{ font-size:12px; font-weight:600; margin-bottom:10px; }
  .mem-batch-status{ font-size:12px; font-weight:600; color:var(--gold-deep); margin:2px 0 10px; min-height:15px; }
  .memories-count.ok{ color:var(--success); }
  .memories-count.warn{ color:var(--gold-deep); }
  .mem-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .mem-item{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-secondary); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font-size:13px; cursor:grab;
  }
  .mem-item.dragging{ opacity:.4; }
  .mem-item.drag-over{ border-color:var(--gold); }
  .mem-thumb{
    flex-shrink:0; width:44px; height:44px; border-radius:8px; overflow:hidden;
    background:var(--line); display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .mem-thumb img, .mem-thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .mem-info{ flex:1; min-width:0; }
  .mem-item .mem-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .mem-item .mem-meta{ font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .mem-item .mem-meta.err{ color:var(--error); }
  .mem-progress-track{ background:var(--line); border-radius:999px; height:4px; overflow:hidden; margin-top:5px; }
  .mem-progress-fill{ background:var(--gold); height:100%; border-radius:999px; transition:width .2s ease; }
  .mem-actions{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .mem-actions button{
    background:none; border:none; cursor:pointer; line-height:1; padding:4px 6px;
    color:var(--text-secondary); font-size:14px; border-radius:6px;
  }
  .mem-actions button:hover{ background:rgba(43,43,43,.06); }
  .mem-actions button:disabled{ opacity:.35; cursor:default; }
  .mem-actions .mem-remove{ color:var(--error); font-size:16px; }
  .mem-actions .mem-retry{ color:var(--gold-deep); font-size:12px; font-weight:600; }
  /* Cerinta 3 (2026-08-30): inputul nativ RAMANE in DOM, functional, dar vizual ascuns — un
     <label for="mem-file-input"> (mai jos) e singurul declansator vizibil, stilizat ca un CTA
     mare. NICIODATA display:none (unele combinatii vechi de browser/screen-reader pot ignora
     label-ul asociat unui element display:none) — folosim in schimb tehnica standard "vizual
     ascuns, dar prezent" (clip + dimensiune de 1px), care pastreaza inputul complet functional
     si accesibil pentru orice tehnologie asistiva. */
  #mem-file-input{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .btn-pick-files{
    display:flex; align-items:center; justify-content:center; text-align:center;
    width:100%; max-width:420px; min-height:56px; box-sizing:border-box;
    padding:14px 24px; font-size:16px; font-weight:700; border-radius:14px;
    background:var(--orange); color:var(--error); border:none; cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(245,166,35,.55); margin:0 auto 12px;
  }
  .btn-pick-files:hover{ background:var(--orange-deep); box-shadow:0 12px 28px -8px rgba(201,127,20,.55); }
  .btn-pick-files:focus-visible{ outline:3px solid var(--orange-deep); outline-offset:2px; }
  .btn-pick-files.is-disabled-look{ opacity:.5; pointer-events:none; box-shadow:none; }
  /* Cerinta 4: forma compacta a aceluiasi buton, folosita STRICT in etapa de incarcare (cand
     coada e goala si mai e loc pentru materiale) — ramane ACELASI element <label>, niciodata
     un al doilea input/label separat, doar redimensionat vizual. */
  .btn-pick-files.compact{ min-height:44px; font-size:14px; padding:10px 20px; max-width:320px; }
  #upload-stage-header{ text-align:center; margin-bottom:6px; }
  #upload-stage-header .sub{ margin-bottom:14px; }
  /* CERINTA 5 (2026-08-31, "un singur loader mare pentru incarcarea media"): inlocuieste barele
     individuale per fisier (eliminate din renderQueueRowInner) cu UN SINGUR loader mare,
     centrat, portocaliu, pentru intregul lot. Procentul afisat (mem-batch-loader-pct) si bara
     (mem-batch-loader-fill) sunt actualizate STRICT din renderBatchStatus() — niciun procent sau
     temporizator fals. Inelul (mem-batch-loader-ring) e STRICT decorativ (aria-hidden) — animatia
     lui de rotatie e dezactivata complet sub prefers-reduced-motion (vezi media query mai jos),
     ramanand un inel static, fara sa piarda nicio informatie (procentul si textul raman identice).*/
  .mem-batch-loader{ display:none; flex-direction:column; align-items:center; text-align:center; margin:18px 0 22px; }
  .mem-batch-loader-ring{
    width:64px; height:64px; border-radius:50%; margin-bottom:14px;
    border:6px solid var(--line); border-top-color:var(--orange); box-sizing:border-box;
  }
  @media (prefers-reduced-motion: no-preference){
    .mem-batch-loader-ring{ animation:mem-loader-spin 1s linear infinite; }
  }
  @keyframes mem-loader-spin{ to{ transform:rotate(360deg); } }
  .mem-batch-loader-pct{ font-family:'Fraunces',serif; font-size:32px; font-weight:600; color:var(--orange-deep); margin:0 0 6px; }
  .upload-overall-track{
    background:var(--line); border-radius:999px; height:14px; overflow:hidden; margin:6px 0 14px;
    width:100%; max-width:360px;
  }
  .upload-overall-fill{ background:var(--orange); height:100%; border-radius:999px; transition:width .3s ease; width:0%; }
  @media (prefers-reduced-motion: reduce){
    .upload-overall-fill{ transition:none; }
  }
  .mem-batch-loader .mem-batch-status{ font-size:14px; margin:0 0 4px; }
  .mem-batch-loader-note{ font-size:12px; color:var(--text-secondary); margin:0; }
  .mem-batch-loader.has-errors .mem-batch-loader-ring{ border-top-color:var(--error); animation:none; }
  .mem-batch-loader.has-errors .mem-batch-loader-fill{ background:var(--error); }
  /* CERINTA 4 (2026-08-31, fallback "Colectii" iPhone) — panou de recuperare, afisat STRICT dupa
     un cancel/revenire fara fisiere de la selectorul nativ (niciodata preemptiv). */
  .mem-recovery{
    display:none; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin:14px 0; text-align:left;
  }
  .mem-recovery p{ font-size:13px; color:var(--text-secondary); margin:0 0 8px; }
  .mem-recovery p:last-of-type{ margin-bottom:12px; }
  .mem-recovery-fallback-input{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .btn-pick-files-fallback{
    display:flex; align-items:center; justify-content:center; text-align:center;
    width:100%; min-height:48px; box-sizing:border-box; padding:12px 20px; font-size:14px;
    font-weight:700; border-radius:12px; background:transparent; color:var(--orange-deep);
    border:2px solid var(--orange); cursor:pointer;
  }
  .btn-pick-files-fallback:focus-visible{ outline:3px solid var(--orange-deep); outline-offset:2px; }
  .mem-status{ font-size:13px; margin-top:10px; }
  .mem-status.err{ color:var(--error); }
  .mem-picker-retry-btn{
    background:none; border:none; padding:0; margin-left:4px; color:var(--gold-deep);
    font-size:13px; font-weight:600; text-decoration:underline; cursor:pointer;
    font-family:'Sora',sans-serif;
  }
  .create-video-wrap{ text-align:center; margin-top:10px; }
  .create-video-sub{ font-size:13px; color:var(--text-secondary); margin-top:10px; }
  .create-video-error{ font-size:13px; color:var(--error); margin-top:10px; }
</style>
</head>
<body>
<div class="ambient-wash"></div>
<div class="page-wrap">
  <div class="card" id="main-card">
    <img class="logo-mark" src="/logo.svg" alt="NALUNA">

    <div id="loading-state">
      <div class="spinner-wrap"><div class="spinner-glow"></div><div class="spinner"></div></div>
      <p class="sub" id="loading-msg">Se încarcă...</p>
    </div>

    <div id="notfound-state" style="display:none; text-align:center;">
      <h1 class="display" id="notfound-title"></h1>
      <p class="sub" id="notfound-sub"></p>
      <a class="btn btn-primary" href="/index.html" id="notfound-link"></a>
    </div>

    <div id="not-eligible-state" style="display:none; text-align:center;">
      <h1 class="display" id="not-eligible-title"></h1>
      <p class="sub" id="not-eligible-sub"></p>
    </div>

    <div id="content-state" style="display:none;">
      <div class="back-link-row" id="back-link-row">
        <a class="back-link" id="back-link" href="#"></a>
      </div>
      <!-- Etapa 1 (selectie) — titlu, explicatie si chenarul informativ. Cerinta 4: ascunse
           complet imediat ce clientul intra in etapa de incarcare (enterUploadStage() mai jos),
           NICIODATA navigare catre alt document — doar vizibilitate, in acelasi runtime, ca
           obiectele File selectate sa nu se piarda. -->
      <h1 class="display" id="memories-title"></h1>
      <p class="sub" id="memories-sub" style="margin-bottom:14px;"></p>

      <div class="iphone-hint" id="iphone-hint" role="note">
        <p class="iphone-hint-text" id="iphone-hint-text"></p>
      </div>

      <!-- Etapa 2 (incarcare) — pagina separata, simpla: titlu clar + explicatie ca pagina
           trebuie pastrata deschisa + progresul general. Logo-ul e deja comun tuturor starilor
           (img.logo-mark, in afara acestui div). Ascunsa implicit — aratata STRICT dupa prima
           selectie reala de fisiere. -->
      <div id="upload-stage-header" style="display:none;">
        <h1 class="display" id="upload-stage-title"></h1>
        <p class="sub" id="upload-stage-sub"></p>
      </div>

      <div class="memories" id="memories-section">
        <p class="memories-meta" id="memories-meta"></p>
        <p class="memories-count" id="memories-count" aria-live="polite"></p>
        <div class="mem-list" id="mem-uploaded-list"></div>
        <!-- CERINTA 5 (2026-08-31): UN SINGUR loader mare, portocaliu, pentru intregul lot —
             inlocuieste barele individuale per fisier (vezi renderQueueRowInner, fara progress-
             track in timpul incarcarii normale). role="progressbar" pe bara reala; #mem-batch-
             status ramane SINGURA regiune aria-live="polite" (text uman, actualizat de
             renderBatchStatus()) — inelul/procentul sunt STRICT decorative (aria-hidden). -->
        <div class="mem-batch-loader" id="mem-batch-loader">
          <div class="mem-batch-loader-ring" aria-hidden="true"></div>
          <p class="mem-batch-loader-pct" id="mem-batch-loader-pct" aria-hidden="true">0%</p>
          <div class="upload-overall-track" id="upload-overall-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="upload-overall-fill" id="upload-overall-fill"></div>
          </div>
          <p class="mem-batch-status" id="mem-batch-status" aria-live="polite"></p>
          <p class="mem-batch-loader-note" id="mem-batch-loader-note"></p>
        </div>
        <div class="mem-list" id="mem-staged-list" aria-busy="false"></div>
        <!-- CORECȚIE (2026-08-14, "Articolele nu pot fi încărcate" pe iPhone): accept simplu, cu
             wildcard-uri ("image/*, video/*") — Safari/iOS poate esua sa initializeze corect
             selectorul nativ cu o lista lunga de MIME-uri explicite. Validarea REALA de continut
             (magic bytes + decodare ffprobe) ramane STRICT server-side, neschimbata.
             CORECȚIE (2026-08-30, Cerinta 3): un SINGUR input nativ, ramas EXACT cu aceleasi
             atribute (multiple, accept="image/*,video/*", fara capture, fara webkitdirectory) —
             doar vizual ascuns (vezi CSS #mem-file-input mai sus). Activarea se face STRICT
             nativ, printr-un <label for="mem-file-input">, niciodata prin input.click()
             programatic. -->
        <input type="file" id="mem-file-input" multiple accept="image/*,video/*" aria-label="Selectează poze și videoclipuri">
        <label class="btn-pick-files" for="mem-file-input" id="mem-pick-label"><span id="mem-pick-label-text"></span></label>
        <p class="mem-status" id="mem-status" role="status" aria-live="assertive" aria-busy="false"></p>

        <!-- CERINTA 4 (2026-08-31): panou de recuperare, afisat STRICT dupa un cancel/revenire
             fara fisiere din selectorul nativ (showRecoveryUI(), niciodata preemptiv). Al doilea
             input, STATIC, FARA accept — nu forteaza din nou selectorul catre Photos — activat
             STRICT printr-un <label>, exact ca inputul principal, niciodata input.click(). -->
        <div class="mem-recovery" id="mem-recovery" role="region" aria-live="polite">
          <p id="mem-recovery-title" style="font-weight:700; color:var(--text);"></p>
          <p id="mem-recovery-safari" style="display:none;"></p>
          <p id="mem-recovery-check"></p>
          <p id="mem-recovery-icloud"></p>
          <input type="file" id="mem-file-input-fallback" class="mem-recovery-fallback-input" multiple aria-label="Alege fișiere">
          <label class="btn-pick-files-fallback" for="mem-file-input-fallback" id="mem-pick-fallback-label"><span id="mem-pick-fallback-label-text"></span></label>
        </div>
      </div>

      <div class="create-video-wrap" id="gift-video-create" style="display:none;">
        <button type="button" class="btn-cta-orange" id="gift-video-create-btn"></button>
        <p class="create-video-sub" id="gift-video-create-sub"></p>
        <p class="create-video-error" id="gift-video-create-error" style="display:none;"></p>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================================================================
  // Traduceri — STRICT subsetul necesar acestei pagini (nume/functii identice cu cele deja
  // existente in melodia-mea.html, pentru ACELEASI chei — sursa unica de adevar ramane server-
  // side order.lang, niciodata limba curenta a browserului).
  // ==========================================================================================
  const T = {
    ro: {
      loading: 'Se încarcă...',
      notfound_title: 'Nu am găsit această comandă', notfound_sub: 'Linkul poate fi incorect sau incomplet.', notfound_cta: 'Începe o comandă nouă',
      not_eligible_title: 'Această pagină nu este disponibilă pentru comanda ta',
      not_eligible_sub: 'Materialele pentru videoclip pot fi adăugate doar pentru pachetul Cadou video, după ce melodia finală este stabilită.',
      back_link: '← Înapoi la melodia mea',
      memories_title: 'Adaugă pozele și videoclipurile tale',
      memories_sub: 'Adaugă între 3 și 30 poze sau clipuri video — le vom transforma într-un videoclip sincronizat cu melodia ta.',
      memories_pick_files_btn: 'Alege fișierele',
      upload_stage_title: 'Se încarcă amintirile tale',
      upload_stage_sub: 'Te rugăm să păstrezi această pagină deschisă până se termină încărcarea.',
      memories_meta: (min, max) => `Între ${min} și ${max} materiale • JPG, PNG, HEIC, DNG, MP4, MOV, WebM • orice combinație de poze și videoclipuri`,
      memories_count: (n, min, max, pending) => (n < min ? `${n} din minimum ${min} materiale` : n > max ? `Prea multe materiale (${n}/${max})` : `${n} materiale — gata de continuare`) + (pending > 0 ? ` (${pending} în curs de încărcare)` : ''),
      memories_uploading: 'Se încarcă...', memories_queued: 'În așteptare...', memories_uploaded: 'Încărcat', memories_remove: '✕', memories_retry: 'Reîncearcă',
      memories_processing: 'Se procesează',
      memories_uploading_pct: (pct) => `Se încarcă — ${pct}%`,
      memories_batch_progress: (done, total, pct) => `Se încarcă ${done} din ${total} materiale — ${pct}%`,

  const supportedLangs = ['ro', 'en', 'de', 'es', 'it', 'fr', 'bg', 'tr'];
  let lang = 'ro';
  let t = T.ro;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  const accessToken = params.get('token') || localStorage.getItem('nds_access_token') || '';

  if (!orderId) { window.location.href = '/index.html'; }

  const states = ['loading-state', 'notfound-state', 'not-eligible-state', 'content-state'];
  function showState(name) {
    states.forEach(s => { document.getElementById(s).style.display = (s === name) ? 'block' : 'none'; });
  }

  function applyStaticTexts() {
    document.getElementById('loading-msg').textContent = t.loading;
    document.getElementById('notfound-title').textContent = t.notfound_title;
    document.getElementById('notfound-sub').textContent = t.notfound_sub;
    document.getElementById('notfound-link').textContent = t.notfound_cta;
    document.getElementById('not-eligible-title').textContent = t.not_eligible_title;
    document.getElementById('not-eligible-sub').textContent = t.not_eligible_sub;
    const back = document.getElementById('back-link');
    back.textContent = t.back_link;
    back.href = `/melodia-mea.html?id=${encodeURIComponent(orderId || '')}&token=${encodeURIComponent(accessToken)}`;
    document.getElementById('memories-title').textContent = t.memories_title;
    document.getElementById('memories-sub').textContent = t.memories_sub;
    document.getElementById('memories-meta').textContent = t.memories_meta(MEM_MIN, MEM_MAX);
    document.getElementById('iphone-hint-text').textContent = `ℹ️ ${t.memories_iphone_hint}`;
    document.getElementById('mem-pick-label-text').textContent = t.memories_pick_files_btn;
    document.getElementById('upload-stage-title').textContent = t.upload_stage_title;
    document.getElementById('upload-stage-sub').textContent = t.upload_stage_sub;
    document.getElementById('gift-video-create-btn').textContent = t.gift_video_create_btn;
    document.getElementById('gift-video-create-sub').textContent = t.gift_video_create_sub;
    document.getElementById('mem-recovery-title').textContent = t.memories_recovery_title;
    document.getElementById('mem-recovery-safari').textContent = t.memories_recovery_safari;
    document.getElementById('mem-recovery-check').textContent = t.memories_recovery_check;
    document.getElementById('mem-recovery-icloud').textContent = t.memories_recovery_icloud;
    document.getElementById('mem-pick-fallback-label-text').textContent = t.memories_pick_files_fallback_btn;
    document.getElementById('mem-file-input-fallback').setAttribute('aria-label', t.memories_pick_files_fallback_btn);
    document.getElementById('mem-batch-loader-note').textContent = t.memories_dont_close;
    document.getElementById('upload-overall-track').setAttribute('aria-label', t.upload_stage_title);
  }

  // ==========================================================================================
  // Amintiri (poze/videoclipuri) pentru pachetul video — MUTAT integral din melodia-mea.html
  // (2026-08-29, "pagina separata pentru selectarea si incarcarea media"), logica de upload
  // NESCHIMBATA (aceleasi endpointuri /media, /media/confirm, /media/multipart/*, /media/reorder,
  // /media/:index — maximum 2 uploaduri simultane, retry per fisier/fragment, thumbnailuri cu
  // concurenta limitata) — DOAR bootstrap-ul paginii e nou (comanda + token validate independent,
  // fara playerul melodiei/versuri/checkout).
  // ==========================================================================================
  let uploadQueue = [];
  let memOrderRef = null;
  const thumbCache = new Map();

  const VIDEO_EXTENSIONS = ['.mp4', '.m4v', '.mov', '.webm'];
  function isVideoFile(file) {
    if (file.type.startsWith('video')) return true;
    if (file.type) return false;
    const match = String(file.name || '').match(/\.[^./\\]+$/);
    return !!match && VIDEO_EXTENSIONS.includes(match[0].toLowerCase());
  }

  const MEM_MIN = 3;
  // CORECȚIE (2026-08-31, "mărește limita de la 10 la 30 de materiale"): oglindeste STRICT
  // ORDER_MEDIA_MAX_ITEMS din server.js — orice schimbare viitoare trebuie facuta in ambele locuri.
  const MEM_MAX = 30;

  function renderMemories(order) {
    memOrderRef = order;
    renderExistingList(order);
    renderQueueList();
    updateMemoriesCountAndGates(order);
  }

  function updateMemoriesCountAndGates(order) {
    const total = (order.uploadedMedia || []).length;
    const pendingCount = uploadQueue.filter(q => q.status === 'uploading' || q.status === 'pending' || q.status === 'processing').length;
    const uploading = pendingCount > 0;
    const hasUnresolvedError = uploadQueue.some(q => q.status === 'error');
    const countEl = document.getElementById('memories-count');
    const ok = total >= MEM_MIN && total <= MEM_MAX;
    countEl.textContent = t.memories_count(total, MEM_MIN, MEM_MAX, pendingCount);
    countEl.className = 'memories-count ' + (ok ? 'ok' : 'warn');
    updateCreateButtonVisibility(order, ok && !uploading && !hasUnresolvedError);
    maybeAutoConfirmMedia(order, ok && !uploading && !hasUnresolvedError);
    syncPickerLabelState();
  }

  // Vizibilitatea butonului "Creează videoclipul" — mediaReady inseamna EXACT aceeasi conditie
  // ca in melodia-mea.html (order.mediaConfirmedAt setat de server SI nicio coada locala activa).
  function updateCreateButtonVisibility(order, gateOk) {
    const wrap = document.getElementById('gift-video-create');
    if (order.videoStatus && order.videoStatus !== 'none' && order.videoStatus !== 'failed') {
      // job deja activ/gata — nu mai afisam butonul de creare pe aceasta pagina (previne o a
      // doua cerere in paralel); clientul e oricum redirectionat la incarcare (vezi loadOrder).
      wrap.style.display = 'none';
      return;
    }
    const mediaReady = gateOk && !!order.mediaConfirmedAt && uploadQueue.length === 0;
    wrap.style.display = mediaReady ? 'block' : 'none';
  }

  let mediaConfirmInFlight = false;
  let mediaConfirmRetryCount = 0;
  let mediaConfirmRetryTimer = null;
  const MEDIA_CONFIRM_MAX_RETRIES = 6;
  async function maybeAutoConfirmMedia(order, gateOk) {
    if (!gateOk || mediaConfirmInFlight || order.mediaConfirmedAt) return;
    if (mediaConfirmRetryTimer) return;
    mediaConfirmInFlight = true;
    try {
      const res = await fetch(`/api/orders/${orderId}/media/confirm`, {
        method: 'POST',
        headers: { 'X-Access-Token': accessToken }
      });
      if (res.ok) {
        mediaConfirmRetryCount = 0;
        const confirmedAt = new Date().toISOString();
        order.mediaConfirmedAt = confirmedAt;
        if (memOrderRef) memOrderRef.mediaConfirmedAt = confirmedAt;
        hideConfirmFailedMessage();
        updateCreateButtonVisibility(order, true);
      } else if (mediaConfirmRetryCount < MEDIA_CONFIRM_MAX_RETRIES) {
        mediaConfirmRetryCount++;
        mediaConfirmRetryTimer = setTimeout(() => { mediaConfirmRetryTimer = null; maybeAutoConfirmMedia(order, gateOk); }, Math.min(3000 * mediaConfirmRetryCount, 15000));
      } else {
        showConfirmFailedMessage(order, gateOk);
      }
    } catch (e) {
      if (mediaConfirmRetryCount < MEDIA_CONFIRM_MAX_RETRIES) {
        mediaConfirmRetryCount++;
        mediaConfirmRetryTimer = setTimeout(() => { mediaConfirmRetryTimer = null; maybeAutoConfirmMedia(order, gateOk); }, Math.min(3000 * mediaConfirmRetryCount, 15000));
      } else {
        showConfirmFailedMessage(order, gateOk);
      }
    }
    mediaConfirmInFlight = false;
  }

  // CORECȚIE (2026-08-29, "daca toate incercarile de /media/confirm esueaza, afiseaza o eroare
  // localizata si un buton functional de retry"): inainte, epuizarea retry-urilor era complet
  // tacuta — clientul ramanea fara nicio explicatie si fara nicio actiune posibila.
  function showConfirmFailedMessage(order, gateOk) {
    const el = document.getElementById('gift-video-create-error');
    el.innerHTML = '';
    el.appendChild(document.createTextNode(t.memories_confirm_failed + ' '));
    const retryBtn = document.createElement('button');
    retryBtn.type = 'button';
    retryBtn.className = 'mem-picker-retry-btn';
    retryBtn.textContent = t.memories_retry;
    retryBtn.addEventListener('click', () => {
      mediaConfirmRetryCount = 0;
      hideConfirmFailedMessage();
      maybeAutoConfirmMedia(order, gateOk);
    });
    el.appendChild(retryBtn);
    el.style.display = 'block';
  }
  function hideConfirmFailedMessage() {
    const el = document.getElementById('gift-video-create-error');
    el.style.display = 'none';
    el.innerHTML = '';
  }

  async function fetchThumbUrl(index) {
    if (thumbCache.has(index)) return thumbCache.get(index);
    try {
      const res = await fetch(`/api/orders/${orderId}/media/${index}/preview-url`, {
        headers: { 'X-Access-Token': accessToken }
      });
      if (!res.ok) return null;
      const data = await res.json();
      thumbCache.set(index, data.url);
      return data.url;
    } catch (e) {
      return null;
    }
  }

  function renderExistingList(order) {
    const uploaded = order.uploadedMedia || [];
    const uploadedList = document.getElementById('mem-uploaded-list');
    uploadedList.innerHTML = uploaded.map((m, i) => `
      <div class="mem-item" draggable="true" data-existing-index="${i}">
        <span class="mem-thumb" data-thumb-index="${i}">${m.type === 'photo' ? '🖼️' : '🎬'}</span>
        <div class="mem-actions">
          <button type="button" class="mem-move-up" data-move-up="${i}" title="${t.memories_move_up}" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button type="button" class="mem-move-down" data-move-down="${i}" title="${t.memories_move_down}" ${i === uploaded.length - 1 ? 'disabled' : ''}>↓</button>
          <button type="button" class="mem-remove" data-remove-index="${i}" title="${t.memories_remove}">${t.memories_remove}</button>
        </div>
      </div>
    `).join('');

    uploadedList.querySelectorAll('[data-thumb-index]').forEach(async (el) => {
      const idx = Number(el.dataset.thumbIndex);
      const item = uploaded[idx];
      const fallbackIcon = item.type === 'photo' ? '🖼️' : '🎬';
      const url = await fetchThumbUrl(idx);
      if (!url) { el.textContent = fallbackIcon; return; }
      const mediaEl = document.createElement(item.type === 'photo' ? 'img' : 'video');
      mediaEl.src = url;
      if (item.type === 'photo') {
        mediaEl.alt = '';
        mediaEl.loading = 'lazy';
      } else {
        mediaEl.muted = true;
        mediaEl.playsInline = true;
        mediaEl.preload = 'metadata';
      }
      mediaEl.addEventListener('error', () => { el.textContent = fallbackIcon; });
      el.innerHTML = '';
      el.appendChild(mediaEl);
    });

    uploadedList.querySelectorAll('button[data-remove-index]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await fetch(`/api/orders/${orderId}/media/${btn.dataset.removeIndex}`, {
            method: 'DELETE',
            headers: { 'X-Access-Token': accessToken }
          });
          thumbCache.clear();
          await refreshOrderMedia();
        } catch (e) {
          btn.disabled = false;
        }
      });
    });

    uploadedList.querySelectorAll('[data-move-up], [data-move-down]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const total = uploaded.length;
        const from = Number(btn.dataset.moveUp !== undefined && btn.dataset.moveUp !== '' ? btn.dataset.moveUp : btn.dataset.moveDown);
        const to = btn.dataset.moveUp !== undefined && btn.dataset.moveUp !== '' ? from - 1 : from + 1;
        if (to < 0 || to >= total) return;
        await reorderExisting(swapArrayIndices(total, from, to));
      });
    });

    let dragFrom = null;
    uploadedList.querySelectorAll('[data-existing-index]').forEach(el => {
      el.addEventListener('dragstart', () => { dragFrom = Number(el.dataset.existingIndex); el.classList.add('dragging'); });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', async (e) => {
        e.preventDefault();
        el.classList.remove('drag-over');
        const dragTo = Number(el.dataset.existingIndex);
        if (dragFrom === null || dragFrom === dragTo) return;
        await reorderExisting(moveArrayIndex(uploaded.length, dragFrom, dragTo));
        dragFrom = null;
      });
    });
  }

  function swapArrayIndices(length, a, b) {
    const order = Array.from({ length }, (_, i) => i);
    [order[a], order[b]] = [order[b], order[a]];
    return order;
  }
  function moveArrayIndex(length, from, to) {
    const order = Array.from({ length }, (_, i) => i);
    const [moved] = order.splice(from, 1);
    order.splice(to, 0, moved);
    return order;
  }

  async function reorderExisting(newOrderIndices) {
    thumbCache.clear();
    try {
      await fetch(`/api/orders/${orderId}/media/reorder`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken },
        body: JSON.stringify({ order: newOrderIndices })
      });
    } catch (e) { /* refresh-ul de mai jos reflecta oricum starea reala de pe server */ }
    await refreshOrderMedia();
  }

  async function refreshOrderMedia() {
    try {
      const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}?token=${encodeURIComponent(accessToken)}`);
      if (!res.ok) return;
      const fresh = await res.json();
      if (memOrderRef) memOrderRef.uploadedMedia = fresh.uploadedMedia;
      renderExistingList(fresh);
      updateMemoriesCountAndGates(fresh);
    } catch (e) { /* urmatorul poll/refresh manual va corecta */ }
  }

  // CERINTA 5 (2026-08-31, "un singur loader mare"): randul static NU mai afiseaza bara/procent
  // individual in timpul incarcarii normale (uploading/processing) — progresul e reprezentat
  // STRICT de loaderul agregat unic (mem-batch-loader, vezi renderBatchStatus). Randul ramane
  // util pentru identificare (nume, iconita, stare text) si pentru actiunile de eroare
  // (Reincarca/Sterge), neschimbate.
  function renderQueueRowInner(q) {
    return `
      <span class="mem-thumb">${isVideoFile(q.file) ? '🎬' : (q.thumbUrl ? `<img src="${q.thumbUrl}" alt="" loading="lazy" decoding="async">` : '🖼️')}</span>
      <div class="mem-info">
        <span class="mem-name">${escapeHtml(q.file.name)}</span>
        <span class="mem-meta ${q.status === 'error' ? 'err' : ''}">${
          q.status === 'uploading' ? t.memories_uploading_pct(q.progress)
          : q.status === 'processing' ? t.memories_processing
          : q.status === 'pending' ? t.memories_queued
          : q.status === 'error' ? (q.errorMsg || t.memories_upload_error)
          : t.memories_uploaded
        }</span>
      </div>
      <div class="mem-actions">
        ${q.status === 'error' ? `<button type="button" class="mem-retry" data-retry-id="${q.localId}">${t.memories_retry}</button>` : ''}
        <button type="button" class="mem-remove" data-queue-remove="${q.localId}" title="${t.memories_remove}" ${(q.status === 'uploading' || q.status === 'processing') ? 'disabled' : ''}>${t.memories_remove}</button>
      </div>
    `;
  }

  const LOCAL_THUMB_MAX_DIM = 240;
  const LOCAL_THUMB_CONCURRENCY = 1;
  let localThumbQueue = [];
  let localThumbActive = 0;
  function scheduleLocalThumbnail(entry) {
    localThumbQueue.push(entry);
    pumpLocalThumbQueue();
  }
  function pumpLocalThumbQueue() {
    while (localThumbActive < LOCAL_THUMB_CONCURRENCY && localThumbQueue.length > 0) {
      const entry = localThumbQueue.shift();
      if (!uploadQueue.includes(entry)) continue;
      localThumbActive++;
      generateLocalThumbnail(entry).finally(() => {
        localThumbActive--;
        pumpLocalThumbQueue();
      });
    }
  }
  async function generateLocalThumbnail(entry) {
    if (typeof createImageBitmap !== 'function') return;
    let bitmap = null;
    try {
      bitmap = await createImageBitmap(entry.file, { resizeWidth: LOCAL_THUMB_MAX_DIM, resizeQuality: 'medium' });
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
      if (!blob) return;
      if (!uploadQueue.includes(entry)) return;
      entry.thumbUrl = URL.createObjectURL(blob);
      patchQueueRowThumb(entry);
    } catch (err) {
      // format nesuportat/decodare esuata — ramane pe iconita 🖼️, niciodata o eroare vizibila
    } finally {
      if (bitmap && typeof bitmap.close === 'function') bitmap.close();
    }
  }
  function patchQueueRowThumb(entry) {
    const row = document.querySelector(`#mem-staged-list [data-queue-id="${entry.localId}"]`);
    if (!row) return;
    const thumbEl = row.querySelector('.mem-thumb');
    if (!thumbEl || isVideoFile(entry.file)) return;
    thumbEl.innerHTML = `<img src="${entry.thumbUrl}" alt="" loading="lazy" decoding="async">`;
  }

  function wireQueueRow(row, entry) {
    const retryBtn = row.querySelector('[data-retry-id]');
    if (retryBtn) retryBtn.addEventListener('click', () => {
      entry.status = 'pending';
      entry.errorMsg = null;
      renderQueueRow(entry);
      processUploadQueue();
    });
    const removeBtn = row.querySelector('[data-queue-remove]');
    if (removeBtn) removeBtn.addEventListener('click', () => {
      const idx = uploadQueue.findIndex(q => q.localId === entry.localId);
      if (idx === -1) return;
      entry.abortRequested = true;
      if (entry.xhr) entry.xhr.abort();
      if (entry.activePartXhrs) Object.values(entry.activePartXhrs).forEach(xhr => { try { xhr.abort(); } catch (e) {} });
      if (entry.multipartSessionId) {
        fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}`, {
          method: 'DELETE', headers: { 'X-Access-Token': accessToken }
        }).catch(() => {});
      }
      if (entry.thumbUrl) URL.revokeObjectURL(entry.thumbUrl);
      uploadQueue.splice(idx, 1);
      processUploadQueue();
      renderQueueList();
      updateBatchActiveState();
    });
  }

  function renderQueueList() {
    const el = document.getElementById('mem-staged-list');
    el.innerHTML = uploadQueue.map(q => `<div class="mem-item" data-queue-id="${q.localId}">${renderQueueRowInner(q)}</div>`).join('');
    el.querySelectorAll('[data-queue-id]').forEach(row => {
      const entry = uploadQueue.find(q => q.localId === row.dataset.queueId);
      if (entry) wireQueueRow(row, entry);
    });
    renderBatchStatus();
    if (memOrderRef) updateMemoriesCountAndGates(memOrderRef);
    updateBatchActiveState();
  }

  function renderQueueRow(entry) {
    const row = document.querySelector(`#mem-staged-list [data-queue-id="${entry.localId}"]`);
    if (!row) { renderQueueList(); return; }
    row.innerHTML = renderQueueRowInner(entry);
    wireQueueRow(row, entry);
    renderBatchStatus();
    if (memOrderRef) updateMemoriesCountAndGates(memOrderRef);
  }

  function patchQueueRowProgress(entry) {
    const row = document.querySelector(`#mem-staged-list [data-queue-id="${entry.localId}"]`);
    if (!row) return;
    const meta = row.querySelector('.mem-meta');
    if (!meta) { renderQueueRow(entry); return; }
    meta.textContent = entry.status === 'processing' ? t.memories_processing : t.memories_uploading_pct(entry.progress);
    meta.classList.remove('err');
  }

  let progressRafScheduled = false;
  const pendingProgressIds = new Set();
  function scheduleProgressUpdate(entry) {
    pendingProgressIds.add(entry.localId);
    if (progressRafScheduled) return;
    progressRafScheduled = true;
    requestAnimationFrame(() => {
      progressRafScheduled = false;
      const ids = Array.from(pendingProgressIds);
      pendingProgressIds.clear();
      ids.forEach(id => {
        const e = uploadQueue.find(q => q.localId === id);
        if (e) patchQueueRowProgress(e);
      });
      renderBatchStatus();
    });
  }

  let memBatchTotal = 0;
  let memBatchDoneCount = 0;
  // CERINTA 5 (2026-08-31): progresul agregat era PONDERAT PE NUMAR DE FISIERE (fiecare fisier
  // "valora" 1/memBatchTotal din procent, indiferent de marime) — cu un lot mixt de poze mici si
  // un videoclip de 100+MB, procentul sarea inainte fals de repede la finalul pozelor, apoi
  // parea "blocat" mult timp pe singurul videoclip mare. Ponderat acum STRICT dupa octeti REALI
  // (entry.file.size), singura masura corecta pentru un lot cu marimi foarte diferite.
  let memBatchTotalBytes = 0;
  let memBatchBytesDone = 0;
  function setLoaderProgressAttrs(pct) {
    const track = document.getElementById('upload-overall-track');
    if (track) track.setAttribute('aria-valuenow', String(pct));
    const pctEl = document.getElementById('mem-batch-loader-pct');
    if (pctEl) pctEl.textContent = pct + '%';
  }
  function renderBatchStatus() {
    const el = document.getElementById('mem-batch-status');
    if (!el) return;
    const loaderWrap = document.getElementById('mem-batch-loader');
    const overallFill = document.getElementById('upload-overall-fill');
    const noteEl = document.getElementById('mem-batch-loader-note');
    // CERINTA 5: loaderul agregat e vizibil STRICT cat timp exista materiale in coada (indiferent
    // de stare, inclusiv error — clientul trebuie sa vada rezumatul, nu doar cat timp se
    // incarca activ ceva) SAU cat timp lotul curent nu a fost inca golit complet.
    const hasQueueItems = uploadQueue.length > 0;
    if (loaderWrap) loaderWrap.style.display = (memBatchTotal > 0 && hasQueueItems) ? 'flex' : 'none';
    if (noteEl) noteEl.textContent = t.memories_dont_close;
    if (memBatchTotal === 0 || !hasQueueItems) {
      if (!hasQueueItems && memBatchTotal > 0) {
        // coada goala — fie totul a reusit (fara nicio eroare ramasa), fie clientul a sters
        // manual toate randurile ramase in eroare; in ambele cazuri nu mai e nimic de aratat aici.
        el.textContent = memBatchDoneCount > 0 ? t.memories_batch_done(memBatchDoneCount) : '';
      } else {
        el.textContent = '';
      }
      if (overallFill) overallFill.style.width = '0%';
      if (loaderWrap) loaderWrap.classList.remove('has-errors');
      setLoaderProgressAttrs(0);
      return;
    }
    const errorEntries = uploadQueue.filter(q => q.status === 'error');
    const activeEntries = uploadQueue.filter(q => q.status !== 'error');
    // Octeti "in zbor" pentru materialele inca active (pending/uploading/processing) — error e
    // EXCLUS explicit: octetii deja trimisi ai unui fisier esuat nu conteaza niciodata ca progres
    // "facut", altfel un lot cu esecuri ar putea ajunge fals aproape de 100%.
    const inFlightBytes = activeEntries.reduce((sum, q) => {
      if (q.status === 'processing') return sum + q.file.size;
      if (q.status === 'uploading') return sum + q.file.size * (Math.min(100, q.progress || 0) / 100);
      return sum; // pending: 0 octeti trimisi inca
    }, 0);
    const doneBytes = memBatchBytesDone + inFlightBytes;
    const overallPct = memBatchTotalBytes > 0 ? Math.min(100, Math.round((doneBytes / memBatchTotalBytes) * 100)) : 0;

    if (activeEntries.length === 0) {
      // Nimic mai e activ — fie chiar totul a reusit, fie au ramas STRICT materiale in eroare.
      if (errorEntries.length > 0) {
        el.textContent = t.memories_batch_errors(memBatchDoneCount, memBatchTotal, errorEntries.length);
        if (loaderWrap) loaderWrap.classList.add('has-errors');
        // CORECȚIE (2026-08-31, bug real gasit: "progresul agregat poate arata 100% desi lotul
        // are erori"): bara reflecta ACUM STRICT procentul real din octeti CU ADEVARAT incarcati
        // — niciodata 100% fals doar pentru ca nu mai ruleaza nimic activ.
        if (overallFill) overallFill.style.width = overallPct + '%';
        setLoaderProgressAttrs(overallPct);
      } else {
        el.textContent = memBatchDoneCount > 0 ? t.memories_batch_done(memBatchDoneCount) : '';
        if (loaderWrap) loaderWrap.classList.remove('has-errors');
        if (overallFill) overallFill.style.width = '100%';
        setLoaderProgressAttrs(100);
      }
      return;
    }
    if (loaderWrap) loaderWrap.classList.toggle('has-errors', errorEntries.length > 0);
    el.textContent = errorEntries.length > 0
      ? t.memories_batch_errors(memBatchDoneCount, memBatchTotal, errorEntries.length)
      : t.memories_batch_progress(memBatchDoneCount, memBatchTotal, overallPct);
    if (overallFill) overallFill.style.width = overallPct + '%';
    setLoaderProgressAttrs(overallPct);
  }

  // Cerinta 4 (2026-08-30, "pagina separata pentru incarcare"): comuta la a doua "vedere" —
  // NICIODATA navigare catre alt document (obiectele File selectate s-ar pierde) — doar
  // vizibilitate, in ACELASI runtime, apelata STRICT dupa ce FileList a fost deja copiat sincron
  // (vezi handler-ul 'change' mai jos). Ascunde titlul/explicatia/chenarul informativ/selectorul
  // mare al etapei 1; arata titlul clar + explicatia "pastreaza pagina deschisa" + progresul
  // general al etapei 2. Lista de materiale (deja existenta) si butonul de creare raman vizibile
  // in ambele etape — ele SUNT continutul relevant al etapei 2.
  let uploadStageEntered = false;
  function enterUploadStage() {
    if (uploadStageEntered) return;
    uploadStageEntered = true;
    document.getElementById('memories-title').style.display = 'none';
    document.getElementById('memories-sub').style.display = 'none';
    document.getElementById('iphone-hint').style.display = 'none';
    document.getElementById('memories-meta').style.display = 'none';
    document.getElementById('back-link-row').style.display = 'none';
    document.getElementById('upload-stage-header').style.display = 'block';
    document.getElementById('mem-pick-label').classList.add('compact');
    syncPickerLabelState();
  }

  // Vizibilitatea/starea vizuala a butonului mare (etapa 1) / compact (etapa 2) de alegere a
  // fisierelor — SINGURUL <label> asociat inputului nativ unic, in ambele etape. In etapa 1,
  // ramane mereu vizibil (doar cu aspect dezactivat cat timp memFileInput.disabled). In etapa 2,
  // ramane ascuns cat timp un lot e activ (clientul trebuie sa vada STRICT progresul incarcarii —
  // cerinta explicita), reaparand compact, STRICT cand coada s-a golit SI mai e loc pentru
  // materiale (sub MEM_MAX) — ca upload-ul unui numar insuficient de materiale sa nu blocheze
  // definitiv clientul fara nicio cale de a mai adauga altele.
  function syncPickerLabelState() {
    const label = document.getElementById('mem-pick-label');
    if (!label) return;
    const disabled = memFileInput.disabled;
    label.classList.toggle('is-disabled-look', disabled);
    if (!uploadStageEntered) { label.style.display = 'flex'; return; }
    const total = memOrderRef ? (memOrderRef.uploadedMedia || []).length : 0;
    label.style.display = (!disabled && total < MEM_MAX) ? 'flex' : 'none';
  }

  // CORECȚIE (2026-08-29, "blocheaza selectiile duplicate cat timp lotul este activ"): selectorul
  // ramane dezactivat (nu doar "lock" pe click) cat timp exista materiale in coada (incarcare/
  // procesare/eroare nerezolvata) — reactivat automat cand coada se goleste (toate reusite sau
  // eliminate). aria-busy urmeaza aceeasi stare, pentru cititoarele de ecran.
  function updateBatchActiveState() {
    const active = uploadQueue.length > 0;
    memFileInput.disabled = active;
    if (memFileInputFallback) memFileInputFallback.disabled = active;
    document.getElementById('mem-staged-list').setAttribute('aria-busy', active ? 'true' : 'false');
    document.getElementById('mem-status').setAttribute('aria-busy', active ? 'true' : 'false');
    const loaderWrap = document.getElementById('mem-batch-loader');
    if (loaderWrap) loaderWrap.setAttribute('aria-busy', active ? 'true' : 'false');
    syncPickerLabelState();
  }

  let memSyncTimer = null;
  let memSyncInFlight = false;
  let memSyncAgainNeeded = false;
  function scheduleMemSync() {
    memSyncAgainNeeded = true;
    if (memSyncTimer || memSyncInFlight) return;
    memSyncTimer = setTimeout(runMemSync, 700);
  }
  async function runMemSync() {
    memSyncTimer = null;
    if (memSyncInFlight || !memSyncAgainNeeded) return;
    memSyncAgainNeeded = false;
    memSyncInFlight = true;
    try {
      await refreshOrderMedia();
    } finally {
      memSyncInFlight = false;
      if (memSyncAgainNeeded) memSyncTimer = setTimeout(runMemSync, 700);
    }
  }

  const MAX_CONCURRENT_UPLOADS = 2;
  const UPLOAD_TIMEOUT_MS = 900000;
  const MEM_MULTIPART_THRESHOLD_BYTES = 20 * 1024 * 1024;
  const MEM_PART_RETRY_LIMIT = 5;
  const MEM_MAX_PARALLEL_PARTS = 2;

  function processUploadQueue() {
    const active = uploadQueue.filter(q => q.status === 'uploading' || q.status === 'processing').length;
    let slots = MAX_CONCURRENT_UPLOADS - active;
    if (slots <= 0) return;
    for (const entry of uploadQueue) {
      if (slots <= 0) break;
      if (entry.status === 'pending') {
        startUpload(entry);
        slots--;
      }
    }
  }

  function startUpload(entry) {
    entry.abortRequested = false;
    if (isVideoFile(entry.file) && entry.file.size > MEM_MULTIPART_THRESHOLD_BYTES) {
      startMultipartUpload(entry);
    } else {
      startSingleUpload(entry);
    }
  }

  function startSingleUpload(entry) {
    entry.status = 'uploading';
    entry.progress = 0;
    entry.errorMsg = null;
    renderQueueRow(entry);

    const formData = new FormData();
    formData.append('media', entry.file);
    formData.append('sections', JSON.stringify([entry.section || '']));

    const xhr = new XMLHttpRequest();
    entry.xhr = xhr;
    xhr.open('POST', `/api/orders/${orderId}/media`);
    xhr.setRequestHeader('X-Access-Token', accessToken);
    xhr.timeout = UPLOAD_TIMEOUT_MS;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        entry.progress = pct;
        if (pct >= 100 && entry.status === 'uploading') entry.status = 'processing';
        scheduleProgressUpdate(entry);
      }
    };
    xhr.onload = () => {
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) { /* raspuns invalid */ }
      const failedEntry = data && Array.isArray(data.failed) ? data.failed[0] : null;
      const succeeded = data && Array.isArray(data.uploaded) && data.uploaded.length > 0;
      if (xhr.status >= 200 && xhr.status < 300 && succeeded) {
        if (entry.thumbUrl) URL.revokeObjectURL(entry.thumbUrl);
        uploadQueue = uploadQueue.filter(q => q.localId !== entry.localId);
        memBatchDoneCount++;
        memBatchBytesDone += entry.file.size;
        renderQueueList();
        processUploadQueue();
        scheduleMemSync();
      } else {
        entry.status = 'error';
        entry.errorMsg = (failedEntry && failedEntry.reason) || (data && data.error) || t.memories_upload_error;
        renderQueueRow(entry);
        processUploadQueue();
      }
    };
    xhr.onerror = () => {
      entry.status = 'error';
      entry.errorMsg = t.memories_upload_error;
      renderQueueRow(entry);
      processUploadQueue();
    };
    xhr.ontimeout = () => {
      entry.status = 'error';
      entry.errorMsg = t.memories_upload_timeout;
      renderQueueRow(entry);
      processUploadQueue();
    };
    xhr.onabort = () => { processUploadQueue(); };
    xhr.send(formData);
  }

  // Cale de rezerva, independenta de CORS — vezi comentariul de la storage.getMultipartPartETag
  // in server.js. Apelata STRICT dupa un PUT reusit (2xx) fara ETag citibil in raspuns.
  async function fetchPartEtagFallback(entrySessionId, partNumber) {
    const res = await fetch(`/api/orders/${orderId}/media/multipart/${entrySessionId}/part-etag?partNumber=${partNumber}`, {
      headers: { 'X-Access-Token': accessToken }
    });
    if (!res.ok) return null;
    const data = await res.json().catch(() => ({}));
    return data.etag || null;
  }

  function uploadOnePart(entry, partNumber, blob, onProgress) {
    return new Promise((resolve, reject) => {
      let attempt = 0;
      const fetchPartEtagFallbackForEntry = (pn) => fetchPartEtagFallback(entry.multipartSessionId, pn);
      const tryOnce = async () => {
        if (entry.abortRequested) { reject(new Error('aborted')); return; }
        try {
          const urlRes = await fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}/part-url`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken },
            body: JSON.stringify({ partNumber })
          });
          const urlData = await urlRes.json().catch(() => ({}));
          if (!urlRes.ok || !urlData.url) { retryOrFail(); return; }
          const xhr = new XMLHttpRequest();
          entry.activePartXhrs = entry.activePartXhrs || {};
          entry.activePartXhrs[partNumber] = xhr;
          xhr.open('PUT', urlData.url);
          xhr.timeout = UPLOAD_TIMEOUT_MS;
          xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded); };
          xhr.onload = () => {
            delete entry.activePartXhrs[partNumber];
            if (xhr.status >= 200 && xhr.status < 300) {
              const etag = xhr.getResponseHeader('ETag');
              if (etag) { onProgress(blob.size); resolve(etag); return; }
              // CORECȚIE (2026-08-30, "IMG_6810.mov — Încărcarea a eșuat"): PUT-ul chiar a
              // reușit la R2 (status 2xx) — un ETag lipsă in răspuns înseamnă cel mai probabil
              // că CORS-ul bucket-ului nu expune header-ul ETag pentru această origine, nu că
              // fragmentul nu s-a încărcat. Reîncercarea ACELUIAȘI PUT nu ajută (nu e o eroare
              // tranzitorie) — întrebăm în schimb serverul (acces R2 direct, neafectat de CORS)
              // ce ETag are fragmentul deja urcat, înainte de a renunța.
              fetchPartEtagFallbackForEntry(partNumber).then((fallbackEtag) => {
                if (fallbackEtag) { onProgress(blob.size); resolve(fallbackEtag); }
                else { retryOrFail(); }
              }).catch(() => { retryOrFail(); });
            } else { retryOrFail(); }
          };
          xhr.onerror = () => { delete entry.activePartXhrs[partNumber]; retryOrFail(); };
          xhr.ontimeout = () => { delete entry.activePartXhrs[partNumber]; retryOrFail(); };
          xhr.onabort = () => { delete entry.activePartXhrs[partNumber]; reject(new Error('aborted')); };
          xhr.send(blob);
        } catch (err) {
          retryOrFail();
        }
      };
      const retryOrFail = () => {
        attempt++;
        if (entry.abortRequested) { reject(new Error('aborted')); return; }
        if (attempt > MEM_PART_RETRY_LIMIT) { reject(new Error('part failed')); return; }
        onProgress(0);
        setTimeout(tryOnce, Math.min(1000 * attempt, 5000));
      };
      tryOnce();
    });
  }

  async function startMultipartUpload(entry) {
    entry.status = 'uploading';
    entry.progress = 0;
    entry.errorMsg = null;
    renderQueueRow(entry);
    try {
      const initRes = await fetch(`/api/orders/${orderId}/media/multipart/init`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken },
        body: JSON.stringify({ filename: entry.file.name, size: entry.file.size, mimeType: entry.file.type || '', section: entry.section || '' })
      });
      const initData = await initRes.json().catch(() => ({}));
      if (!initRes.ok || !initData.sessionId) throw new Error(initData.error || 'init failed');
      entry.multipartSessionId = initData.sessionId;
      const partSize = initData.partSize || (10 * 1024 * 1024);
      const totalBytes = entry.file.size;
      const totalParts = Math.max(1, Math.ceil(totalBytes / partSize));

      const partBytesSent = new Array(totalParts + 1).fill(0);
      function reportProgress() {
        const sum = partBytesSent.reduce((a, b) => a + b, 0);
        entry.progress = Math.min(99, Math.round((sum / totalBytes) * 100));
        scheduleProgressUpdate(entry);
      }

      const completedParts = await new Promise((resolveAll, rejectAll) => {
        const results = [];
        let nextPartNumber = 1;
        let active = 0;
        let firstError = null;
        function pump() {
          if (firstError) { rejectAll(firstError); return; }
          if (results.length === totalParts) { resolveAll(results); return; }
          while (active < MEM_MAX_PARALLEL_PARTS && nextPartNumber <= totalParts) {
            const partNumber = nextPartNumber++;
            const start = (partNumber - 1) * partSize;
            const end = Math.min(start + partSize, totalBytes);
            const blob = entry.file.slice(start, end);
            active++;
            uploadOnePart(entry, partNumber, blob, (loaded) => { partBytesSent[partNumber] = loaded; reportProgress(); })
              .then(etag => { active--; results.push({ partNumber, etag }); pump(); })
              .catch(err => { active--; firstError = firstError || err; pump(); });
          }
        }
        pump();
      });

      if (entry.abortRequested) return;
      entry.status = 'processing';
      scheduleProgressUpdate(entry);
      completedParts.sort((a, b) => a.partNumber - b.partNumber);
      const completeRes = await fetch(`/api/orders/${orderId}/media/multipart/${entry.multipartSessionId}/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Access-Token': accessToken },
        body: JSON.stringify({ parts: completedParts })
      });
      const data = await completeRes.json().catch(() => ({}));
      const succeeded = data && Array.isArray(data.uploaded) && data.uploaded.length > 0;
      if (completeRes.ok && succeeded) {
        uploadQueue = uploadQueue.filter(q => q.localId !== entry.localId);
        memBatchDoneCount++;
        memBatchBytesDone += entry.file.size;
        renderQueueList();
        processUploadQueue();
        scheduleMemSync();
      } else {
        const failedEntry = data && Array.isArray(data.failed) ? data.failed[0] : null;
        entry.status = 'error';
        entry.errorMsg = (failedEntry && failedEntry.reason) || (data && data.error) || t.memories_upload_error;
        renderQueueRow(entry);
        processUploadQueue();
      }
    } catch (err) {
      if (entry.abortRequested) return;
      entry.status = 'error';
      entry.errorMsg = t.memories_upload_error;
      renderQueueRow(entry);
      processUploadQueue();
    }
  }

  const memFileInput = document.getElementById('mem-file-input');
  const memFileInputFallback = document.getElementById('mem-file-input-fallback');
  const memStatusEl = document.getElementById('mem-status');

  // ==========================================================================================
  // CERINTA 4 (2026-08-31, fallback "Colectii" iPhone) — diagnostic MINIM (niciodata nume de
  // fisier, continut media, albume sau alte date private), identic ca principiu cu memLog() deja
  // existent in comanda-mea.html/succes.html pentru aceeasi pagina de incarcare.
  // ==========================================================================================
  function memLog(event, data) {
    try { console.debug('[naluna-media]', { orderId, event, ...(data || {}) }); } catch (e) { /* diagnosticul nu opreste fluxul real */ }
  }
  const memIsIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const memIsInAppBrowser = /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|Telegram/i.test(navigator.userAgent);

  // Panou de recuperare — afisat STRICT dupa 'cancel' sau 'change' cu 0 fisiere de la ORICARE
  // dintre cele doua selectoare (niciodata preemptiv, niciodata redeschis programatic). Ascuns
  // automat imediat ce un lot real de fisiere e primit (handleFilesReceived mai jos).
  const memRecoveryEl = document.getElementById('mem-recovery');
  function showRecoveryUI() {
    if (!memRecoveryEl) return;
    const safariHint = document.getElementById('mem-recovery-safari');
    if (safariHint) safariHint.style.display = memIsInAppBrowser ? 'block' : 'none';
    memRecoveryEl.style.display = 'block';
    memLog('recovery_shown', { ios: memIsIOS, inAppBrowser: memIsInAppBrowser });
  }
  function hideRecoveryUI() {
    if (memRecoveryEl) memRecoveryEl.style.display = 'none';
  }

  // Logica COMUNA de "am primit fisiere" — apelata identic de ambele inputuri (Photos normal SI
  // fallback-ul "Alege din Fișiere"), ca loaderul agregat si coada sa se comporte identic
  // indiferent de care selector a livrat fisierele.
  function handleFilesReceived(files) {
    hideRecoveryUI();
    // Cerinta 4: comutarea la etapa de incarcare (a doua "vedere", acelasi document) se face
    // STRICT AICI — imediat DUPA copierea sincrona a FileList-ului de catre apelant, niciodata
    // inainte. Fisierele raman in memorie (obiecte File reale, deja copiate) — comutarea e STRICT
    // vizuala.
    enterUploadStage();
    // Mesaj SINCRON, cu numarul REAL de materiale primite — cerinta explicita (2026-08-29):
    // "Am primit N materiale. Se pregătesc și se încarcă automat. Nu închide pagina."
    memStatusEl.textContent = t.memories_received_count(files.length);
    memStatusEl.className = 'mem-status';

    memBatchTotal += files.length;
    memBatchTotalBytes += files.reduce((s, f) => s + (f.size || 0), 0);

    const newEntries = [];
    files.forEach(file => {
      try {
        const entry = {
          localId: 'q' + Math.random().toString(36).slice(2),
          file,
          section: null,
          status: 'pending',
          progress: 0,
          errorMsg: null,
          thumbUrl: null,
          xhr: null,
          multipartSessionId: null,
          abortRequested: false
        };
        uploadQueue.push(entry);
        newEntries.push(entry);
      } catch (err) {
        uploadQueue.push({
          localId: 'q' + Math.random().toString(36).slice(2),
          file,
          section: null,
          status: 'error',
          progress: 0,
          errorMsg: t.memories_upload_error,
          thumbUrl: null,
          xhr: null,
          multipartSessionId: null,
          abortRequested: false
        });
      }
    });
    // Toate randurile intra IMEDIAT, sincron, in interfata — inainte de orice operatiune
    // costisitoare (thumbnailuri/upload). updateBatchActiveState() (in renderQueueList) blocheaza
    // selectorul chiar in acest tick, sincron cu randarea.
    renderQueueList();
    // CORECȚIE (2026-08-29, "lasa browserului cel putin un frame sa picteze feedbackul inainte
    // de procesarea mai grea"): thumbnailurile si pornirea uploadurilor asteapta explicit un
    // requestAnimationFrame dupa randarea sincrona de mai sus, ca browserul sa apuce sa
    // deseneze cele N randuri INAINTE sa inceapa munca grea (decodare imagini, XHR).
    requestAnimationFrame(() => {
      processUploadQueue();
      newEntries.forEach(entry => { if (!isVideoFile(entry.file)) scheduleLocalThumbnail(entry); });
    });
  }

  // ==========================================================================================
  // CORECȚIE (2026-08-29, runda 2 — "selectorul ramane blocat, galeria nu se mai deschide"):
  // CAUZA EXACTA (confirmata prin testare reala pe iPhone): handlePickerOpenAttempt() era
  // inregistrat identic pe 'pointerdown' SI 'click'. La 'pointerdown' seta pickerLocked=true;
  // evenimentul 'click' LEGITIM care urma la milisecunde distanta gasea acel lock deja activ si
  // apela e.preventDefault() PE EL INSUSI, anuland actiunea nativa a inputului inainte sa apuce
  // sa deschida galeria — exact simptomul raportat ("apar mesajul, dar Photos nu se deschide").
  //
  // Solutie STRUCTURALA: feedback-ul vizual (pickerPending, STRICT pentru mesaje) e acum
  // complet SEPARAT de blocarea reala a selectorului. NICIUN handler de pointerdown/click nu
  // mai apeleaza preventDefault() — un click legitim, rezultat dintr-un gest real, ajunge
  // INTOTDEAUNA neatins la inputul nativ (deschide Photos pe iPhone, selectorul de fisiere pe
  // desktop). Singurul mecanism care CHIAR blocheaza selectorul (memFileInput.disabled) ramane
  // STRICT legat de un lot REAL, deja primit, aflat in procesare/upload —
  // updateBatchActiveState() de mai sus, neschimbat — niciodata de o simpla asteptare a
  // raspunsului din Photos.
  // ==========================================================================================
  let pickerPending = false;
  let pickerWaitingMessageShown = false;
  let pickerPreparingMessageShown = false;

  function clearPickerMessages() {
    pickerWaitingMessageShown = false;
    pickerPreparingMessageShown = false;
  }
  function showPickerPreparingMessage() {
    if (pickerPreparingMessageShown) return;
    pickerPreparingMessageShown = true;
    memStatusEl.textContent = t.memories_picker_preparing;
    memStatusEl.className = 'mem-status';
  }
  function showPickerWaitingMessage() {
    if (!pickerPending || pickerWaitingMessageShown) return;
    pickerWaitingMessageShown = true;
    memStatusEl.innerHTML = `${escapeHtml(t.memories_picker_waiting)} <button type="button" id="mem-picker-retry-btn" class="mem-picker-retry-btn"></button>`;
    memStatusEl.className = 'mem-status';
    const retryBtn = document.getElementById('mem-picker-retry-btn');
    retryBtn.textContent = t.memories_picker_retry;
    retryBtn.addEventListener('click', () => {
      pickerPending = false;
      clearPickerMessages();
      memStatusEl.textContent = '';
      memStatusEl.className = 'mem-status';
    });
  }
  // Afiseaza IMEDIAT starea de asteptare la intoarcere — FARA nicio intarziere artificiala.
  function handlePickerPossibleReturn() {
    if (!pickerPending) return;
    showPickerWaitingMessage();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) handlePickerPossibleReturn(); });
  window.addEventListener('focus', handlePickerPossibleReturn);
  window.addEventListener('pageshow', (event) => { if (event.persisted) handlePickerPossibleReturn(); });

  // pointerdown SI click ofera STRICT feedback vizual, NICIODATA preventDefault() — pointerdown
  // ajunge de regula inaintea lui 'click' pe touch/iOS, deci mesajul apare cat mai devreme
  // posibil; ambele apeleaza acelasi handler idempotent (showPickerPreparingMessage() nu
  // repeta randarea daca mesajul e deja afisat) — evenimentul nativ isi urmeaza intotdeauna
  // cursul normal, indiferent de starea acestor mesaje.
  function handlePickerOpenAttempt() {
    if (memFileInput.disabled) return;
    pickerPending = true;
    clearPickerMessages();
    showPickerPreparingMessage();
  }
  memFileInput.addEventListener('pointerdown', handlePickerOpenAttempt);
  memFileInput.addEventListener('click', handlePickerOpenAttempt);
  memFileInput.addEventListener('cancel', () => {
    pickerPending = false;
    clearPickerMessages();
    memStatusEl.textContent = '';
    memStatusEl.className = 'mem-status';
    memLog('picker_cancel', {});
    // CERINTA 4: recuperarea apare STRICT dupa un cancel REAL — niciodata preemptiv.
    showRecoveryUI();
  });

  memFileInput.addEventListener('change', () => {
    pickerPending = false;
    clearPickerMessages();
    const files = Array.from(memFileInput.files);
    memFileInput.value = '';
    memLog('change', { filesLength: files.length, ios: memIsIOS });
    if (files.length === 0) {
      memStatusEl.textContent = t.memories_no_files_selected;
      memStatusEl.className = 'mem-status err';
      // CERINTA 4: revenire din selector FARA niciun fisier — al doilea moment declansator al
      // panoului de recuperare (pe langa 'cancel' de mai sus).
      showRecoveryUI();
      return;
    }
    handleFilesReceived(files);
  });

  // CERINTA 4 (2026-08-31) — al doilea input STATIC, FARA accept, folosit STRICT din panoul de
  // recuperare ("Alege din Fișiere"). Aceleasi reguli sigure ca inputul principal: niciun
  // input.click() programatic, niciun preventDefault() pe gest, activare STRICT prin <label>,
  // copiere sincrona a FileList-ului, resetarea value() dupa copiere. Fisierele primite trec prin
  // ACEEASI validare client+server ca traseul normal — handleFilesReceived() e functia comuna.
  if (memFileInputFallback) {
    memFileInputFallback.addEventListener('cancel', () => { memLog('fallback_picker_cancel', {}); });
    memFileInputFallback.addEventListener('change', () => {
      const files = Array.from(memFileInputFallback.files);
      memFileInputFallback.value = '';
      memLog('fallback_change', { filesLength: files.length });
      if (files.length === 0) return; // ramane pe panoul de recuperare deja vizibil, nimic nou de aratat
      handleFilesReceived(files);
    });
  }

  // Avertizare best-effort la parasirea paginii cat timp un upload e activ — cerinta explicita.
  window.addEventListener('beforeunload', (e) => {
    if (uploadQueue.some(q => q.status === 'uploading' || q.status === 'processing')) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // ==========================================================================================
  // Butonul "Creează videoclipul" — MUTAT din melodia-mea.html (2026-08-29): acelasi endpoint
  // (POST /create-video) si aceeasi navigare catre pagina EXISTENTA de procesare
  // (se-creeaza-video.html) la 2xx SAU 409 (job deja activ, tot un caz de "asteapta pe pagina
  // de procesare") — previne cereri duplicate la double-tap prin dezactivarea SINCRONA a
  // butonului la primul click, inainte de orice cerere de retea. NU porneste randarea automat
  // la ultimul upload — STRICT la aceasta apasare explicita.
  // ==========================================================================================
  let giftVideoCreateRequested = false;
  document.getElementById('gift-video-create-btn').addEventListener('click', async () => {
    if (giftVideoCreateRequested) return;
    giftVideoCreateRequested = true;
    const btn = document.getElementById('gift-video-create-btn');
    btn.disabled = true;
    hideConfirmFailedMessage();
    let res = null;
    try {
      res = await fetch(`/api/orders/${orderId}/create-video`, {
        method: 'POST',
        headers: { 'X-Access-Token': accessToken }
      });
    } catch (e) { /* res ramane null -> ramura de eroare de mai jos */ }

    if (res && (res.ok || res.status === 409)) {
      window.location.href = `/se-creeaza-video.html?id=${encodeURIComponent(orderId)}&token=${encodeURIComponent(accessToken)}`;
      return;
    }

    let message = t.msg_try_again;
    if (res) {
      try { const data = await res.json(); if (data && data.error) message = data.error; } catch (e) { /* body nu era JSON valid */ }
    }
    const errEl = document.getElementById('gift-video-create-error');
    errEl.textContent = t.msg_error_prefix + message;
    errEl.style.display = 'block';
    btn.disabled = false;
    giftVideoCreateRequested = false;
  });

  // ==========================================================================================
  // Bootstrap — validare STRICTA: comanda + token reale, plan='video', varianta finala deja
  // stabilita (aceeasi conditie ca #memories-cta din melodia-mea.html). Daca videoclipul e deja
  // gata sau in curs, redirectionam catre pagina corecta (preview final / procesare) — pagina
  // de upload nu are sens de aratat in acele cazuri.
  // ==========================================================================================
  async function loadOrder() {
    try {
      const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}?token=${encodeURIComponent(accessToken)}`);
      if (!res.ok) {
        showState('notfound-state');
        return;
      }
      const order = await res.json();
      lang = supportedLangs.includes(order.lang) ? order.lang : 'ro';
      t = T[lang];
      applyStaticTexts();

      const pendingVariantChoice = !order.selectedVariantId && (order.variants || []).length > 1;
      const eligible = order.plan === 'video' && !!order.selectedVariantId && !pendingVariantChoice
        && ['preview_ready', 'ready'].includes(order.status);
      if (!eligible) {
        showState('not-eligible-state');
        return;
      }
      if (order.videoStatus === 'ready') {
        window.location.href = `/melodia-mea.html?id=${encodeURIComponent(orderId)}&token=${encodeURIComponent(accessToken)}`;
        return;
      }
      if (order.videoStatus === 'generating' || order.videoStatus === 'stale') {
        window.location.href = `/se-creeaza-video.html?id=${encodeURIComponent(orderId)}&token=${encodeURIComponent(accessToken)}`;
        return;
      }

      renderMemories(order);
      showState('content-state');
    } catch (err) {
      applyStaticTexts();
      showState('notfound-state');
    }
  }

  applyStaticTexts();
  loadOrder();
</script>
</body>
</html>
